# wpa_supplicant template for the zero image — WiFi is PREPARED, not enabled.
# Fill in a network block on the RUNNING board (credentials are never baked
# into an image), then uncomment the wlan0 stanza in /etc/conf.d/net and:
#   rc-update add net.wlan0 default && rc-service net.wlan0 start
# The Zero 2 W radio is a brcmfmac43436 (firmware: raspberrypi-wifi-ucode).
ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=wheel
update_config=1

# Example — copy, uncomment, replace both values (or use: wpa_passphrase SSID):
#network={
#    ssid="your-network-name"
#    psk="your-passphrase"
#}
