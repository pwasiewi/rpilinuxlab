# wpa_supplicant template for the zero image — WiFi is PREPARED, not enabled.
# Fill in a network block on the RUNNING board (credentials are never baked
# into an image), then uncomment the matching stanza in /etc/conf.d/net and:
#   ln -s net.lo /etc/init.d/net.<iface>
#   rc-update add net.<iface> default && rc-service net.<iface> start
#
# Two radios can be present:
#   wlan0   the onboard brcmfmac43436 (firmware: raspberrypi-wifi-ucode),
#           2.4 GHz only
#   wlanac  a COMFAST CF-922AC / MediaTek MT7612U on USB (driver mt76x2u,
#           firmware mediatek/mt7662{,_rom_patch}.bin), 2.4 + 5 GHz. The name
#           is pinned by /etc/udev/rules.d/70-cf922ac.rules; the same file
#           ejects the stick's ZeroCD so it stops being a CD-ROM and becomes
#           a WiFi adapter.
#
# This one file serves both interfaces. To give them different networks, split
# it into /etc/wpa_supplicant/wpa_supplicant-wlan0.conf and
# wpa_supplicant-wlanac.conf — netifrc prefers the per-interface file.
ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=wheel
update_config=1

# Example — copy, uncomment, replace both values (or use: wpa_passphrase SSID):
#network={
#    ssid="your-network-name"
#    psk="your-passphrase"
#}
