# Desktop-NVIDIA images (amdkde, nvidiahard — the gen2db RTX 5070 Ti target).
# Active options only, distilled from the host's nvidia.conf; the stock
# Gentoo template commentary lives in the nvidia-drivers package docs.

blacklist nouveau
blacklist nova_core

options nvidia-drm fbdev=1
options nouveau modeset=1

# Suspend/resume with video memory preserved (systemd suspend hooks).
options nvidia \
	NVreg_PreserveVideoMemoryAllocations=1 \
	NVreg_TemporaryFilePath=/var/tmp \
	NVreg_UseKernelSuspendNotifiers=1

# Device files root:video 0660, managed by the driver.
options nvidia \
	NVreg_DeviceFileGID=27 \
	NVreg_DeviceFileMode=432 \
	NVreg_DeviceFileUID=0 \
	NVreg_ModifyDeviceFiles=1

remove nvidia modprobe -r --ignore-remove nvidia-drm nvidia-modeset nvidia-uvm nvidia
