# Build this out-of-tree kernel module with clang, because the kernel itself
# is built with clang (xstage passes LLVM=1 to genkernel, which is what makes
# CONFIG_DEBUG_INFO_BTF possible next to RANDSTRUCT_FULL — see
# genstage/live/kernel/live.fragment).
#
# This is not a preference, it is a hard requirement: an out-of-tree module
# built WITHOUT LLVM=1 against a clang-built tree fails immediately (verified
# 2026-08-10 — the identical build succeeds with the flag and dies without
# it). MODULES_EXTRA_EMAKE is linux-mod-r1.eclass's documented user variable
# and is appended to MODULES_MAKEARGS last (eclass:1370), so it wins over the
# CC the eclass sets itself.
#
# Verified to build clean this way against 7.1.5-zen + clang 22.1.8:
#   x11-drivers/nvidia-drivers-610.57.04      5 modules
#   app-emulation/virtualbox-modules-7.2.14   3 modules
#   sys-apps/openrazer-3.12.4                 4 modules
# all with matching vermagic (...modversions RANDSTRUCT_<hash>).
MODULES_EXTRA_EMAKE="LLVM=1"
