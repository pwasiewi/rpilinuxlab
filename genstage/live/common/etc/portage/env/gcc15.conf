# Build this package with gcc-15, not the image's default gcc-16.
#
# Why a split and not a global gcc cap: nvcc from nvidia-cuda-toolkit-13.3.1
# refuses a host compiler newer than gcc-15 (cuda-config's supported set tops
# out at 15), so every package that feeds a .cu file to nvcc has to see gcc-15
# as its host/ccbin compiler. The rest of the image — Qt/KDE, browsers,
# office, the whole desktop — has no such limit and builds with the tree's
# gcc-16. Pinning ONLY the CUDA packages here keeps the maintained list small
# and lets the desktop track the tree.
#
# Safe by construction: the system compiler is gcc-16, so the installed
# libstdc++ is gcc-16's, which carries every older GLIBCXX_* symbol version.
# A gcc-15-built object links the older symbols and runs fine against the
# newer runtime; the unsafe direction (gcc-16 object on a gcc-15 runtime)
# never occurs. Same C++ ABI since gcc-5, one libstdc++.so.6 soname, so the
# gcc-15 and gcc-16 objects interlink within a single binary (e.g. libtorch).
#
# Bonus over the old mask: forcing the host half to gcc-15 too (not just the
# nvcc ccbin, which cuda_gccdir already redirects) reproduces exactly the
# all-gcc-15 configuration the ::pwr caffe2/vllm patch series was validated
# against on the gcc-15 host — so for these packages it is the tested build,
# not a new host16/ccbin15 mixture.
#
# Requires: gcc:15 stays installed alongside gcc:16. nvidia-cuda-toolkit's
# '<sys-devel/gcc-16_pre' DEPEND keeps it in @world; the slot-15 binaries
# named below exist whenever it is.
#
# CC/CXX cover the host C++; CUDAHOSTCXX covers nvcc's ccbin for the ebuilds
# that read the env directly (pytorch, vllm setup.py). cuda.eclass consumers
# (caffe2, cutlass, llama-cpp) additionally pick gcc-15 via cuda_gccdir on
# their own — belt and braces, both agree on 15.
CC="gcc-15"
CXX="g++-15"
CPP="cpp-15"
CUDAHOSTCXX="g++-15"
