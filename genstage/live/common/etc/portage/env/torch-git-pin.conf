# Pin sci-ml/caffe2-9999 and sci-ml/pytorch-9999 to ONE pytorch.git commit.
#
# Both ebuilds are git-r3 live ebuilds against https://github.com/pytorch/pytorch
# and they are ABI-locked: caffe2 builds libtorch, pytorch builds the python
# bindings and reuses caffe2's cmake cache from /var/lib/caffe2/. Bindings
# compiled from a different tree than the library they link against give the
# undefined-symbol failures in _C.so that ::pwr exists to avoid.
#
# It is NOT enough to merge them back to back. git-r3 namespaces its refs PER
# PACKAGE inside the shared mirror:
#
#   refs/git-r3/sci-ml/caffe2/0/__main__
#   refs/git-r3/sci-ml/pytorch/0/__main__
#
# so the two never share a fetch, and each resolves "newest commit on main" at
# its own src_unpack. On a build where caffe2 alone takes hours, HEAD has moved
# by the time pytorch unpacks. (When this pin was added the mirror's two refs
# were already 19 days apart.) Pinning is the only thing that actually couples
# them; EVCS_OFFLINE=1 would not — it just freezes each package on whatever
# stale ref it happens to hold.
#
# Two things ride along for free:
#   * the ::pwr caffe2 patch series is context-sensitive against HEAD (see
#     files/caffe2-9999-*.patch.xz). Pinning fixes the tree those patches were
#     respun and verified against, instead of re-rolling the dice each build.
#   * PROF_LIVE_CYCLE_BOOTSTRAP builds caffe2 twice by design. Identical source
#     across both builds is what makes ccache-cuda.conf pay off; without the
#     pin the second build recompiles nearly everything.
#
# Bumping: pick a commit, verify caffe2 still builds with the ::pwr patch series
# applied in ebuild order (individual dry-runs give false failures when a hunk
# depends on an earlier hunk in the same file), then update this one line.
# Submodules follow automatically — they are gitlinks in the pinned tree.
#
# 2026-08-07: [TorchElastic] handle EADDRINUSE message of libuv (#191561)
EGIT_COMMIT="ac94967f5f924980a1492d127b5a2e9f83f226ed"
