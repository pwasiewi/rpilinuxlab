# For packages whose ebuild refuses to build at all under FEATURES=ccache.
#
# The image sets ccache globally (PROF_LIVE_CCACHE_DIR), and dev-java/openjdk
# checks for it in pkg_pretend and dies outright:
#
#   has ccache ${FEATURES} && die "FEATURES=ccache doesn't work with ${PN}, bug #677876"
#
# pkg_pretend runs before anything is fetched or unpacked, so this is a hard
# stop at the start of the merge, not a build failure late in it.
FEATURES="-ccache"
