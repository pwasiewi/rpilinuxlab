# Hard parallelism cap for builds whose peak RSS per compiler process is
# measured in gigabytes rather than hundreds of megabytes.
#
# Written for sci-ml/caffe2, where the expensive processes are not cc1plus but
# nvcc's CUDA frontend, cicc. Each cicc holds ~1.5-2 GB resident while it
# compiles one .cu translation unit, and nothing in portage bounds how many run
# at once — MAKEOPTS does. The image's MAKEOPTS is "-j32", so caffe2 ran ~30
# cicc concurrently and took the whole 64 GB machine down with a global OOM
# (2026-08-07 10:00:25, followed by a reboot; the kill list was ~30 cicc at
# 352k-432k pages each). This host's own package.env has capped caffe2 at -j4
# for the same reason; the image simply never inherited that layer.
#
# -j4 rather than a load-average limit on purpose: -l bounds runnable
# processes, not resident memory, and it is memory that runs out here.
MAKEOPTS="-j4"
