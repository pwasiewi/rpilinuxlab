# Capped parallelism for the handful of C++ giants (webkit-gtk, qtwebengine).
# The image make.conf carries the host's MAKEOPTS="-j32" with emerge --jobs=16;
# at that setting cc1plus gets OOM-killed mid-build (observed: webkit-gtk
# 2.52.5, 64 GB host) and qtwebengine's check-reqs refuses to start at all
# (RAM demand scales with jobs). -j12 keeps the peak near 30 GB.
MAKEOPTS="-j12"
