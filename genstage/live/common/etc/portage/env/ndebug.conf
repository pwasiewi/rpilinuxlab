# Restore upstream Release semantics: cmake.eclass wipes CMAKE_*_FLAGS_<BUILD_TYPE>
# (including -DNDEBUG), so plain C assert() stays live in local builds.
#
# This is a correctness fix, not a performance tweak. sci-ml/caffe2:
# torch/csrc/dynamo/eval_frame.c dup_obj() calls PyStackRef_DUP() on NULL
# localsplus slots under Python 3.14 -> assert -> SIGABRT. Under NDEBUG
# PyStackRef_DUP(NULL) is a no-op, because NULL has Py_TAG_REFCNT set.
#
# This image is PYTHON_SINGLE_TARGET="python3_14", so it is squarely in the
# affected configuration: without this the ML stack builds and then aborts at
# import time — the expensive kind of failure, hours after the mistake.
CPPFLAGS="${CPPFLAGS} -DNDEBUG"
