# Make ccache actually useful for CUDA-heavy packages.
#
# FEATURES=ccache and CCACHE_DIR are already global in this image, but the
# ccache default CCACHE_MAXSIZE is 5G — far smaller than one caffe2 or vLLM
# object set. The cache thrashes, every nvcc object is evicted before it can
# ever be reused, and the cache costs disk while returning nothing.
#
# It matters more here than on the host: PROF_LIVE_CYCLE_BOOTSTRAP builds
# sci-ml/caffe2 TWICE by design (once with -gloo to open the gloo<->caffe2
# cycle, then again with gloo once gloo[cuda] exists). The second build is only
# affordable if the first one's nvcc objects are still in the cache.
#
# The sloppiness list is what lets nvcc hits land at all: nvcc rewrites
# __TIME__-style macros and touches include timestamps, which ccache otherwise
# treats as cache-invalidating.
FEATURES="ccache"
CCACHE_DIR="/var/cache/ccache"
CCACHE_MAXSIZE="150G"
CCACHE_SLOPPINESS="locale,time_macros,include_file_ctime,include_file_mtime"
