# The image ships ImageMagick's restrictive default policy.xml (SVG coder
# denied) — worth keeping system-wide. Some builds (usbview) legitimately
# rasterise their own bundled SVG icon at compile time. IM takes the FIRST
# policy.xml found on MAGICK_CONFIGURE_PATH, so point it at a directory with
# an empty policy for the duration of that build only.
MAGICK_CONFIGURE_PATH="/etc/portage/env/magick-first-config"
