# Wayland greeter everywhere — same keys 'configure' bakes into the autologin
# drop-in, shipped separately so the install runbook's "undo the live
# conveniences" (rm 10-xstage-autologin.conf) does not silently flip sddm
# back to an X11 greeter with the xwayland artifacts that motivated this.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
