# xstage live image — eix cache methods.
#
# Read after the package's own 00-eixrc: eix reads all non-hidden files in
# /etc/eixrc alphabetically and the last assignment wins. Kept as a separate
# file on purpose — 00-eixrc belongs to app-portage/eix and /etc is
# CONFIG_PROTECTed, so editing it would raise a ._cfg0000_ on every upgrade.
#
# Patterns are matched against the RESOLVED PATH of the repo, never its name
# (eix(1), CACHE_METHOD), and the LAST matching entry wins — so a catch-all
# "* method" must be written ABOVE the per-repo lines, not below them, or it
# silently overrides every one of them. The image ships exactly two repos, both
# with a populated metadata/md5-cache:
#     /var/db/repos/gentoo   refreshed by every emerge --sync
#     /var/db/repos/pwr      auto-sync = no, seeded from the build host
# The trailing '*' in the patterns is not decoration: eix reports the main tree
# with a trailing slash ("/var/db/repos/gentoo/"), which a bare path misses.
#
# Do NOT copy the build host's "* assign" line into this image. assign reads
# portage's flat transfer cache in /var/cache/edb/dep, which exists only with
# FEATURES=metadata-transfer. The image does not set it, so assign would find
# an empty cache and eix would report an empty tree without an error.
#
# ::pwr is pinned to 'parse' rather than left on the eix default
# ('parse|ebuild*'), which EXECUTES an ebuild through bash whenever the text
# parse looks incomplete. Measured in this image: that fallback fires on the
# overlay's 9999 ebuilds and net-vpn/protonvpn-cli-2.2.12 fails outright,
# printing a build-log traceback in the middle of eix-update. 'parse' keeps the
# default CACHE_METHOD_PARSE appendix ("#metadata-md5#metadata-flat#assign"),
# so a fresh md5-cache entry is still preferred over the ebuild — it only drops
# the bash execution. Pinning ::pwr to plain metadata-md5 would be faster still
# but would make eix silently SKIP every ebuild the cache is behind on, and
# these are live ebuilds edited between egencache runs.
CACHE_METHOD="
    /var/db/repos/gentoo* metadata-md5
    /var/db/repos/pwr*    parse
 %{ADD_CACHE_METHOD}"
