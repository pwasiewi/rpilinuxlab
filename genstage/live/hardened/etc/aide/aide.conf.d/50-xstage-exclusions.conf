# AIDE exclusions for the xstage hardened image.
# Pulled in by the '@@include /etc/aide/aide.conf.d ^.*\.conf$' line that
# 'xstage ... squash' appends to /etc/aide/aide.conf — a fragment rather than a
# replacement, so an aide upgrade keeps shipping its own default and this file
# survives untouched.  Included LAST, so these rules win.
#
# Every entry below is a path that changes by itself on a running system: the
# point is that 'aide --check' reports real drift instead of a wall of noise
# nobody reads.  Earned on gen2db over real daily runs; gen2db-only paths
# (VirtualBox device nodes, VirtualGL's .vglrun.vars*) are deliberately left
# out, they would be dead rules here.

# Device nodes that appear, vanish and renumber with hotplug
!/dev/shm
!/dev/snd
!/dev/bus/usb
!/dev/char
!/dev/hidraw
!/dev/input/by-id
!/dev/input/by-path
!/dev/input/event

# Files the system rewrites on its own — anchored with $ so only the exact
# path is skipped, not everything below a same-named directory
!/etc/\.updated$
!/etc/mtab$
!/etc/adjtime$
!/etc/ld\.so\.cache$
!/etc/machine-id$
!/etc/resolv\.conf$
!/etc/\.resolv\.conf\..*
!/etc/cups/subscriptions\.conf$
!/etc/cups/subscriptions\.conf\.O$

# Debug-link tree regenerated by the toolchain, and two dangling krb5 man
# symlinks that AIDE otherwise reports on every run
!/usr/lib(64)?/\.build-id
!/usr/share/man/man5/\.k5identity\.5
!/usr/share/man/man5/\.k5login\.5

# The audit tooling's own output — it changes precisely because the audit ran
!/var/log/lynis-report\.dat$
!/var/log/lynis\.log$
!/var/log/aide/

# etckeeper's git object store. /etc is a git repo both on gen2db and inside the
# image — 'squash' runs `etckeeper init` + a baseline commit (xstage:2410-2418)
# immediately before `aide --init`, so AIDE hashes the object store WHILE git is
# still repacking it: hundreds of "open() failed for /etc/.git/objects/<..>"
# (loose objects git had just packed and deleted) plus "has been changed" on
# objects/info/packs and objects/pack/multi-pack-index. Those entries land in
# the baseline unhashed, and every later `aide --check` then reports git's
# ordinary gc churn as drift — 508 such lines in one host report before this
# rule existed. Nothing is lost by skipping it: git content is content-addressed
# and verified by git itself, so AIDE adds no integrity guarantee here, only
# noise.
!/etc/\.git
