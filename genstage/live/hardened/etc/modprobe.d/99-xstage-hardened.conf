# Module blacklist for the amd64kdehardened live image.
# Copied verbatim into the image by 'xstage amd64 conf' (PROF_LIVE_OVERLAY_DIR).
#
# Rare, historically vulnerable network protocols and filesystems. A rescue
# image is the one place where blacklisting filesystems can backfire, so the
# list stops at the genuinely obscure ones — ext/vfat/ntfs/btrfs/xfs stay
# loadable on purpose.

install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true
install n-hdlc /bin/true
install ax25 /bin/true
install netrom /bin/true
install x25 /bin/true
install rose /bin/true
install decnet /bin/true
install econet /bin/true
install af_802154 /bin/true
install ipx /bin/true
install appletalk /bin/true
install psnap /bin/true
install p8023 /bin/true
install p8022 /bin/true

install cramfs /bin/true
install freevxfs /bin/true
install jffs2 /bin/true
install hfs /bin/true
install hfsplus /bin/true
install udf /bin/true
# NOTE: squashfs is never blacklisted — the live root itself is a squashfs.

# Firewire and Thunderbolt DMA are classic evil-maid vectors on a machine you
# walked away from; a live image is exactly that machine.
install firewire-core /bin/true
install firewire-ohci /bin/true
install thunderbolt /bin/true
