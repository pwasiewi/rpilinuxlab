# net-misc/ntpsec installs /var/log/ntpstats as root:root, but its unit runs
# the daemon as 'ntp' (ExecStart=/usr/sbin/ntpd -g -N -u ntp:ntp). With
# 'statsdir /var/log/ntpstats' active in /etc/ntp.conf the daemon therefore
# logs, at every start:
#
#   statistics directory /var/log/ntpstats/ does not exist or is unwriteable,
#   error Permission denied
#
# ...and silently keeps no peer/loop statistics at all. Observed on the
# installed nvidiahard system 2026-08-13; the ebuild ships it that way, so it
# is not host drift and every image built from these profiles has it.
#
# A tmpfiles 'd' line adjusts an existing directory's owner and mode, so this
# corrects the ebuild's directory rather than racing to create one.
d /var/log/ntpstats 0755 ntp ntp -
