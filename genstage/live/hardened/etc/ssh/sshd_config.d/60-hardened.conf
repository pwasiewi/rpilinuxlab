# Hardened default for the INSTALLED system, shipped inert on the live medium.
#
# sshd uses first-obtained-value semantics and reads sshd_config.d in lexical
# order, so the live convenience drop-in 50-xstage.conf (PermitRootLogin yes,
# written by 'configure') wins while it exists. The install runbook removes
# 50-xstage.conf ("undo the live-medium conveniences"), and this file takes
# over — the installed system gets root login denied without copying any
# sshd_config from a kit.
PermitRootLogin no
