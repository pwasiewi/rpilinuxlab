# Make the graphical session survive memory pressure that a build causes.
#
# systemd ships user@.service with OOMScoreAdjust=100, and systemd-user.conf's
# DefaultOOMScoreAdjust adds another +100 for anything an UNPRIVILEGED manager
# starts ("this makes service processes slightly more likely to be killed under
# memory pressure than the manager itself"). Measured on nvhard 2026-08-13:
#
#   user@1000.service manager   oom_score_adj = 100
#   plasmashell / kwin_wayland  oom_score_adj = 200
#   pipewire / wireplumber      oom_score_adj = 200
#   sshd (system service)       oom_score_adj = -1000
#
# So out of the box the entire desktop is the FIRST thing the kernel picks,
# ahead of every system service. That is a sensible default for a server, where
# a user session is expendable. It is the wrong way round on these images: they
# are KDE desktops that also compile packages all day, and the process that
# actually eats the RAM is a compiler (cicc, cc1plus, rustc, ld) under portage,
# which is exactly what should die instead.
#
# What the default costs, observed on this host: an ~5 GB CUDA cicc pushed the
# box into OOM, the kernel took user@1000.service, and the symptom was
# 'systemctl --user' answering "Connection refused" with dead audio — a broken
# session needing a manual restart plus a sound reset, from an event that
# should have cost one build job.
#
# -500 puts the manager well below every system service; its children land at
# -400 by the +100 rule above, still comfortably negative. Not -1000: the
# session should remain killable as a last resort rather than forcing the
# kernel to take init's side of the tree.
#
# Applies to the template, not user@1000 specifically, so it holds for whatever
# UID the image's user ends up with.
#
# Trade-off worth knowing: this also protects session processes that are
# themselves the hog (a browser with a hundred tabs). The bet is that on these
# machines the memory hog is nearly always a build in system.slice.
[Service]
OOMScoreAdjust=-500
