# Wayland greeter everywhere — same keys 'configure' bakes into the autologin
# drop-in, shipped separately so removing the autologin convenience
# (rm 10-xstage-autologin.conf) does not silently flip sddm back to an X11
# greeter. Mirrors genstage/live/common's file; the Pi renders it on vc4/v3d.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
