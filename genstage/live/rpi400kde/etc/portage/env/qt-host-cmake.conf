# Cross-building any dev-qt/* module: the qtbase ebuild passes
# -DQT_HOST_PATH=/usr so cmake can run the HOST's moc/rcc/syncqt, but never
# sets QT_HOST_PATH_CMAKE_DIR — and Qt's default probe is
# ${QT_HOST_PATH}/lib/cmake. On an amd64 host /usr/lib/cmake EXISTS (32-bit
# ABI leftovers) yet carries no Qt6*Tools configs — they live in
# /usr/lib64/cmake — so configure dies with 'Failed to find the host tool
# "Qt6::syncqt"'. MYCMAKEARGS is cmake.eclass's documented user escape; on
# the card (native build, no QT_HOST_PATH) the extra define is inert.
MYCMAKEARGS="-DQT_HOST_PATH_CMAKE_DIR=/usr/lib64/cmake"
