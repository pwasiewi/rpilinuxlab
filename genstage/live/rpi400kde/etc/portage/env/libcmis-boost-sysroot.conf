# libcmis' boost.m4 defaults --with-boost to /usr and injects a bare
# "-I/usr/include" into the cross compile — HOST glibc/boost headers mixed
# into the aarch64 conftest kill the header check ("cannot find
# boost/date_time/..."). Point it at the sysroot prefix instead; the -I it
# derives then duplicates the compiler's own sysroot default harmlessly.
EXTRA_ECONF="--with-boost=/usr/aarch64-unknown-linux-gnu/usr"
# gcc 16 (2026-10-08): --with-boost alone now BREAKS the build. boost.m4 turns
# it into BOOST_CPPFLAGS=-I<sysroot>/usr/include (seen as -isystem on the
# compile line), which puts the sysroot's C headers ahead of libstdc++'s own
# directory, and <cstdlib>'s #include_next <stdlib.h> then finds nothing:
# "fatal error: stdlib.h: No such file or directory". Pre-seed the cache var
# boost.m4 reads: 'yes' = headers are on the compiler's DEFAULT path (the
# cross gcc's --sysroot), so BOOST_CPPFLAGS stays empty. --with-boost above
# stays: it still steers the library search at the sysroot instead of the
# host's /usr/lib*.
export boost_cv_inc_path=yes
