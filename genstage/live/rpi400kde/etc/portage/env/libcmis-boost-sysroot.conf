# libcmis' boost.m4 defaults --with-boost to /usr and injects a bare
# "-I/usr/include" into the cross compile — HOST glibc/boost headers mixed
# into the aarch64 conftest kill the header check ("cannot find
# boost/date_time/..."). Point it at the sysroot prefix instead; the -I it
# derives then duplicates the compiler's own sysroot default harmlessly.
EXTRA_ECONF="--with-boost=/usr/aarch64-unknown-linux-gnu/usr"
