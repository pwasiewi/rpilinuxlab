# ragel's configure uses AC_CHECK_FILES, which autoconf hard-refuses under
# cross ("cannot check for file existence when cross compiling") — the only
# out is pre-seeding the cache vars. Verified against the 7.0.4 tree:
#  - /usr/bin/colm: checked twice (--with-colm arg + $COLM), same cache var;
#    the sysroot really ships usr/bin/colm, so "yes" is the true answer.
#  - ./DIST: absent from the release tarball; "no" only flips the
#    build_manual default, which the ebuild's --disable-manual overrides.
export ac_cv_file__usr_bin_colm=yes
export ac_cv_file___DIST=no
