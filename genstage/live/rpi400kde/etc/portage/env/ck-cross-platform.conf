# concurrencykit's hand-written configure detects the platform with uname on
# the BUILD host and force-feeds the aarch64 cross gcc "-m64 -D__x86_64__"
# ("unrecognized command-line option '-m64'", pkgs 2026-08-16). It does take
# --platform to skip autodetection, and econf appends EXTRA_ECONF. Correct on
# the card too — there the value simply matches the native uname.
EXTRA_ECONF="--platform=aarch64"
