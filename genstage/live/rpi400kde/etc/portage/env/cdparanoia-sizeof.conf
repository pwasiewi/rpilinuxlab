# cdparanoia's 2008-era configure probes type sizes with RUNTIME tests
# (autoconf 2.13-style AC_CHECK_SIZEOF), which cannot execute under cross
# and silently yield 0 -> "No 16 bit type found on this platform!".
# Pre-seed the four cache vars with the LP64 aarch64 answers.
export ac_cv_sizeof_short=2
export ac_cv_sizeof_int=4
export ac_cv_sizeof_long=8
export ac_cv_sizeof_long_long=8
