# kde-plasma/plasma-workspace-wallpapers (6.7.5) is a data-only project that
# never declares its Qt major: it includes ECM's KDEInstallDirs, which picks
# KDEInstallDirs${QT_MAJOR_VERSION} and, unset under cross, takes the Qt5
# branch — querying QT_INSTALL_IMPORTS (a Qt5-only key) from the host Qt 6
# qtpaths: "Qt5 qmake call failed: 101" (2026-10-08). Force the Qt 6 branch.
# MYCMAKEARGS replaces the global xprofile-cmake-cross.conf value, so the
# global flags are restated in front.
MYCMAKEARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY -DQUERY_EXECUTABLE=/usr/lib64/qt6/bin/qtpaths -D_cli_option=--query -DQT_MAJOR_VERSION=6"
