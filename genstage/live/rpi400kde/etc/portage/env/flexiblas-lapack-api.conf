# flexiblas probes the system LAPACK version by try_run-ning a Fortran
# program that calls ILAVER — impossible under cross, and the empty result
# fatals on "LAPACK_API_VERSION needs to be set". Pre-setting the variable
# skips the whole probe (cmake/lapack.cmake takes the ELSE branch). Value =
# the sysroot's sci-libs/lapack (3.12.1-r2); ILAVER reports the upstream
# version, so revision suffixes are not part of it. Bump alongside lapack.
# Two more try_run probes share cache vars: _RUN_RES is REUSED by every
# FindOpenBLAS<variant>/FindBlis<variant> module (one value cannot say
# "pthread yes, serial no"), so seed it as 1 = variant probes fail — the
# named variant backends are skipped and the generic OpenBLAS backend
# remains, which is the one the default points at. ZDOTC_MKL_EXITCODE=1:
# the probe tests the MKL return-value convention for complex functions;
# gfortran-built openblas/lapack use the GNU convention, so the honest
# answer is "test fails".
# MYCMAKEARGS replaces the global xprofile-cmake-cross.conf value; the
# PACKAGE=ONLY confinement and ECMQueryQt seeds ride along unchanged.
MYCMAKEARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY -DQUERY_EXECUTABLE=/usr/lib64/qt6/bin/qtpaths -D_cli_option=--query -DLAPACK_API_VERSION=3.12.1 -D_RUN_RES=1 -D_RUN_RES__TRYRUN_OUTPUT= -DZDOTC_MKL_EXITCODE=1"
