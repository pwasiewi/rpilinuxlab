# wx consumers find wxWidgets through wx-config, and the HOST script hands
# out host include paths — the compile then reads /usr/include/wx-3.2 and
# dies on the per-arch wx/setup.h (passwordsafe, 2026-08-17). Point cmake's
# FindwxWidgets at the SYSROOT's cross wx-config and rebase its baked /usr
# prefix with --prefix (supported by the script; verified to emit
# sysroot-rooted -I/-L). MYCMAKEARGS replaces the global
# xprofile-cmake-cross.conf value; PACKAGE=ONLY and the ECMQueryQt seeds
# ride along unchanged.
MYCMAKEARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY -DQUERY_EXECUTABLE=/usr/lib64/qt6/bin/qtpaths -D_cli_option=--query -DwxWidgets_CONFIG_EXECUTABLE=/usr/aarch64-unknown-linux-gnu/usr/lib64/wx/config/aarch64-unknown-linux-gnu-gtk3-unicode-3.2 -DwxWidgets_CONFIG_OPTIONS=--prefix=/usr/aarch64-unknown-linux-gnu/usr"
