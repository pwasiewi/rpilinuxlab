# Cross-building ghostscript with --enable-cups: configure's AC_PATH_TOOL
# finds only the HOST's /usr/bin/cups-config, notices it equals the build
# machine's and deliberately clears CUPSCONFIG — then --enable-cups turns
# that into "error: libcups/libcupsimage not found" even though the sysroot
# has cups fully installed. Presetting CUPSCONFIG to the sysroot's script is
# the documented autoconf override ("let the user override the test");
# its output is sysroot-safe (empty --cflags/--ldflags, bare -lcups, so the
# cross ld resolves it in the sysroot's default search path). NOTE: portage
# env files are make.conf-style key=value, no shell logic — so this cannot
# be guarded for the card; a native re-emerge of ghostscript on the Pi must
# first drop this file (the path does not exist there and configure would
# take the preset at face value).
CUPSCONFIG="/usr/aarch64-unknown-linux-gnu/usr/bin/cups-config"
