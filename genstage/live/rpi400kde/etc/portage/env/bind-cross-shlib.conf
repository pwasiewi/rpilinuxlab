# bind's rndc links libisccfg.so, whose DT_NEEDED chain reaches the not yet
# installed sibling libns-9.20.26.so in the build tree. Cross ld cannot locate
# it (no -rpath-link into ../lib/ns/.libs) and hard-fails on the resulting
# "undefined reference to ns_plugin_*". The NEEDED entries themselves are
# correct — the target's runtime linker resolves them once the package is
# installed — so only relax link-time symbol verification for shared libs.
LDFLAGS="${LDFLAGS} -Wl,--allow-shlib-undefined"
