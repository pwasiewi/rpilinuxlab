# Cross-compiling ruby requires a native "baseruby" interpreter of the same
# minor version to generate parser/encoding sources; the ebuild passes
# --without-baseruby unconditionally and configure hard-fails with
# "executable host ruby is required for cross-compiling". EXTRA_ECONF is
# appended after the ebuild's args, so this overrides it. Host ruby33
# (3.3.11) matches the target version exactly.
EXTRA_ECONF="--with-baseruby=/usr/bin/ruby33"
