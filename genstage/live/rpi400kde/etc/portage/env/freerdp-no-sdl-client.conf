# Two cross fixes for freerdp, both configure-time:
#
# WITH_CLIENT_SDL=OFF — cmake/ConfigOptions.cmake defaults it ON whenever
# WITH_CLIENT is on and the ebuild only sets the inner SDL2/SDL3 switches,
# so client/SDL's own project() still runs; it inherits freerdp's
# CMAKE_FIND_ROOT_PATH_MODE_PROGRAM ONLY (set under CMAKE_CROSSCOMPILING —
# upstream assumes the toolchain lives in the sysroot) and dies unable to
# resolve the bare cross-g++ from PATH. USE=-sdl already drops the deps;
# krdc and xfreerdp remain the RDP clients on this image.
#
# GenerateArgumentManpage_DIR — the man pages come from an in-tree NATIVE
# tool; under cross, upstream find_package()s an import instead of building
# it. The import lives in the sysroot at opt/freerdp-native/ (binary + its
# rebuild recipe in the Config.cmake comment; compiled once per freerdp
# version from a configured build tree — it only reads client/cmdline.h).
# Disabling WITH_MANPAGES instead is NOT an option: the ebuild's
# src_install does `mv .../man7/wlog.7 || die`. Phase hooks cannot build
# the tool on the fly: /etc/portage/env files are parsed as key=value
# config, not bashrc — function definitions are a parse error.
#
# MYCMAKEARGS replaces the global xprofile-cmake-cross.conf value, so the
# PACKAGE=ONLY confinement and the ECMQueryQt seeds ride along unchanged.
MYCMAKEARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY -DQUERY_EXECUTABLE=/usr/lib64/qt6/bin/qtpaths -D_cli_option=--query -DWITH_CLIENT_SDL=OFF -DGenerateArgumentManpage_DIR=/usr/aarch64-unknown-linux-gnu/opt/freerdp-native"
