# media-libs/lsp-plugins picks its DSP backend from the BUILD host:
# make/system.mk sets BUILD_ARCH from `uname -m` unless ARCHITECTURE is set,
# so a cross build compiles the x86 SSE/MMX/3DNow sources with the aarch64
# compiler ("unrecognized command-line option '-mmmx'", 2026-10-08).
# The ebuild never passes ARCHITECTURE, so the environment value wins.
export ARCHITECTURE="aarch64"
