# For Makefiles that hardcode a bare "cc" and get the environment's TARGET
# CFLAGS fed to the HOST compiler ("bad value armv8-a", aha 2026-08-16).
# A make command-line assignment overrides even a hardcoded CC=; CHOST
# comes from the sysroot make.conf, so on the card this is a no-op alias.
MAKEOPTS="${MAKEOPTS} CC=${CHOST}-gcc CXX=${CHOST}-g++"
