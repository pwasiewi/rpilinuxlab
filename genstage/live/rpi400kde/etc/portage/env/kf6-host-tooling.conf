# KDE packages that cross-build a native helper tool (kwin's
# qtwaylandscanner_kde via src/wayland/tools) refuse to configure without
# -DKF6_HOST_TOOLING=<host cmake dir>; upstream derives the native prefix
# from the path segment before /lib (so /usr/lib64/cmake -> /usr) and builds
# the tool with the HOST toolchain via ExternalProject. That nested native
# cmake inherits the environment's ARM CFLAGS, hence the neutral flags here
# (same mechanism as neutral-cflags.conf). MODE_PACKAGE=ONLY must be repeated
# because this MYCMAKEARGS replaces the global one from cmake-cross.conf.
MYCMAKEARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY -DKF6_HOST_TOOLING=/usr/lib64/cmake"
CFLAGS="-O2 -pipe"
CXXFLAGS="-O2 -pipe"
