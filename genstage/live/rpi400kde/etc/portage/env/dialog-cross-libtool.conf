# dialog's makefile drives library links through a STANDALONE libtool found
# in PATH (--with-libtool is unconditional in the ebuild). The host
# /usr/bin/libtool's --tag=CC config has CC=x86_64-pc-linux-gnu-gcc baked
# in and standalone libtool uses THAT for shared-lib creation, ignoring the
# cross gcc on its command line -> aarch64 objects fed to the x86 ld
# ("Relocations in generic ELF (EM: 183)"). Point configure's
# AC_CHECK_PROG cache at the sysroot's cross-merged libtool script instead
# (dev-build/libtool in PROF_SYSROOT_PKGS): same trick the ebuild itself
# uses on Darwin with glibtool. The script is host-runnable POSIX shell
# with CC/LTCC=aarch64-unknown-linux-gnu-gcc baked in.
export ac_cv_prog_LIBTOOL=/usr/aarch64-unknown-linux-gnu/usr/bin/libtool
