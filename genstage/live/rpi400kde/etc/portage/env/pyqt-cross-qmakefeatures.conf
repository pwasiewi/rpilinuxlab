# pyqt6 builds through the HOST qmake (sip-build --qmake /usr/lib64/qt6/bin/
# qmake), whose qconfig.pri enables the no_direct_extern_access feature —
# the feature .prf then appends x86-only -mno-direct-extern-access AFTER the
# ebuild's cross QMAKE_CXXFLAGS override (feature files process post-.pro).
# QMAKEFEATURES is searched before the mkspecs features tree; point it at
# the repo's no-op override of that one .prf. Path assumes the standard
# rpilinuxlab checkout — adjust alongside XP_LAB_DIR if the lab ever moves.
export QMAKEFEATURES=/home/pwas/Claude/rpilinuxlab/genstage/live/rpi400kde/qmake-cross-features
