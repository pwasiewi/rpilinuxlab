# Packages that build a NATIVE host tool via a nested cmake/ExternalProject
# (e.g. syntax-highlighting's katehighlightingindexer) run the HOST compiler
# with the environment's CFLAGS — and the ARM -march=armv8-a/-mtune=cortex-a72
# from the sysroot make.conf are invalid for x86 cc ("bad value for -march").
# Neutral flags are accepted by both compilers; the cross gcc defaults to
# armv8-a anyway, so the target code loses only the cortex-a72 tune hint.
CFLAGS="-O2 -pipe"
CXXFLAGS="-O2 -pipe"
