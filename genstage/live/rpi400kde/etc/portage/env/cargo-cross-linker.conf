# Some cargo ebuilds miss the eclass's [target.<CHOST>] linker config for
# their crates (blazesym_c 2026-08-16: every rustc unit ran WITHOUT
# "-C linker=", so the final link fell back to rust-lld in host x86-64
# emulation — "incompatible with elf64-x86-64"). Cargo also reads the
# linker from the environment, which survives whatever the ebuild does to
# CARGO_HOME; and the crate's release profile turns LTO on, whose
# linker-plugin bitcode cannot pass through the bfd linker — off with it.
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="aarch64-unknown-linux-gnu-gcc"
CARGO_PROFILE_RELEASE_LTO="false"
