# sys-libs/libunwind ships a compatibility /usr/include/unwind.h that lacks
# _Unwind_Ptr/_Unwind_Exception_Class. On native systems it is dead weight —
# gcc's internal unwind.h sits earlier in the standard include chain — but
# the crossdev compiler passes "-isystem ${SYSROOT}/include", which precedes
# the internal chain, so libstdc++'s libsupc++ (rootfs gcc build) picks the
# libunwind header and dies. Masking the file changes nothing vs native
# shadowing and unbreaks the cross gcc build.
INSTALL_MASK="/usr/include/unwind.h"
