# cmake.eclass's cross toolchain file sets CMAKE_FIND_ROOT_PATH_MODE_LIBRARY
# and _INCLUDE to ONLY but never _PACKAGE — config-mode find_package() then
# also searches HOST prefixes, and whenever the host carries a NEWER version
# of the same framework (KF6 6.28 vs sysroot 6.27) cmake's version sort picks
# the host x86 package: host -isystem paths leak in and linking dies with
# "file in wrong format" (kdesu-gui), or an x86-only flag leaks from a host
# Qt config (breeze-icons). PACKAGE=ONLY confines config-mode finds to the
# re-rooted sysroot. Prerequisite: arch-independent host-config packages the
# builds legitimately need (extra-cmake-modules) must be merged into the
# sysroot. dev-qt/* override this file with xprofile-qt-host-cmake.conf
# (Qt's QT_HOST_PATH host-tool lookup bypasses find-root re-rooting anyway).
MYCMAKEARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY"
