# xp profile: Raspberry Pi 400 — KDE Plasma Wayland on the HARDENED systemd
# profile. Derives from rpi400kde; only the hardening axis changes.
#
# The stage3 is SELF-BUILT with the catalyst arm64 track: upstream ships no
# glibc hardened arm64 autobuild, but the portage profiles exist in the tree
# (dev tier). PROF_SEED_FLAVOR names the real autobuild catalyst seeds from;
# stage1 rebuilds the toolchain under the hardened profile and stage3 runs
# emerge -e @system in that chroot, so the output is hardened throughout
# (amdkdehard's seed-must-match-profile rationale, applied by building the
# matching seed instead of giving up).
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/rpi400kde.conf"

PROF_NAME=rpi400hard                 # 10 chars -> label rpi400hardroot (14<=16)
PROF_PORTAGE_PROFILE=default/linux/arm64/23.0/hardened/systemd
PROF_STAGE3_FLAVOR=hardened-systemd  # self-built (catalyst version_stamp)
PROF_SEED_FLAVOR=desktop-systemd     # upstream autobuild the chain seeds from
PROF_BUILD_SUBDIR=arm64sd-rpi400hard
PROF_BOOT_CONFIG=config-rpi400hard.txt

# Kernel-side hardening for the prebuilt kernel8.img: the Pi's cmdline.txt is
# a file on the boot partition (unlike amd64's baked CONFIG_CMDLINE), so the
# params ride here. Unconditional set only — 'lockdown=integrity' and
# 'apparmor=1 security=apparmor' go in ONLY after the stock kernel's LSM list
# is verified on the booted board: modprobe configs &&
#   zcat /proc/config.gz | grep -E 'CONFIG_(AUDIT|SECURITY_APPARMOR|SECURITY_LOCKDOWN_LSM)='
PROF_BOOT_CMDLINE_EXTRA="init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on slab_nomerge audit=1"

# REPLACES the parent's PROF_BOARD_USE. Three groups:
_use=(
    # 1. rpi400kde's desktop line, restated (qtwebengine stays excluded)
    wayland plasma kde qt6 -qt5 -gnome systemd -elogind -webengine -openconnect
    -doc -debug -examples -gtk-doc -handbook -emacs
    # 2. hardening tokens — the profile implies the toolchain ones; named for
    # status visibility (amdkdehard's rationale). 'apparmor' deliberately NOT
    # here until the stock kernel's LSM support is verified (see cmdline note).
    hardened pie ssp caps filecaps seccomp audit
    # 3. desktop-profile defaults hardened does not set (amdkdehard's ~75-flag
    # lesson, ARM/KDE-adapted: no wxwidgets/cdda/cdr — nothing in PROF_PKGS
    # consumes them)
    gui sound widgets pango xft fontconfig cairo truetype icu unicode
    X xcb egl opengl gbm drm kms vulkan
    dbus policykit udev udisks upower usb acl xattr
    activities kwallet semantic-desktop startup-notification spell
    networkmanager pipewire screencast alsa
    encode jpeg png gif svg webp avif jpegxl tiff exif lcms
    mp3 mp4 ogg vorbis flac aac mad branding libnotify
)
PROF_BOARD_USE="${_use[*]}"
unset _use

# This profile's own fragments (jit exception + duplicates of the rpi400kde
# entries — the sysroot sync takes exactly one confdir).
PROF_BOARD_PORTAGE_CONFDIR="${_here}/../genstage/live/rpi400hard/etc/portage"
# hardened payload + rpi400kde's locale/vconsole/sddm + this profile's portage
# fragments, left to right
PROF_BOARD_OVERLAY_DIR="hardened rpi400kde rpi400hard"

# PROF_PKGS inherited from rpi400kde unchanged. sys-apps/usbguard deliberately
# OMITTED: the Pi 400 keyboard is internal USB — a wrong policy bricks input
# (it has done exactly that on the host once). Revisit only with a tested
# allow-list, shipped with the service disabled.
