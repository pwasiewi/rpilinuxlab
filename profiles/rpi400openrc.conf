# xp profile: Raspberry Pi 400 on OpenRC — the pre-systemd image, kept.
#
# rpi400.conf moved to a systemd stage3 on 2026-08-04. This profile is what it
# used to be, and it deliberately keeps the ORIGINAL build tree
# (build/arm64sd-rpi400): 4.1 GB containing the rootfs and the sd.img that the
# physical Pi 400 was confirmed to boot on 2026-08-03. Nothing about it is
# regenerated by the systemd switch — the systemd profile builds into its own
# tree, so the two never touch.
#
# The board itself is identical hardware, so everything hardware-shaped comes
# from the parent: CPU, DTB, the raspi4b qemu boot gate, the fixed IP. Only the
# init system and the two things that follow from it are overridden here.
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/rpi400.conf"

PROF_NAME=rpi400openrc

# The stage3 flavour and the portage profile must agree — see the parent's
# comment. Back to plain glibc + OpenRC: netifrc holds the fixed address,
# sshd goes into the default runlevel, cmdline.txt execs /sbin/init.
PROF_STAGE3_FLAVOR=openrc
PROF_PORTAGE_PROFILE=default/linux/arm64/23.0

# The existing tree, claimed by name. Not renamed on purpose: it holds a
# verified artifact, and 'arm64sd-rpi400' is what every note and log about that
# boot already calls it. New work lands in the parent's own tree instead.
PROF_BUILD_SUBDIR=arm64sd-rpi400
