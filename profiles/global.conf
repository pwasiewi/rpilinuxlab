# xp profile layer — global settings + the shim that maps PROF_* data onto the
# env-override names xarm/xstage/xlab already understand.
#
# Sourced FIRST (before <profile>.conf) by the xp dispatcher and by the profile
# hook at the top of xarm/xstage/xlab. Precedence everywhere:
#     explicit env var  >  profile value  >  script built-in default
# — implemented with ${VAR:-...} guards, so re-sourcing is idempotent and an
# exported override always survives.
#
# Values duplicated across the three scripts live here once.

LAB_MIRROR="${LAB_MIRROR:-https://distfiles.gentoo.org}"
LAB_FLAVOR="${LAB_FLAVOR:-openrc}"

# --- stage3 flavours -------------------------------------------------------
# A flavour is the exact upstream autobuild name: the scripts fetch
# latest-stage3-<arch>-<flavour>.txt, so a wrong value is a 404, not a
# fallback. Profiles set PROF_STAGE3_FLAVOR; xprofile_apply validates it
# against the list for THAT profile's architecture.
#
# The two lists are genuinely different, which is the whole reason they are
# kept apart: arm64 has no glibc 'hardened-*' and no 'nomultilib' builds at
# all. Setting hardened-openrc on a Pi profile would validate against the
# amd64 list and then 404 — hence the per-arch split.
#
# Common to both:
#   openrc                    the default: glibc, OpenRC, merged-usr
#   openrc-splitusr           legacy split /usr — only for old layouts
#   systemd                   glibc + systemd
#   desktop-openrc/-systemd   desktop profile preset (X/wayland USE flags)
#   llvm-openrc/-systemd      clang/LLVM as the system toolchain
#   musl-openrc/-systemd      musl libc instead of glibc
#   musl-llvm-*               musl + clang
#   musl-hardened-*           musl + toolchain hardening
# amd64 only:
#   hardened-openrc/-systemd  glibc + PIE, SSP, FORTIFY, RELRO
#   hardened-selinux-*        + SELinux policy (needs a policy-aware kernel)
#   nomultilib-openrc/-systemd  pure 64-bit, no 32-bit libs (breaks wine/steam)
#
# On arm64 the only hardened option is musl-hardened-*: hardening there means
# also swapping glibc for musl, which is a much bigger change than on amd64.
#
# Two things follow from the flavour and must not be set by hand:
#   * the init the boot cmdline hands control to (systemd vs OpenRC), and
#   * how 'configure' enables services (systemctl vs runlevel symlinks).
LAB_STAGE3_FLAVOURS_AMD64="openrc openrc-splitusr systemd desktop-openrc desktop-systemd
    hardened-openrc hardened-systemd hardened-selinux-openrc hardened-selinux-systemd
    nomultilib-openrc nomultilib-systemd llvm-openrc llvm-systemd
    musl-openrc musl-systemd musl-hardened-openrc musl-hardened-systemd
    musl-llvm-openrc musl-llvm-systemd"
LAB_STAGE3_FLAVOURS_ARM64="openrc openrc-splitusr systemd desktop-openrc desktop-systemd
    llvm-openrc llvm-systemd musl-openrc musl-systemd
    musl-hardened-openrc musl-hardened-systemd musl-llvm-openrc musl-llvm-systemd"
# 32-bit ARM is not a target of any current profile. Noted because its naming
# differs: the subarch is part of the file name (latest-stage3-armv7a_hardfp-*),
# there is no per-subarch directory, and every flavour also exists in a '-t64'
# variant (64-bit time_t, the 2038 transition). The tiny track cross-compiles
# instead of seeding, so nothing here needs it yet.
LAB_JOBS="${LAB_JOBS:-$(nproc)}"
LAB_DISTCC_PORT="${LAB_DISTCC_PORT:-3632}"      # xarm distcc / xstage catalyst offload
LAB_BINHOST_PORT="${LAB_BINHOST_PORT:-8686}"    # xarm binhost / xlab binrepos.conf
LAB_SSH_FWD_XSTAGE="${LAB_SSH_FWD_XSTAGE:-2223}" # 2222 belongs to xlab's gentoo VM

# Validate the sourced profile and export the shims. Runs before the host
# script defines die() — plain echo+exit on error.
xprofile_apply() {
    local v
    for v in PROF_NAME PROF_KIND PROF_XSTAGE_TARGET PROF_XLAB_TARGET; do
        [[ -n ${!v:-} ]] ||
            { echo "❌  xp profile ${PROF_NAME:-?}: required var ${v} unset" >&2; exit 1; }
    done
    # exported so the scripts can refuse a verb that belongs to the other half
    # of the lab (ARM boards under qemu/crossdev vs the native amd64 live image)
    export XSTAGE_PROF_KIND="${PROF_KIND}"
    export XSTAGE_PROF_NAME="${PROF_NAME}"

    # --- stage3 flavour: validated here, so a typo fails now rather than as a
    # 404 halfway through a download ---------------------------------------
    if [[ -n ${PROF_STAGE3_FLAVOR:-} ]]; then
        # pick the list for this profile's architecture: native profiles seed
        # from releases/amd64, the arm64 track from releases/arm64. The tiny
        # track cross-compiles its rootfs and never downloads a stage3, so a
        # flavour set there is inert — validated against arm64 anyway, so that
        # a profile switched from tiny to arm64 later does not surprise anyone.
        local _arch _flavours
        if [[ ${PROF_KIND} == native ]]; then _arch=amd64; else _arch=arm64; fi
        # the lists are written across several lines for readability, so
        # collapse whitespace first — otherwise a flavour that happens to end a
        # line never matches (this bit an earlier version: 'desktop-systemd')
        if [[ ${_arch} == amd64 ]]; then
            _flavours=$(echo ${LAB_STAGE3_FLAVOURS_AMD64})
        else
            _flavours=$(echo ${LAB_STAGE3_FLAVOURS_ARM64})
        fi
        # Self-built stages: when PROF_SEED_FLAVOR is set, IT names the
        # upstream autobuild the catalyst chain seeds from and must pass the
        # list check; PROF_STAGE3_FLAVOR is then the flavour catalyst BUILDS
        # (its version_stamp), free to name combinations upstream never ships
        # — e.g. arm64 hardened-systemd: the portage profiles exist in the
        # tree (dev tier), only the autobuild seed is missing.
        local _check="${PROF_SEED_FLAVOR:-${PROF_STAGE3_FLAVOR}}"
        case " ${_flavours} " in
            *" ${_check} "*) ;;
            *) echo "❌  xp profile ${PROF_NAME}: '${_check}' is not an upstream ${_arch} autobuild flavour." >&2
               echo "    Valid for ${_arch}: ${_flavours}" >&2
               [[ ${_arch} == arm64 && ${_check} == hardened-* ]] &&
                   echo "    Note: arm64 has no upstream glibc hardened SEED — the profiles exist in the tree. Either self-build the stage3 (set PROF_SEED_FLAVOR to an upstream flavour and run: xp <prof> seed/snapshot/spec/stage1/stage3) or use musl-hardened-openrc / musl-hardened-systemd." >&2
               exit 1 ;;
        esac
        LAB_FLAVOR="${PROF_STAGE3_FLAVOR}"
        if [[ -n ${PROF_SEED_FLAVOR:-} ]]; then
            export XSTAGE_SEED_FLAVOR="${XSTAGE_SEED_FLAVOR:-${PROF_SEED_FLAVOR}}"
        fi
    fi
    # everything downstream of the flavour, derived once so no profile has to
    # remember to keep the two in sync
    case "${LAB_FLAVOR}" in
        *systemd) export XSTAGE_LIVE_INIT="${XSTAGE_LIVE_INIT:-/usr/lib/systemd/systemd}"
                  export XSTAGE_LIVE_RC="${XSTAGE_LIVE_RC:-systemd}" ;;
        *)        export XSTAGE_LIVE_INIT="${XSTAGE_LIVE_INIT:-/sbin/init}"
                  export XSTAGE_LIVE_RC="${XSTAGE_LIVE_RC:-openrc}" ;;
    esac
    export XSTAGE_STAGE3_FLAVOR="${LAB_FLAVOR}"

    if [[ ${PROF_KIND} == board ]]; then
        for v in PROF_TUPLE PROF_PORTAGE_PROFILE PROF_CPU PROF_BOARD \
                 PROF_QEMU_MACHINE PROF_DTB PROF_IP PROF_GW PROF_DNS PROF_IMAGE_CMD; do
            [[ -n ${!v:-} ]] ||
                { echo "❌  xp profile ${PROF_NAME}: required var ${v} unset" >&2; exit 1; }
        done
        export XARM_TARGET="${XARM_TARGET:-${PROF_TUPLE}}"
        export XARM_CPU="${XARM_CPU:-${PROF_CPU}}"
        export XARM_PROFILE="${XARM_PROFILE:-${PROF_PORTAGE_PROFILE}}"
        # ...and the same profile for the catalyst stage1/stage3 specs, so a
        # self-built stage3 has the same @system as the release seed this
        # profile downloads. Without it catalyst silently used the OpenRC
        # default no matter what PROF_STAGE3_FLAVOR said.
        export XSTAGE_PORTAGE_PROFILE="${XSTAGE_PORTAGE_PROFILE:-${PROF_PORTAGE_PROFILE}}"
        export XSTAGE_TINY_TUPLE="${XSTAGE_TINY_TUPLE:-${PROF_TUPLE}}"
        export XSTAGE_BOARD="${XSTAGE_BOARD:-${PROF_BOARD}}"
        export XSTAGE_DISTCC_HOSTS="${XSTAGE_DISTCC_HOSTS:-127.0.0.1:${LAB_DISTCC_PORT}/${LAB_JOBS}}"
        # per-board address vars keep xstage's own names
        case "${PROF_BOARD}" in
        rpi400)
            export XSTAGE_PI400_IP="${XSTAGE_PI400_IP:-${PROF_IP}}"
            export XSTAGE_PI400_GW="${XSTAGE_PI400_GW:-${PROF_GW}}"
            export XSTAGE_PI400_DNS="${XSTAGE_PI400_DNS:-${PROF_DNS}}"
            ;;
        rpi3)
            export XSTAGE_PI3_IP="${XSTAGE_PI3_IP:-${PROF_IP}}"
            export XSTAGE_PI3_GW="${XSTAGE_PI3_GW:-${PROF_GW}}"
            export XSTAGE_PI3_DNS="${XSTAGE_PI3_DNS:-${PROF_DNS}}"
            ;;
        zero2w)
            export XSTAGE_ZERO_IP="${XSTAGE_ZERO_IP:-${PROF_IP}}"
            export XSTAGE_ZERO_GW="${XSTAGE_ZERO_GW:-${PROF_GW}}"
            export XSTAGE_ZERO_DNS="${XSTAGE_ZERO_DNS:-${PROF_DNS}}"
            ;;
        esac
        # variant profiles: own build tree under rpilinuxlab/build/
        if [[ -n ${PROF_BUILD_SUBDIR:-} ]]; then
            export XSTAGE_BUILD_SUBDIR="${XSTAGE_BUILD_SUBDIR:-${PROF_BUILD_SUBDIR}}"
        fi
        # per-profile root password + rootfs partition label for the images:
        # rpi400 -> rpi400root (ext4 label limit 16 chars => name <= 12)
        export XSTAGE_ROOT_PASS="${XSTAGE_ROOT_PASS:-${PROF_NAME}root}"
        export XSTAGE_ROOT_LABEL="${XSTAGE_ROOT_LABEL:-${PROF_NAME}root}"
        # sd.img size — must stay a power of 2 (qemu's SD emulation)
        export XSTAGE_ARM64_IMG_MB="${XSTAGE_ARM64_IMG_MB:-${PROF_IMG_MB:-}}"
        # per-profile firmware config.txt: bare name under genstage/rpi/,
        # absolute path passes through (same contract as the overlay list)
        export XSTAGE_BOOT_CONFIG="${XSTAGE_BOOT_CONFIG:-${PROF_BOOT_CONFIG:-}}"
        # extra kernel cmdline params appended to the rendered cmdline.txt —
        # the Pi's cmdline is a file on the boot partition, so hardening
        # params live here instead of a baked CONFIG_CMDLINE
        export XSTAGE_BOOT_CMDLINE_EXTRA="${XSTAGE_BOOT_CMDLINE_EXTRA:-${PROF_BOOT_CMDLINE_EXTRA:-}}"
        # overlay layers for 'xp <prof> conf' onto the board rootfs — the
        # board-side twin of PROF_LIVE_OVERLAY_DIR (native semantics, kept
        # separate on purpose: the two pipelines must never read each other's)
        export XSTAGE_BOARD_OVERLAY_DIR="${XSTAGE_BOARD_OVERLAY_DIR:-${PROF_BOARD_OVERLAY_DIR:-}}"
        # desktop half of arm64_configure runs only when a session is named;
        # user follows the PROF_LIVE_USER +set idiom (explicit "" disables)
        export XSTAGE_BOARD_XSESSION="${XSTAGE_BOARD_XSESSION:-${PROF_BOARD_XSESSION:-}}"
        if [[ ${PROF_BOARD_USER+set} && -z ${XSTAGE_BOARD_USER+set} ]]; then
            export XSTAGE_BOARD_USER="${PROF_BOARD_USER}"
        fi
        # sysroot make.conf additions + per-profile portage fragments, read by
        # 'xarm setup'/'xarm tune' (the sysroot is shared — rerun on switch)
        export XARM_USE_EXTRA="${XARM_USE_EXTRA:-${PROF_BOARD_USE:-}}"
        export XARM_VIDEO_CARDS="${XARM_VIDEO_CARDS:-${PROF_BOARD_VIDEO_CARDS:-}}"
        export XARM_INPUT_DEVICES="${XARM_INPUT_DEVICES:-${PROF_BOARD_INPUT_DEVICES:-}}"
        export XARM_PORTAGE_CONFDIR="${XARM_PORTAGE_CONFDIR:-${PROF_BOARD_PORTAGE_CONFDIR:-}}"
    fi

    # native profiles may carry a live-image half: squashfs + isolinux ISO
    # instead of an SD card. Every var is optional — a profile without them is
    # still valid, it just has nothing for 'xp <prof> squash|iso' to do.
    if [[ ${PROF_KIND} == native ]]; then
        export XSTAGE_ROOT_PASS="${XSTAGE_ROOT_PASS:-${PROF_NAME}root}"
        # only when the profile names one — an empty value would override
        # xstage's amd64 default with nothing
        if [[ -n ${PROF_LIVE_PORTAGE_PROFILE:-} ]]; then
            export XSTAGE_PORTAGE_PROFILE="${XSTAGE_PORTAGE_PROFILE:-${PROF_LIVE_PORTAGE_PROFILE}}"
        fi
        # NOT XSTAGE_BUILD_SUBDIR: that one steers the board rootfs trees. If
        # both halves shared it, 'xstage amd64 unpack' under an ARM profile
        # would offer to wipe the Pi's rootfs (and vice versa) — the live tree
        # gets a name of its own so the two can never point at each other.
        if [[ -n ${PROF_BUILD_SUBDIR:-} ]]; then
            export XSTAGE_LIVE_SUBDIR="${XSTAGE_LIVE_SUBDIR:-${PROF_BUILD_SUBDIR}}"
        fi
        export XSTAGE_LIVE_TIERS="${XSTAGE_LIVE_TIERS:-${PROF_LIVE_TIERS:-}}"
        export XSTAGE_LIVE_SETS="${XSTAGE_LIVE_SETS:-${PROF_LIVE_SETS:-}}"
        export XSTAGE_LIVE_HOSTNAME="${XSTAGE_LIVE_HOSTNAME:-${PROF_LIVE_HOSTNAME:-${PROF_NAME}live}}"
        export XSTAGE_LIVE_VOLID="${XSTAGE_LIVE_VOLID:-${PROF_LIVE_VOLID:-${PROF_NAME^^}}}"
        export XSTAGE_LIVE_VIDEO_CARDS="${XSTAGE_LIVE_VIDEO_CARDS:-${PROF_LIVE_VIDEO_CARDS:-}}"
        export XSTAGE_LIVE_USE="${XSTAGE_LIVE_USE:-${PROF_LIVE_USE:-}}"
        export XSTAGE_LIVE_XSESSION="${XSTAGE_LIVE_XSESSION:-${PROF_LIVE_XSESSION:-}}"
        # PROF_LIVE_PKGS is an ARRAY so the profile can comment its groups;
        # flatten it here, because env vars cannot carry arrays across exec.
        # PROF_LIVE_EXTRA_PKGS is the tail a derived profile appends to its
        # parent's list; '[*]' flattens it whether the profile wrote it as an
        # array or as a plain string (a bare ${x:-} on an array would silently
        # yield element 0 alone).
        local _pkgs="${PROF_LIVE_PKGS[*]:-} ${PROF_LIVE_EXTRA_PKGS[*]:-}"
        export XSTAGE_LIVE_PKGS="${XSTAGE_LIVE_PKGS:-${_pkgs}}"
        # atoms that need an overlay: merged separately, and only when every
        # repo in XSTAGE_LIVE_REPOS is configured inside the image
        export XSTAGE_LIVE_REPOS="${XSTAGE_LIVE_REPOS:-${PROF_LIVE_REPOS:-}}"
        export XSTAGE_LIVE_OVERLAY_PKGS="${XSTAGE_LIVE_OVERLAY_PKGS:-${PROF_LIVE_OVERLAY_PKGS[*]:-}}"
        # non-@FREE licences the package list needs. Left empty by default: the
        # image then keeps the portage profile's ACCEPT_LICENSE, and an atom
        # that needs more aborts 'pkgs' at dependency resolution — visibly,
        # which is the point.
        export XSTAGE_LIVE_ACCEPT_LICENSE="${XSTAGE_LIVE_ACCEPT_LICENSE:-${PROF_LIVE_ACCEPT_LICENSE:-}}"
        # raw make.conf lines. An ARRAY, one line per element, joined with
        # newlines rather than spaces — unlike the package list these are whole
        # assignments and must not be re-split. Chiefly for USE_EXPAND
        # variables, which have to be set as variables and not as USE tokens
        # (see LIVE_MAKECONF_EXTRA in xstage for why).
        if [[ -z ${XSTAGE_LIVE_MAKECONF_EXTRA:-} && -n ${PROF_LIVE_MAKECONF_EXTRA[*]:-} ]]; then
            local _mce; _mce=$(printf '%s\n' "${PROF_LIVE_MAKECONF_EXTRA[@]}")
            export XSTAGE_LIVE_MAKECONF_EXTRA="${_mce}"
        else
            export XSTAGE_LIVE_MAKECONF_EXTRA="${XSTAGE_LIVE_MAKECONF_EXTRA:-}"
        fi
        # Build-time cycles that survive every USE cut, merged once with a
        # temporary USE override before the main pass. An ARRAY, joined with
        # newlines for the same reason as MAKECONF_EXTRA: an entry is
        # "<atom> <USE overrides...>" and must not be re-split on spaces.
        if [[ -z ${XSTAGE_LIVE_CYCLE_BOOTSTRAP:-} && -n ${PROF_LIVE_CYCLE_BOOTSTRAP[*]:-} ]]; then
            local _cb; _cb=$(printf '%s\n' "${PROF_LIVE_CYCLE_BOOTSTRAP[@]}")
            export XSTAGE_LIVE_CYCLE_BOOTSTRAP="${_cb}"
        else
            export XSTAGE_LIVE_CYCLE_BOOTSTRAP="${XSTAGE_LIVE_CYCLE_BOOTSTRAP:-}"
        fi
        # Profile-scoped kernel fragments, space-separated: bare names resolve
        # against genstage/live/kernel/, absolute paths pass through. For
        # symbols only one profile may carry (nvidiahard's baked
        # CONFIG_CMDLINE) — the flavour fragments are shared by every image.
        export XSTAGE_LIVE_KFRAGS="${XSTAGE_LIVE_KFRAGS:-${PROF_LIVE_KFRAGS:-}}"
        # Packages merged by their own verb, 'xp <prof> restrict-run', one
        # emerge per element — fetch-restricted archives and bootstrap chains
        # that must not share a graph with 'pkgs'. An ARRAY for the same reason
        # as the two above: an element may name several atoms that DO belong
        # together, and must not be re-split.
        if [[ -z ${XSTAGE_LIVE_RESTRICT_PKGS:-} && -n ${PROF_LIVE_RESTRICT_PKGS[*]:-} ]]; then
            local _rp; _rp=$(printf '%s\n' "${PROF_LIVE_RESTRICT_PKGS[@]}")
            export XSTAGE_LIVE_RESTRICT_PKGS="${_rp}"
        else
            export XSTAGE_LIVE_RESTRICT_PKGS="${XSTAGE_LIVE_RESTRICT_PKGS:-}"
        fi
        if [[ -z ${XSTAGE_LIVE_KMOD_PKGS:-} && -n ${PROF_LIVE_KMOD_PKGS[*]:-} ]]; then
            local _kp; _kp=$(printf '%s\n' "${PROF_LIVE_KMOD_PKGS[@]}")
            export XSTAGE_LIVE_KMOD_PKGS="${_kp}"
        else
            export XSTAGE_LIVE_KMOD_PKGS="${XSTAGE_LIVE_KMOD_PKGS:-}"
        fi
        # 'pkgs' updates the stage3 to the tree first; see cmd_live_pkgs
        export XSTAGE_LIVE_UPDATE_FIRST="${XSTAGE_LIVE_UPDATE_FIRST:-${PROF_LIVE_UPDATE_FIRST:-yes}}"
        # python slots to build every python package for. Empty means "whatever
        # the portage profile says", which is one slot and breaks any package
        # whose REQUIRED_USE still names only older ones.
        export XSTAGE_LIVE_PYTHON_TARGETS="${XSTAGE_LIVE_PYTHON_TARGETS:-${PROF_LIVE_PYTHON_TARGETS:-}}"
        export XSTAGE_LIVE_PYTHON_SINGLE_TARGET="${XSTAGE_LIVE_PYTHON_SINGLE_TARGET:-${PROF_LIVE_PYTHON_SINGLE_TARGET:-}}"
        # EMERGE_DEFAULT_OPTS replaces xstage's default outright — portage
        # keeps only the last assignment, and xstage's block is written last.
        export XSTAGE_LIVE_EMERGE_OPTS="${XSTAGE_LIVE_EMERGE_OPTS:-${PROF_LIVE_EMERGE_OPTS:-}}"
        # CFLAGS/CPU_FLAGS_X86 replace the stage3's. Empty by default: a live
        # image is normally expected to boot elsewhere, and '-march=native'
        # would make it CPU-specific.
        export XSTAGE_LIVE_CFLAGS="${XSTAGE_LIVE_CFLAGS:-${PROF_LIVE_CFLAGS:-}}"
        export XSTAGE_LIVE_CPU_FLAGS_X86="${XSTAGE_LIVE_CPU_FLAGS_X86:-${PROF_LIVE_CPU_FLAGS_X86:-}}"
        # FEATURES, appended to the profile's
        export XSTAGE_LIVE_FEATURES="${XSTAGE_LIVE_FEATURES:-${PROF_LIVE_FEATURES:-}}"
        # host directory bind-mounted at /var/cache/ccache during 'pkgs';
        # excluded from the squashfs, so it never reaches the ISO
        export XSTAGE_LIVE_CCACHE_DIR="${XSTAGE_LIVE_CCACHE_DIR:-${PROF_LIVE_CCACHE_DIR:-}}"
        # host DISTDIR shared with the image, bind-mounted during pkgs/enter
        export XSTAGE_LIVE_DISTFILES_DIR="${XSTAGE_LIVE_DISTFILES_DIR:-${PROF_LIVE_DISTFILES_DIR:-}}"
        # host PORTAGE_TMPDIR/portage, bind-mounted so build trees never live
        # in the image rootfs
        export XSTAGE_LIVE_BUILDDIR="${XSTAGE_LIVE_BUILDDIR:-${PROF_LIVE_BUILDDIR:-}}"
        # host PKGDIR, bind-mounted at /var/cache/binpkgs: getbinpkg reads,
        # buildpkg fills, packages persist across image rebuilds
        export XSTAGE_LIVE_BINPKGS_DIR="${XSTAGE_LIVE_BINPKGS_DIR:-${PROF_LIVE_BINPKGS_DIR:-}}"
        # hardened and friends: a non-default portage profile for the image
        export XSTAGE_LIVE_PORTAGE_PROFILE="${XSTAGE_LIVE_PORTAGE_PROFILE:-${PROF_LIVE_PORTAGE_PROFILE:-}}"
        # kernel sources the image builds /usr/src/linux/.config against
        # (xstage defaults to sys-kernel/gentoo-sources when unset)
        export XSTAGE_LIVE_KERNEL_PKG="${XSTAGE_LIVE_KERNEL_PKG:-${PROF_LIVE_KERNEL_PKG:-}}"
        export XSTAGE_LIVE_OVERLAY_DIR="${XSTAGE_LIVE_OVERLAY_DIR:-${PROF_LIVE_OVERLAY_DIR:-}}"
        # live user + autologin; xstage defaults to 'guest' when UNSET, so
        # only a profile that explicitly sets PROF_LIVE_USER (even to "",
        # which disables the account) may export the variable
        if [[ ${PROF_LIVE_USER+set} && -z ${XSTAGE_LIVE_USER+set} ]]; then
            export XSTAGE_LIVE_USER="${PROF_LIVE_USER}"
        fi
    fi

    export XSTAGE_MIRROR="${XSTAGE_MIRROR:-${LAB_MIRROR}}"
    export XLAB_MIRROR="${XLAB_MIRROR:-${LAB_MIRROR}}"
    export XSTAGE_FLAVOR="${XSTAGE_FLAVOR:-${LAB_FLAVOR}}"
    export XLAB_STAGE3_FLAVOR="${XLAB_STAGE3_FLAVOR:-${LAB_FLAVOR}}"
    export XSTAGE_JOBS="${XSTAGE_JOBS:-${LAB_JOBS}}"
    export XLAB_JOBS="${XLAB_JOBS:-${LAB_JOBS}}"
    export XSTAGE_SSH_PORT="${XSTAGE_SSH_PORT:-${LAB_SSH_FWD_XSTAGE}}"
    return 0
}
