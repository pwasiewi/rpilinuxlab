# xp profile layer — global settings + the shim that maps PROF_* data onto the
# env-override names xarm/xstage/xlab already understand.
#
# Sourced FIRST (before <profile>.conf) by the xp dispatcher and by the profile
# hook at the top of xarm/xstage/xlab. Precedence everywhere:
#     explicit env var  >  profile value  >  script built-in default
# — implemented with ${VAR:-...} guards, so re-sourcing is idempotent and an
# exported override always survives.
#
# Values duplicated across the three scripts live here once.

LAB_MIRROR="${LAB_MIRROR:-https://distfiles.gentoo.org}"
LAB_FLAVOR="${LAB_FLAVOR:-openrc}"
LAB_JOBS="${LAB_JOBS:-$(nproc)}"
LAB_DISTCC_PORT="${LAB_DISTCC_PORT:-3632}"      # xarm distcc / xstage catalyst offload
LAB_BINHOST_PORT="${LAB_BINHOST_PORT:-8686}"    # xarm binhost / xlab binrepos.conf
LAB_SSH_FWD_XSTAGE="${LAB_SSH_FWD_XSTAGE:-2223}" # 2222 belongs to xlab's gentoo VM

# Validate the sourced profile and export the shims. Runs before the host
# script defines die() — plain echo+exit on error.
xprofile_apply() {
    local v
    for v in PROF_NAME PROF_KIND PROF_XSTAGE_TARGET PROF_XLAB_TARGET; do
        [[ -n ${!v:-} ]] ||
            { echo "❌  xp profile ${PROF_NAME:-?}: required var ${v} unset" >&2; exit 1; }
    done

    if [[ ${PROF_KIND} == board ]]; then
        for v in PROF_TUPLE PROF_PORTAGE_PROFILE PROF_CPU PROF_BOARD \
                 PROF_QEMU_MACHINE PROF_DTB PROF_IP PROF_GW PROF_DNS PROF_IMAGE_CMD; do
            [[ -n ${!v:-} ]] ||
                { echo "❌  xp profile ${PROF_NAME}: required var ${v} unset" >&2; exit 1; }
        done
        export XARM_TARGET="${XARM_TARGET:-${PROF_TUPLE}}"
        export XARM_CPU="${XARM_CPU:-${PROF_CPU}}"
        export XARM_PROFILE="${XARM_PROFILE:-${PROF_PORTAGE_PROFILE}}"
        export XSTAGE_TINY_TUPLE="${XSTAGE_TINY_TUPLE:-${PROF_TUPLE}}"
        export XSTAGE_BOARD="${XSTAGE_BOARD:-${PROF_BOARD}}"
        export XSTAGE_DISTCC_HOSTS="${XSTAGE_DISTCC_HOSTS:-127.0.0.1:${LAB_DISTCC_PORT}/${LAB_JOBS}}"
        # per-board address vars keep xstage's own names
        case "${PROF_BOARD}" in
        rpi400)
            export XSTAGE_PI400_IP="${XSTAGE_PI400_IP:-${PROF_IP}}"
            export XSTAGE_PI400_GW="${XSTAGE_PI400_GW:-${PROF_GW}}"
            export XSTAGE_PI400_DNS="${XSTAGE_PI400_DNS:-${PROF_DNS}}"
            ;;
        rpi3)
            export XSTAGE_PI3_IP="${XSTAGE_PI3_IP:-${PROF_IP}}"
            export XSTAGE_PI3_GW="${XSTAGE_PI3_GW:-${PROF_GW}}"
            export XSTAGE_PI3_DNS="${XSTAGE_PI3_DNS:-${PROF_DNS}}"
            ;;
        zero2w)
            export XSTAGE_ZERO_IP="${XSTAGE_ZERO_IP:-${PROF_IP}}"
            export XSTAGE_ZERO_GW="${XSTAGE_ZERO_GW:-${PROF_GW}}"
            export XSTAGE_ZERO_DNS="${XSTAGE_ZERO_DNS:-${PROF_DNS}}"
            ;;
        esac
        # variant profiles: own build tree under rpilinuxlab/build/
        if [[ -n ${PROF_BUILD_SUBDIR:-} ]]; then
            export XSTAGE_BUILD_SUBDIR="${XSTAGE_BUILD_SUBDIR:-${PROF_BUILD_SUBDIR}}"
        fi
        # per-profile root password + rootfs partition label for the images:
        # rpi400 -> rpi400root (ext4 label limit 16 chars => name <= 12)
        export XSTAGE_ROOT_PASS="${XSTAGE_ROOT_PASS:-${PROF_NAME}root}"
        export XSTAGE_ROOT_LABEL="${XSTAGE_ROOT_LABEL:-${PROF_NAME}root}"
    fi

    export XSTAGE_MIRROR="${XSTAGE_MIRROR:-${LAB_MIRROR}}"
    export XLAB_MIRROR="${XLAB_MIRROR:-${LAB_MIRROR}}"
    export XSTAGE_FLAVOR="${XSTAGE_FLAVOR:-${LAB_FLAVOR}}"
    export XLAB_STAGE3_FLAVOR="${XLAB_STAGE3_FLAVOR:-${LAB_FLAVOR}}"
    export XSTAGE_JOBS="${XSTAGE_JOBS:-${LAB_JOBS}}"
    export XLAB_JOBS="${XLAB_JOBS:-${LAB_JOBS}}"
    export XSTAGE_SSH_PORT="${XSTAGE_SSH_PORT:-${LAB_SSH_FWD_XSTAGE}}"
    return 0
}
