# xp profile: the RUNNING host — not a build target.
#
# Exists so host-side maintenance can ride the same dispatcher as the lab:
#   sudo xp host clean-world -c
# PROF_KIND=host makes xp refuse every build verb before it can touch a
# build tree. The xstage/xlab targets are required by xprofile_apply but
# deliberately unreachable: 'none' is not a target, so any verb that slips
# through a future dispatcher change dies loudly inside the script it
# reached instead of acting on a real tree.
PROF_NAME=host
PROF_KIND=host
PROF_XSTAGE_TARGET=none
PROF_XLAB_TARGET=none
