# xp profile: Raspberry Pi Zero 2 W (RP3A0/BCM2837, Cortex-A53) + Waveshare
# 2.13" V4 e-Paper HAT — tiny rootfs (Buildroot-style), USB-gadget network
PROF_NAME=zero2w
PROF_KIND=board
PROF_TUPLE=aarch64-unknown-linux-gnu
PROF_PORTAGE_PROFILE=default/linux/arm64/23.0
PROF_CPU=cortex-a53
PROF_BOARD=zero2w
PROF_QEMU_MACHINE=raspi3b
PROF_DTB=bcm2710-rpi-3-b.dtb
PROF_IP=10.0.0.2/24
PROF_GW=10.0.0.1
PROF_DNS=8.8.8.8
PROF_XSTAGE_TARGET=tiny         # rootfs installation method (cross-emerge)

# Inert on the tiny track: that rootfs is cross-emerged from the sysroot, so
# no stage3 is ever downloaded. Declared anyway so the value is already right
# if this board is ever switched to the arm64 (stage3-unpack) method.
PROF_STAGE3_FLAVOR=openrc
PROF_XLAB_TARGET=aarch64
PROF_IMAGE_CMD=image_zero
