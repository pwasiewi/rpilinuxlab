# ---------------------------------------------------------------------------
# Replaces the parent's "guru pwr". Security policy for this image: ::pwr is
# the only third-party repository it may configure, because ::pwr holds either
# ebuilds written here or ebuilds reviewed here before being copied in. An
# image that syncs ::guru at build time would execute whatever ::guru happens
# to contain that day, which is exactly the trust boundary a hardened profile
# is supposed to draw.
#
# Consequence: nothing may be listed below that is not in ::pwr. The five
# ex-::guru atoms were imported (pwr commit 1694e31) rather than dropped.
# ---------------------------------------------------------------------------
PROF_LIVE_REPOS="pwr"

# Same reason, one level down: the parent asks for @kde-baseapps-26.04 and
# friends, which are defined by ::kde — a repo this image will not configure,
# so emerge inside the chroot fails with "There are no sets to satisfy". The
# three lists were copied into ::pwr under prefixed names (every atom in them
# resolves in ::gentoo; only the grouping was ::kde's). The prefix keeps them
# from shadowing ::kde's originals on hosts that have both repos.
PROF_LIVE_SETS="@pwr-kde-baseapps-26.04 @pwr-kdegraphics-26.04 @pwr-kdeutils-26.04"

# ---------------------------------------------------------------------------
# Packages that are NOT in ::gentoo. Merged separately by 'xp <prof> pkgs',
# and only once every repo in PROF_LIVE_REPOS is configured inside the image.
# All of these resolve in ::pwr; each was imported together with its full
# dependency closure, so the merge needs ::gentoo and ::pwr and nothing else.
# ---------------------------------------------------------------------------
PROF_LIVE_OVERLAY_PKGS=(
    # written here
    dev-python/semgrep
    dev-util/codeql-bin
    dev-util/tracee
    # imported from ::guru
    app-misc/glow
    app-admin/gentoo_update
    sci-misc/llama-cpp
    net-im/teams-for-linux
    x11-misc/picom-jonaburg
    # imported from ::tatsh-overlay, ::nest, ::stuff, ::mv, ::gentoo-zh,
    # ::thegreatmcpain respectively
    dev-util/prettier
    dev-util/sqlfluff
    dev-util/postman
    dev-util/dbt-core
    sci-ml/lemonade
    sci-ml/fastflowlm
    app-portage/portage-bashrc-mv
    www-client/brave-bin
    sys-kernel/genkernel-next
    sys-fs/encfs
)

# ---------------------------------------------------------------------------
# Licences beyond the profile's default @FREE. A licence mask is a resolver
# error, so one unaccepted token aborts the whole 'pkgs' run rather than
# skipping the package — --keep-going cannot route around it.
# Incremental: xstage appends this to the profile's ACCEPT_LICENSE.
# ---------------------------------------------------------------------------
# @BINARY-REDISTRIBUTABLE is the baseline rather than a list of atoms, which
# is what sys-kernel/linux-firmware taught: its LICENSE hides the token in a
# USE-conditional, 'redistributable? ( linux-fw-redistributable ... )', so an
# atom-by-atom audit walked straight past it. The group is @FREE plus exactly
# the redistributable-binary class — firmware, microcode, unRAR, Broadcom,
# NVIDIA-r*, no-source-code — and covers the whole category at once.
#
# The named tokens below are what a licence audit over the resolved dependency
# closure (5358 packages) still leaves uncovered AND actually reachable:
#
#   RAR                 app-arch/rar          (unRAR is in the group already)
#   Microsoft-vscode    app-editors/vscode
#   OTN                 dev-db/oracle-instantclient, dev-db/sqldeveloper
#   BUSL-1.1            dev-util/packer
#   Spotify             media-sound/spotify
#   VOSTROM             net-analyzer/lft
#   all-rights-reserved net-im/discord, net-im/slack, net-im/teams-for-linux
#   android             net-im/teams-for-linux
#   google-chrome       www-client/google-chrome{,-beta,-unstable}
#   OPERA-2018          www-client/opera-developer
#   FastFlowLM-Binary   sci-ml/fastflowlm
#   AMD-Binary-Only     dev-libs/xrt-xdna, via sci-ml/fastflowlm
#   HIDAPI              dev-libs/hidapi, via app-misc/piper -> libratbag
#   free-noncomm        media-fonts/mikachan-font-*, via media-fonts/fonts-meta
#   MSttfEULA           media-fonts/corefonts, also via fonts-meta
#   OSGi-Specification-2.0  dev-java/osgi-cmpn, via dev-db/sqldeveloper[postgres]
#   Watcom-1.0          dev-lang/uasm, via app-crypt/hashcat -> app-arch/lzma
#
# Twenty-six further tokens appear in the closure but only behind USE flags
# this image does not set (mongodb SSPL-1, corefonts MSttfEULA, cudnn, tsm,
# the Java bindings). They are left out on purpose: adding a token nothing
# installs is how a curated licence list rots into ACCEPT_LICENSE="*".
PROF_LIVE_ACCEPT_LICENSE="@BINARY-REDISTRIBUTABLE
                          RAR Microsoft-vscode OTN BUSL-1.1 Spotify VOSTROM
                          all-rights-reserved android google-chrome OPERA-2018
                          FastFlowLM-Binary AMD-Binary-Only HIDAPI free-noncomm
                          MSttfEULA OSGi-Specification-2.0 Watcom-1.0"
