# xp profile: amd64 KDE Plasma live image on a HARDENED portage profile.
#
# A thin derivative of amd64kde.conf: same desktop, same native track, but
# built against default/linux/amd64/23.0/hardened (toolchain-level hardening —
# PIE, SSP, FORTIFY_SOURCE, RELRO by default) and shipping the audit toolbox
# from info/intro-hardening.md preconfigured rather than merely
# installed. Sourcing the parent keeps the package list in ONE file; edits to
# amd64kde.conf land here automatically.
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/amd64kde.conf"

PROF_NAME=amd64kdehardened
PROF_LIVE_HOSTNAME=kdehard
PROF_LIVE_VOLID=AMD64KDEHARD
PROF_BUILD_SUBDIR=amd64kdehardened

# The hardened profile is the whole point of this variant. It must match the
# stage3 the image is unpacked from — build one with 'xp amd64 all' against the
# same profile, or start from a hardened release seed.
#
# systemd variant: hardened and systemd are separate axes in the 23.0 tree, and
# '/hardened/systemd' is where they meet (a stable profile — check with
# 'grep hardened profiles.desc' in the ::gentoo tree). The parent profile is
# OpenRC + elogind, so everything below flips with it.
PROF_LIVE_PORTAGE_PROFILE="default/linux/amd64/23.0/hardened/systemd"

# ...and the seed must match it. Unpacking a plain stage3 and only switching
# the portage profile afterwards would leave the entire userland built by a
# non-hardened toolchain until an 'emerge -e @world' — hours this avoids.
# The same goes for the init system: a hardened-openrc seed has no systemd in
# it at all, so the profile switch alone would mean rebuilding half the world.
# 'hardened-selinux-systemd' is the next step up, but SELinux needs a
# policy-aware kernel and a policy the image does not ship yet.
PROF_STAGE3_FLAVOR=hardened-systemd

# Replaced, not appended: the parent asks for 'elogind -systemd', which is the
# exact opposite of this profile. Everything before 'hardened' is the parent's
# desktop line with those two flipped.
# hardened implies the toolchain flags at the profile level; naming them keeps
# the intent visible in 'xp amd64kdehardened status' and survives a profile change.
#
# Written as an array so the groups can be commented — '#' inside a
# double-quoted string is a literal, and every word in this value becomes a
# USE flag verbatim. Flattened into PROF_LIVE_USE at the end.
_use=(
    wayland plasma kde qt6 -gnome systemd -elogind
    hardened pie ssp caps filecaps seccomp audit apparmor

               # boot and firmware
               uefi grub experimental aio bpf rtlsdr keyring policykit suid mount
               # toolchain, libraries, frameworks
               #llvm_slot_21 -llvm_slot_19 -llvm_slot_20 jit 
			   graphite openmp
               fortran glib boost icu introspection gstreamer dbus libnotify
               gd xml -gnome-keyring -nautilus gpm libproxy
               # graphics, display, image formats
               X opengl egl vulkan vdpau vaapi gbm cairo sdl gtk gtk3 -gtk2
               -nvidia -cuda xrandr xcb drm kms xv xinerama
               jpeg jpeg2k png tiff gif svg pdf exif lcms
               imagemagick qrcode qml gles2 harfbuzz
               # languages, development, editors
               python java lua perl vala tcl tk debugger
               profiler vim-syntax text
               # security and network
               ssl cryptsetup gpg pkcs11 ipv6 wifi
               network ldap vnc -automount -nss gnutls
               savedconfig acl -gcrypt
               # audio, video, codecs, compression
               alsa pulseaudio jack oss openal a52 aac faad flac mp3 ogg
               vorbis dts ffmpeg mpg123 x264 xvid theora bluray
               v4l wmf mng lzma lz4 lzo zstd zip dvd ieee1394 fdk
               video
               # fonts and typography
               truetype freetype xetex latex
               # 'fontforge' deliberately absent: on media-fonts/* it means
               # "rebuild the fonts from source with fontforge", which is not
               # what anyone wants from a prebuilt TTF and which builds a cycle
               # out of it — virtual/ttf-fonts -> liberation-fonts -> fontforge
               # -> gtk+:3 -> pango -> libXft -> virtual/ttf-fonts. The host
               # carries the flag harmlessly because its fonts are long since
               # installed; a from-scratch image has to build the loop.
               # filesystems, hardware, system services, databases
               btrfs xfs xattr lvm udev usb
               bluetooth fuse threads device-mapper pcap sqlite
               postgres -mysql json
               # math, science, misc
               lapack flexiblas -mpi -mpi-threads extras tools utils contrib
               extra dot postproc unicode cups djvu bash-completion gnuplot
               # defaults the DESKTOP profile provides and HARDENED does not.
               # The hardened profile is not a desktop profile: comparing the
               # two make.defaults chains, desktop/plasma/systemd sets 75 flags
               # hardened/systemd leaves alone. The host never had to name them
               # (its own profile supplied them), so a USE list transplanted
               # from the host arrives with these holes — media-libs/gd missing
               # 'fontconfig' was the first one to surface as a hard resolver
               # error, via graphviz -> doxygen -> qtwebengine.
               gui sound widgets pango xft fontconfig
               activities kwallet semantic-desktop startup-notification spell
               networkmanager pipewire screencast udisks upower
               encode webp avif jpegxl mp4 mad cdda cdr branding
               wxwidgets
               # off
               -bindist -doc -systemtap -eselect-ldso -webkit -opencl -objc
               -objc++ -objc-gc -static-libs -valgrind -apache -apache2
               -qt5
)
PROF_LIVE_USE="${_use[*]}"
unset _use

# CPU targeting. The image runs on a ThinkPad T14 Gen 6 (Ryzen AI, Zen 5) but
# is built on gen2db, a Ryzen 9 5950X (Zen 3) — so the baseline is the BUILD
# host's ISA, not the laptop's. That is on purpose: znver3's feature set is a
# strict subset of znver5's (verified with gcc -Q --help=target: nothing
# znver3 enables is missing from znver5), so one build boots on both machines
# and the ISO can be smoke-tested here before it ever reaches the laptop.
#
# Written out rather than left as '-march=native', which resolves to the same
# znver3 today. The difference shows up the day this profile is built on
# another box: 'native' would silently retarget and the ISO would stop booting
# on the T14 with nothing in any log to say why. Spelled out, it cannot drift.
#
# -mtune is scheduling only, never ISA, so tuning for the laptop costs the
# 5950X a little and costs compatibility nothing.
#
# Upgrade path, if gen2db stops being the build host: -march=znver5 and
# regenerate CPU_FLAGS_X86 on the laptop (adds the AVX-512 set Zen 5 has and
# Zen 3 does not).
# Overrides the parent's list, twice over.
#
# 'radeon' added: x11-base/xorg-drivers maps video_cards_radeonsi onto the
# xf86-video-ati DDX, and that DDX wants x11-libs/libdrm[video_cards_radeon] —
# asking for radeonsi without radeon is an unsatisfiable USE dependency, i.e. a
# resolver error, not a missing driver.
#
# 'nvidia' REPLACED BY 'nouveau': VIDEO_CARDS is not just a driver hint. The
# same xorg-drivers ebuild carries
#     video_cards_nvidia? ( x11-drivers/nvidia-drivers )
# so keeping 'nvidia' here pulled the proprietary blob into the image no matter
# what the USE list said — and this profile's USE says '-nvidia -cuda'. An
# out-of-tree binary kernel module with no source is the one thing a hardened
# image has no way to vouch for. nouveau keeps NVIDIA hardware bootable on the
# open driver. The proprietary stack and CUDA live in amd64kde instead.
PROF_LIVE_VIDEO_CARDS="amdgpu radeonsi radeon nouveau intel i915 i965 iris"

PROF_LIVE_CFLAGS="-march=znver3 -mtune=znver5 -O2 -fomit-frame-pointer -pipe"

# cpuid2cpuflags on gen2db, verbatim. 'sse4a' belongs here — it is AMD-only,
# and both machines are AMD. No avx512*: the 5950X has none, and a flag the
# build host cannot execute breaks test phases long before the laptop sees it.
PROF_LIVE_CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul
    popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

# Raw make.conf lines, appended last. USE_EXPAND variables belong here and NOT
# in USE: a USE token only ADDS its flag, while the variable REPLACES the
# profile's whole set. 'lua_single_target_lua5-4' in USE left the profile's own
# default enabled beside it, and every lua consumer carries
# 'exactly-one-of ( lua_single_target_* )' — a resolver error, which aborts the
# entire run rather than skipping the package.
PROF_LIVE_MAKECONF_EXTRA=(
    'LUA_SINGLE_TARGET="lua5-4"'
)

# Build knobs for the image's emerge runs.
#
# ccache is shared with the host. Safe, because ccache keys an object on the
# compiler binary and the whole command line: the image's hardened gcc (built
# with the 'hardened' USE, i.e. default PIE/SSP) is a different binary from the
# host's, and the flags differ too, so the two never hand each other an object.
# The catch is the other way round — the first hardened build misses on
# everything and only grows the cache; the win comes on re-runs of this image.
# xstage bind-mounts it during 'pkgs' and excludes /var/cache/ccache from the
# squashfs, so a 150 GB cache cannot end up in the ISO.
PROF_LIVE_CCACHE_DIR="/var/cache/ccache"

# The host's DISTDIR. A fresh resolution of this image wants ~12 GB of source
# tarballs; this host already holds 60 GB of distfiles, so the overlap is most
# of it. Bound read-write, so anything genuinely new is cached for the host too.
# 'squash' excludes /var/cache/distfiles, so the ISO is unaffected either way.
PROF_LIVE_DISTFILES_DIR="/var/tmp/distfiles"

# The host's PORTAGE_TMPDIR/portage. A 486-package run unpacks and builds tens
# of GB of trees; with this bound, none of that churn touches the image rootfs
# and the host's filesystem absorbs it. 'squash' excludes /var/tmp/portage
# either way, so this changes where the work happens, not what ships.
# Do not run a host emerge concurrently with 'pkgs' while this is shared —
# portage does not lock across chroots.
PROF_LIVE_BUILDDIR="/var/tmp/portage"


# NOT enabled here: getbinpkg. Gentoo's binhost builds against the plain
# amd64 profiles, never hardened. --binpkg-respect-use compares USE flags and
# nothing else, so a package whose USE happens to match would be accepted even
# though a non-hardened toolchain produced it — no default PIE, no SSP, no
# FORTIFY — and it would also throw away -march=native. Silently unhardened
# binaries in a hardened image is the one failure mode this profile exists to
# prevent. Build a binhost from THIS chroot instead (FEATURES=buildpkg) and
# reuse that across rebuilds.
#
# Also deliberately absent from PROF_LIVE_EMERGE_OPTS: --autounmask-write.
# 'pkgs' is non-interactive, and portage answers autounmask-write by writing
# to the image's /etc/portage and then aborting for a dispatch-conf review —
# it converts a clear resolver error into a stalled run, and mutates the
# image's config behind the profile's back.
# --update --newuse --deep is not optional here. The stage3 arrives with its
# own USE (libgcrypt without static-libs, say); this profile then asks for a
# large custom USE and its own CFLAGS. Without --newuse portage refuses to
# rebuild an already-installed package just because a flag changed, and the
# run dies on a slot conflict it describes as "no ebuilds built with USE flags
# to satisfy" — which reads like a missing package.use entry and is not one.
# --deep carries the same rule down to indirect dependencies.
#
# The honest cost: this rebuilds most of the stage3's userland with the
# profile's flags. That is the point of a custom-USE, custom-CFLAGS image, but
# it is hours, not minutes.
PROF_LIVE_EMERGE_OPTS="--jobs=16 --load-average=32 --quiet-build=y
                       --update --newuse --deep
                       --keep-going --verbose-conflicts
                       --binpkg-respect-use=y --binpkg-changed-deps=y
                       --autounmask-backtrack=y --backtrack=30"

# 'sandbox' and 'parallel-fetch' are already profile defaults; 'fail-clean' is
# left out on purpose — it deletes the build directory on failure, and in a
# 400-package image the build directory is the only evidence of what broke.
# 'strict' makes Manifest enforcement a hard error (the policy's "wymuszona
# weryfikacja sum kontrolnych" made literal)
PROF_LIVE_FEATURES="buildpkg strict"

# Own persistent PKGDIR — NEVER the host's /var/cache/binpkgs: the hardened
# toolchain class must not mix with the non-hardened host packages. No
# getbinpkg either; the cache exists so buildpkg output survives image
# rebuilds and can be reused explicitly (--usepkg) when iterating.
PROF_LIVE_BINPKGS_DIR="/var/cache/binpkgs-amd64kdehardened"

# Config fragments deployed into the image before 'pkgs' runs, as a stack:
# genstage/live/common/ first, then genstage/live/hardened/ on top.
#
# 'common' is the host transplant, shared with amd64kde: host.keywords (without
# which 'pkgs' aborts on the first testing-only atom — app-admin/awscli-bin is
# simply the alphabetically earliest of 45), host.use, rare-flags.use, and
# zz-image.use with the build-time cycle cuts. Every one of those cycles came
# from a broad global USE flag reaching a low-level library, so they bite any
# from-scratch image on this host's USE list, hardened or not.
#
# 'hardened' adds only what is specific to this variant: desktop-profile.use
# (the package.use entries the desktop profile target ships and hardened does
# not) and the sysctl/modprobe rules from intro-hardening.md.
#
# The absolute entry is the personal install payload for the T14 — this image
# is the one that installs onto that laptop. NOT in this repo; refresh with
# ~/Claude/secure/live-overlay-sync.sh. Lands as /usr/local/bin install
# scripts + /root/t14 (target /etc snapshot, gentools walkthrough,
# SECRET-MANIFEST; SB keys are copied to /root/secureboot at install time
# from the encrypted partition, never carried in the image).
# 'tools' = the public install toolchain (live/tools-sync.sh mirrors it from
# ~/Claude/bin), shared with amd64kde. Applied before the personal payload.
PROF_LIVE_OVERLAY_DIR="common hardened tools /home/pwas/Claude/secure/live-overlay"

# NOT done here on purpose: AIDE databases, USBGuard policies and Lynis
# baselines describe the machine they were generated on, so a live image has to
# build them at first boot, not at image-build time. The packages ship; the
# baselines are the operator's job.

