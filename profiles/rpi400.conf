# xp profile: Raspberry Pi 400 (BCM2711, Cortex-A72) — full Gentoo stage3 on SD
#
# This is PHYSICAL hardware, not a qemu platform. qemu appears in two separate
# roles and neither of them is the target:
#   * qemu-user (binfmt_misc) lets this x86_64 host chroot into an aarch64
#     rootfs so catalyst/emerge can run at all — a build tool;
#   * qemu-system-aarch64 -M raspi4b (PROF_QEMU_MACHINE) is the boot GATE.
#     qemu has no Pi 400 model, so the closest SoC sibling stands in — same
#     BCM2711 die. It is output-only (serial and USB input never reach the
#     guest, qemu issue #2969), so it proves "kernel booted, root mounted,
#     init ran" and nothing more. The real console is the board itself.
PROF_NAME=rpi400
PROF_KIND=board
PROF_TUPLE=aarch64-unknown-linux-gnu
PROF_PORTAGE_PROFILE=default/linux/arm64/23.0/systemd
PROF_CPU=cortex-a72
PROF_BOARD=rpi400
PROF_QEMU_MACHINE=raspi4b
PROF_DTB=bcm2711-rpi-4-b.dtb
PROF_IP=192.168.0.200/24
PROF_GW=192.168.0.1
PROF_DNS=192.168.0.1
PROF_XSTAGE_TARGET=arm64        # stage3-unpack installation method

# Which upstream arm64 stage3 'seed'/'unpack' start from. See
# LAB_STAGE3_FLAVOURS_ARM64 in global.conf — note arm64 has no glibc
# hardened build, so 'hardened-openrc' is amd64-only.
#
# systemd, and PROF_PORTAGE_PROFILE above matches it. The card is configured
# accordingly: systemd-networkd holds the fixed address instead of netifrc,
# sshd.service is enabled through a .wants symlink instead of a runlevel one,
# and cmdline.txt execs /usr/lib/systemd/systemd rather than /sbin/init.
# Changing this line back to 'openrc' flips all four — nothing else to edit.
#
# One consequence beyond xstage: PROF_PORTAGE_PROFILE is also what xarm gives
# the crossdev sysroot. An existing /usr/aarch64-unknown-linux-gnu still
# carries the old profile until 'sudo xarm setup' repoints it, so cross-emerged
# binpkgs built before that switch were built for an OpenRC target.
PROF_STAGE3_FLAVOR=systemd
PROF_XLAB_TARGET=gentoo
PROF_IMAGE_CMD=image
# Build tree under rpilinuxlab/build/. The name reads arch + medium + variant:
# 'arm64' + 'sd' (SD card, as opposed to the native profiles' 'iso') + profile.
#
# Its own tree, NOT the plain 'arm64sd-rpi400' this profile used before the
# systemd switch: that one holds the OpenRC rootfs and sd.img the physical
# board was verified on, and it now belongs to rpi400openrc.conf. Unpacking a
# systemd stage3 over it would have destroyed a working artifact — 'unpack'
# does prompt first, but a prompt is not a design.
PROF_BUILD_SUBDIR=arm64sd-rpi400-systemd
# Extra packages for the card, on top of the stage3's @system. Cross-emerged
# into the rootfs by 'xp rpi400 pkgs' (--root=, --usepkg --buildpkg), so it
# belongs between 'rpi' and 'image' — 'image' packs whatever the rootfs holds
# at that moment. Unset means the verb refuses rather than doing nothing.
#
# The USE flags come from the crossdev sysroot, NOT from this file: run
# 'sudo xarm setup' after any profile switch or the packages are built against
# whatever profile the sysroot was last pointed at.
#PROF_PKGS="net-misc/chrony app-admin/sudo"

# Variant profiles: copy this file, then set —
#PROF_BUILD_SUBDIR=arm64sd-kde  # e.g. a KDE variant keeps its own tree
