# --- alert mesh / remote access (2026-08-30) --------------------------------
# The Pi joins the ntfy/tailscale alert mesh the amd64 images already carry:
#  - net-misc/ntfy-bin (::pwr, prebuilt static Go, arm64 asset): primarily
#    the `ntfy publish` CLI for scripts; the server unit ships disabled and
#    is spare redundancy (nvhard :8090 is primary, the Cudy AP secondary).
#  - net-vpn/tailscale (stable arm64): go-module packages cross-build fine —
#    only dev-lang/go itself is in the chroot-fallback class above.
# Keywords for the ::pwr trio are in rpi400kde.keywords; the sysroot reaches
# ::pwr via the hand-written repos.conf/pwr.conf (see the keywords header).
# Node-box role (full plan: ~/Claude/info/rpi400-node.md):
#  - net-p2p/bitcoin-cash-node-bin (::pwr, official prebuilt aarch64
#    tarball): trivial under cross, only unpacks + installs.
#  - net-misc/elopool (::pwr, ckpool fork, small C autotools with vendored
#    jansson): host build verified 2026-08-30; the yasm SSE/AVX objects are
#    x86-only conditionals and the ARM sha2 path is a compile-only probe, so
#    cross has a fair chance — if it dies, native fallback via 'enter' like
#    the chroot-fallback class above.
# Both fowners to bitcoin:bitcoin — the acct pair must be IN the sysroot
# (PROF_SYSROOT_PKGS below), the standard acct fowners trap.
PROF_PKGS="${PROF_PKGS} net-misc/ntfy-bin net-vpn/tailscale net-p2p/bitcoin-cash-node-bin net-misc/elopool"

# Only read by 'xp rpi400kde sysroot-prep' — run once after a from-scratch
# sysroot (xarm clean / fresh setup), before the first 'pkgs'. Both classes
# below were discovered because 'pkgs' resolver structurally cannot reach
# them (see the pitfalls table in skill gentoo-crosscompile for the full
# mechanism of each); once the sysroot has a completed build they persist on
# their own and this step is a no-op you can skip.
#  - extra-cmake-modules: BDEPEND-only in ecm.eclass (host-resolved by the
#    cross wrapper) yet needed IN the sysroot because KDE packages call
#    find_package(ECM ...) directly, and MODE_PACKAGE=ONLY (global fix,
#    package.env) confines that search to the sysroot.
#  - acct-group/acct-user (crontab/mail/man/ntp/cron/postmaster): fowners at
#    install time resolves names against PORTAGE_CONFIGROOT (= the sysroot),
#    not the target ROOT being built — cronie's acct-group/crontab RDEPEND
#    only ever lands in the ROOTFS, never the sysroot, so fowners fails
#    there every time on a fresh sysroot.
# dev-qt/qtbase joined 2026-08-16: on a FRESH sysroot the resolver orders
# breeze-icons before qtbase (its Qt use is BDEPEND-shaped, and BDEPENDs
# resolve against the HOST), so ECM's ECMQueryQt dies on "No Qt6 qtpaths
# executable found" in the sysroot. Pre-seeding qtbase fixes the ordering
# for the whole KDE-frameworks sysroot closure.
# dev-build/libtool joined 2026-08-17: dev-util/dialog links its library
# through a STANDALONE libtool whose --tag=CC config carries the build
# host's x86 CC — the cross-merged sysroot copy has the aarch64 toolchain
# baked in and env/dialog-cross-libtool.conf points configure at it.
# dev-python/pybind11 joined 2026-08-17: header-only, BDEPEND-shaped and
# host-resolved, but the cross gcc's --sysroot include search never sees
# the host's /usr/include/pybind11 — contourpy (matplotlib dep) fataled
# on the missing header. Same class as extra-cmake-modules.
#
# Sysroot fixup to re-apply if app-crypt/qca is ever re-merged: qca's
# exported Qca-qt6Targets*.cmake hardcode ABSOLUTE install paths
# (/usr/lib64/libqca..., /usr/include/Qca-qt6) — cmake loads the sysroot
# config but the imports then resolve to the HOST's x86 files
# ("file in wrong format" linking konversation, 2026-08-17). Fix:
#   sed -i 's|"/usr/lib64/libqca|"/usr/aarch64-unknown-linux-gnu&|;
#           s|"/usr/include/Qca-qt6|"/usr/aarch64-unknown-linux-gnu&|' \
#       /usr/aarch64-unknown-linux-gnu/usr/lib64/cmake/Qca-qt6/Qca-qt6Targets*.cmake
# (the sed above is illustrative — prefix both quoted paths with the
# sysroot; CMAKE_SYSROOT re-roots find results, never IMPORTED_LOCATIONs
# written literally in an export file).
#
# Sysroot fixup to re-apply if x11-libs/wxGTK is ever re-merged: its
# cross wx-config script bakes prefix=/usr, so consumers get
# target-absolute -I paths that do not exist on the build host (wxpython
# died on wx/setup.h, 2026-08-17 — wxwidgets.eclass finds the right
# tuple-prefixed script via ESYSROOT, the paths inside are the problem).
# Fix: in .../usr/lib64/wx/config/aarch64-unknown-linux-gnu-gtk3-unicode-3.2
# change line ~401 ':-/usr}' to ':-/usr/aarch64-unknown-linux-gnu/usr}'.
# (cmake consumers could rebase via wxWidgets_CONFIG_OPTIONS=--prefix=...,
# see env/wx-cross-config.conf, but waf/sip consumers take no options.)
# The acct list grew 2026-08-17 (colord's fowners, same class as chrony's
# ntp): colord/distcc/nm-openvpn/syncthing — found by diffing rootfs vs
# sysroot acct-* vdb entries, not one failure at a time.
# acct-group/bitcoin + acct-user/bitcoin joined 2026-08-30: fowners targets
# of the node-box packages (bitcoin-cash-node-bin, elopool) above.
PROF_SYSROOT_PKGS="kde-frameworks/extra-cmake-modules dev-qt/qtbase dev-build/libtool dev-python/pybind11 acct-group/bitcoin acct-group/colord acct-group/crontab acct-group/distcc acct-group/mail acct-group/man acct-group/nm-openvpn acct-group/ntp acct-group/syncthing acct-user/bitcoin acct-user/colord acct-user/cron acct-user/distcc acct-user/mail acct-user/man acct-user/nm-openvpn acct-user/ntp acct-user/postmaster acct-user/syncthing"
