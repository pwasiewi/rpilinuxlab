# xp profile: Raspberry Pi 400 — KDE Plasma on Wayland (desktop-systemd variant)
#
# The amd64 KDE live images' quality-of-life and security payload on the Pi,
# minus everything x86: non-hardened base (arm64 has no glibc hardened flavour,
# see the parent's comment), no NVIDIA/CUDA, VIDEO_CARDS is the Pi's own KMS
# stack (vc4 display + v3d GPU). Hardware facts all come from the parent.
#
# qtwebengine is excluded by policy: plasma-meta's 'webengine' USE is
# default-off, kdeplasma-addons pulls it only under 'webengine', plasma-nm only
# under 'openconnect' — hence both flags forced off below. If a future package
# hard-depends on it, drop that package rather than cross-build qtwebengine.
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/rpi400.conf"

PROF_NAME=rpi400kde                    # 9 chars — ext4 label 'rpi400kderoot' fits

# Flavour and portage profile must agree (parent's comment). desktop-systemd
# is in LAB_STAGE3_FLAVOURS_ARM64; the plasma profile is stable on arm64.
PROF_STAGE3_FLAVOR=desktop-systemd
PROF_PORTAGE_PROFILE=default/linux/arm64/23.0/desktop/plasma/systemd

# Own build tree — never over the headless trees (see parent about 'unpack'
# prompts not being a design).
PROF_BUILD_SUBDIR=arm64sd-rpi400kde

# A Plasma rootfs lands ~7-9 GB; 16384 keeps headroom and stays a power of 2
# for the qemu SD gate.
PROF_IMG_MB=16384

# config.txt with the KMS/DRM stack (dtoverlay=vc4-kms-v3d,cma-512) — without
# it there is no DRM device and kwin_wayland has nothing to run on.
PROF_BOOT_CONFIG=config-rpi400kde.txt

# Sysroot make.conf additions, written by 'sudo xarm setup' into the managed
# block. The sysroot is shared by all ARM profiles — rerun setup on every
# profile switch (parent's comment). Binpkgs are per-portage-profile, so this
# profile's cache (binpkgs-arm64-23.0-desktop-plasma-systemd) is isolated and
# --usepkg with binpkg-respect-use never reuses a headless build.
# -introspection is a CROSS-BUILD requirement, not a taste: dev-libs/glib
# vendors gobject-introspection since 2.88, and its giscanner builds a Python
# extension for the TARGET which the host python then cannot import
# ("_giscanner.cpython-314-x86_64-linux-gnu.so: cannot open shared object
# file", 2026-08-09). Nothing in a Plasma image needs GObject introspection at
# runtime — it is the GNOME/Python binding path. -vala rides along:
# app-crypt/libsecret has REQUIRED_USE="vala? ( introspection )".
PROF_BOARD_USE="wayland plasma kde qt6 -qt5 -gnome systemd -elogind -webengine -openconnect -introspection -vala -doc -debug -examples -gtk-doc -handbook -emacs"
PROF_BOARD_VIDEO_CARDS="vc4 v3d"
PROF_BOARD_INPUT_DEVICES="libinput"
# Per-profile portage fragments, synced into the sysroot as xprofile-* by
# 'xarm setup'/'xarm tune' and landing on the card via the overlay below —
# one source of truth for cross-emerge and the running system.
PROF_BOARD_PORTAGE_CONFDIR="${_here}/../genstage/live/rpi400kde/etc/portage"

# Overlay layers rsynced onto the rootfs by 'xp rpi400kde conf' (additive,
# left-to-right; bare names live under genstage/live/). 'hardened' is the
# arch-neutral security payload the amd64 images ship (sysctl, modprobe
# blacklist, auditd, AIDE/lynis/glsa timers, sshd/login.defs, coredump off);
# 'rpi400kde' carries the locale/sddm/portage bits.
PROF_BOARD_OVERLAY_DIR="hardened rpi400kde"

# Desktop configure step (sddm autologin, user, pipewire --global units,
# graphical.target) runs only when a session is named here.
PROF_BOARD_XSESSION="startplasma-wayland"
PROF_BOARD_USER=guest

# amdkde's desktop core minus x86: no grub/efibootmgr/zen-sources/genkernel,
# no xorg-server (Xwayland arrives via Plasma's USE deps), no NVIDIA. Security
# tail matches the hardened overlay's units (auditd, aide, lynis, logrotate).
PROF_PKGS="kde-plasma/plasma-meta kde-apps/dolphin kde-apps/konsole kde-apps/kate kde-apps/ark x11-misc/sddm media-libs/mesa gui-apps/wl-clipboard media-video/pipewire media-video/wireplumber media-sound/alsa-utils media-fonts/dejavu media-fonts/liberation-fonts media-fonts/hack media-fonts/noto-emoji net-misc/networkmanager net-misc/chrony net-misc/openssh app-admin/sudo sys-process/audit app-forensics/aide app-forensics/lynis app-admin/logrotate app-portage/gentoolkit net-firewall/iptables app-editors/vim"
