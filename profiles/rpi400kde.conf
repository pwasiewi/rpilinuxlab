# Only read by 'xp rpi400kde sysroot-prep' — run once after a from-scratch
# sysroot (xarm clean / fresh setup), before the first 'pkgs'. Both classes
# below were discovered because 'pkgs' resolver structurally cannot reach
# them (see the pitfalls table in skill gentoo-crosscompile for the full
# mechanism of each); once the sysroot has a completed build they persist on
# their own and this step is a no-op you can skip.
#  - extra-cmake-modules: BDEPEND-only in ecm.eclass (host-resolved by the
#    cross wrapper) yet needed IN the sysroot because KDE packages call
#    find_package(ECM ...) directly, and MODE_PACKAGE=ONLY (global fix,
#    package.env) confines that search to the sysroot.
#  - acct-group/acct-user (crontab/mail/man/ntp/cron/postmaster): fowners at
#    install time resolves names against PORTAGE_CONFIGROOT (= the sysroot),
#    not the target ROOT being built — cronie's acct-group/crontab RDEPEND
#    only ever lands in the ROOTFS, never the sysroot, so fowners fails
#    there every time on a fresh sysroot.
PROF_SYSROOT_PKGS="kde-frameworks/extra-cmake-modules acct-group/crontab acct-group/mail acct-group/man acct-group/ntp acct-user/cron acct-user/mail acct-user/man acct-user/ntp acct-user/postmaster"
