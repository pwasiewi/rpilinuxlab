# xp profile: Raspberry Pi 400 — KDE Plasma on Wayland (desktop-systemd variant)
#
# The amd64 KDE live images' quality-of-life and security payload on the Pi,
# minus everything x86: non-hardened base (arm64 has no glibc hardened flavour,
# see the parent's comment), no NVIDIA/CUDA, VIDEO_CARDS is the Pi's own KMS
# stack (vc4 display + v3d GPU). Hardware facts all come from the parent.
#
# qtwebengine is excluded by policy: plasma-meta's 'webengine' USE is
# default-off, kdeplasma-addons pulls it only under 'webengine', plasma-nm only
# under 'openconnect' — hence both flags forced off below. If a future package
# hard-depends on it, drop that package rather than cross-build qtwebengine.
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/rpi400.conf"

PROF_NAME=rpi400kde                    # 9 chars — ext4 label 'rpi400kderoot' fits

# Flavour and portage profile must agree (parent's comment). desktop-systemd
# is in LAB_STAGE3_FLAVOURS_ARM64; the plasma profile is stable on arm64.
PROF_STAGE3_FLAVOR=desktop-systemd
PROF_PORTAGE_PROFILE=default/linux/arm64/23.0/desktop/plasma/systemd

# Own build tree — never over the headless trees (see parent about 'unpack'
# prompts not being a design).
PROF_BUILD_SUBDIR=arm64sd-rpi400kde

# The 2026-08 QoL rebuild (LibreOffice, TeX Live, clang, R, go) grew the
# rootfs to ~18 GB, so 16384 no longer fits: 24576 gives ~25% headroom and
# still fits a "32 GB" card (~29.8 GiB real). Needs a >=32 GB card since.
PROF_IMG_MB=24576

# config.txt with the KMS/DRM stack (dtoverlay=vc4-kms-v3d,cma-512) — without
# it there is no DRM device and kwin_wayland has nothing to run on.
PROF_BOOT_CONFIG=config-rpi400kde.txt

# Sysroot make.conf additions, written by 'sudo xarm setup' into the managed
# block. The sysroot is shared by all ARM profiles — rerun setup on every
# profile switch (parent's comment). Binpkgs are per-portage-profile, so this
# profile's cache (binpkgs-arm64-23.0-desktop-plasma-systemd) is isolated and
# --usepkg with binpkg-respect-use never reuses a headless build.
# -introspection is a CROSS-BUILD requirement, not a taste: dev-libs/glib
# vendors gobject-introspection since 2.88, and its giscanner builds a Python
# extension for the TARGET which the host python then cannot import
# ("_giscanner.cpython-314-x86_64-linux-gnu.so: cannot open shared object
# file", 2026-08-09). Nothing in a Plasma image needs GObject introspection at
# runtime — it is the GNOME/Python binding path. -vala rides along:
# app-crypt/libsecret has REQUIRED_USE="vala? ( introspection )".
PROF_BOARD_USE="wayland plasma kde qt6 -qt5 -gnome systemd -elogind -webengine -openconnect -introspection -vala -doc -debug -examples -gtk-doc -handbook -emacs"
PROF_BOARD_VIDEO_CARDS="vc4 v3d"
PROF_BOARD_INPUT_DEVICES="libinput"
# Per-profile portage fragments, synced into the sysroot as xprofile-* by
# 'xarm setup'/'xarm tune' and landing on the card via the overlay below —
# one source of truth for cross-emerge and the running system.
PROF_BOARD_PORTAGE_CONFDIR="${_here}/../genstage/live/rpi400kde/etc/portage"

# Overlay layers rsynced onto the rootfs by 'xp rpi400kde conf' (additive,
# left-to-right; bare names live under genstage/live/). 'hardened' is the
# arch-neutral security payload the amd64 images ship (sysctl, modprobe
# blacklist, auditd, AIDE/lynis/glsa timers, sshd/login.defs, coredump off);
# 'rpi400kde' carries the locale/sddm/portage bits.
#
# The absolute entry is this board's personal install payload, the arm64
# twin of the amd64 images' ~/Claude/secure/live-overlay — NOT in this repo,
# hand-owned, never auto-edited (see rpilinuxlab/CLAUDE.md's hard rule).
# Applied last so it can override anything the named layers above ship.
# Missing directory is a warn, not a die (xstage cmd_arm64_conf), so this is
# safe to reference before the tree exists.
PROF_BOARD_OVERLAY_DIR="hardened rpi400kde /home/pwas/Claude/secure-rpi400/live-overlay"

# Desktop configure step (sddm autologin, user, pipewire --global units,
# graphical.target) runs only when a session is named here.
PROF_BOARD_XSESSION="startplasma-wayland"
PROF_BOARD_USER=guest

# amdkde's desktop core minus x86: no grub/efibootmgr/zen-sources/genkernel,
# no xorg-server (Xwayland arrives via Plasma's USE deps), no NVIDIA. Security
# tail matches the hardened overlay's units (auditd, aide, lynis, logrotate).
PROF_PKGS="kde-plasma/plasma-meta kde-apps/dolphin kde-apps/konsole kde-apps/kate kde-apps/ark x11-misc/sddm media-libs/mesa gui-apps/wl-clipboard media-video/pipewire media-video/wireplumber media-sound/alsa-utils media-fonts/dejavu media-fonts/liberation-fonts media-fonts/hack media-fonts/noto-emoji net-misc/networkmanager net-misc/chrony net-misc/openssh app-admin/sudo sys-process/audit app-forensics/aide app-forensics/lynis app-admin/logrotate app-portage/gentoolkit net-firewall/iptables app-editors/vim"

# --- amdkdehard QoL/security payload, transplanted 2026-08-15 ---------------
# Everything from the parent hard image's PROF_LIVE_PKGS that has arm64
# keywords, minus four exclusion classes (atom-by-atom list in the adding
# commit): UEFI/x86 boot chain, the Xorg server stack (Wayland-only policy
# above), hardware the Pi does not have (TPM/ACPI/VAAPI/b43/MSR), and
# host-side machinery (qemu/crossdev/genkernel — the SD kernel is xarm's).
# Source firefox is swapped for firefox-bin (upstream ships arm64 builds
# since 136); spidermonkey, whose only listed consumer that was, went with
# it. 56 amdkdehard atoms have no arm64 keywords at all and stay off
# (usbguard, ima-evm-utils, rkhunter, pam_mount, spotify, discord, slack,
# hashcat, rar...); net-print/foomatic-db-ppds is the one exception — pure
# PPD data under a ** keyword, printers are an explicit parity goal.
# The 49 ~arm64-only atoms have entries in
# package.accept_keywords/rpi400kde.keywords (batch section, same date).
#
# Introspection exclusion class (probe 2026-08-16): gimp, solaar, mcomix,
# mypaint, vala were dropped from the transplant — each hard-requires
# gobject-introspection (gimp via REQUIRED introspection USE on the whole
# glib/gtk+/pango stack, vala BY DEFINITION, the other three via PyGObject),
# and the scanner
# cannot be cross-built (glib vendors it since 2.88; same class as
# print-manager -gtk and pcsc-tools -gui in the board package.use).
# Re-adding any of them means the qemu-chroot native-build fallback for the
# entire GTK stack, not a keyword.
#
# Chroot-fallback class: libreoffice(+l10n) and the whole TeX group
# (app-text/texlive, texlive-core, app-text/dvisvgm, dev-tex/latexmk,
# latex-beamer, latex2pydata) are OUT of the cross list — both chains hard-require
# harfbuzz[graphite], and graphite2's unprefixed pkg-config Cflags poison
# every cross compile (see the harfbuzz entry in the board package.use).
# app-benchmarks/bonnie++ joins them for a different reason: its configure
# has a bare AC_TRY_RUN that errors out unconditionally under cross (no
# cache variable to pre-seed). dev-lang/go too: make.bash assembles the
# arm64 runtime/cgo with the HOST assembler despite the ebuild's own
# CC_FOR_TARGET (go-module PACKAGES cross-build fine — only the toolchain
# itself is affected). dev-debug/bpftrace goes with them: its dep chain
# (bcc -> clang-22 -> clang-rtlib-config) demands a gcc[-openmp] rebuild
# in BOTH roots — cross-building entire compilers for one tracing tool
# is the wrong trade (the sysroot gcc build failed outright, 2026-08-16).
# dev-python/pyqt6 joins (2026-08-17): its sip build is driven by the HOST
# qmake, whose -query paths resolve Qt to the host's absolute
# /usr/lib64/libQt6*.so — the x86 library lands verbatim in the aarch64
# link and no flag override can re-root it (qmake has no sysroot notion).
# Cross pass drops matplotlib's qt6 backend instead (board package.use);
# restore it natively in the fallback below.
# dev-lang/R joins (2026-08-17): upstream does not support cross-compiling
# R at all — configure is built on dozens of AC_RUN_IFELSE probes and dies
# on the first ("date-time conversions do not work in 2020"). One leaf
# language runtime, zero in-list consumers: native build below.
# app-text/qpdfview joins (2026-08-17): pure qmake build — the QMAKEFEATURES
# override fixes the flag injection but host qmake still resolves Qt to the
# host's absolute /usr/lib64/libQt6*.so (the pyqt6 class exactly); okular
# remains the image's PDF reader either way.
# dev-lang/ruby + app-eselect/eselect-ruby join (2026-08-17): ruby itself
# cross-builds (env/ruby-baseruby.conf overrides the ebuild's
# --without-baseruby — kept for other profiles), but it drags 91 dev-ruby/*
# gems whose mkmf extconf runs the HOST ruby's rbconfig (host gcc) against
# the cross CFLAGS — "bad value 'armv8-a' for -march" on the first
# C-extension gem (dev-ruby/json). 91 packages of host/target toolchain
# mixing is the wrong fight; the whole stack builds natively below.
# Install them NATIVELY after 'pkgs':
#   sudo xp rpi400kde enter "emerge -1q app-office/libreoffice \
#        app-office/libreoffice-l10n app-text/texlive app-text/dvisvgm \
#        dev-tex/latexmk dev-tex/latex-beamer dev-tex/latex2pydata \
#        app-benchmarks/bonnie++ dev-lang/go dev-debug/bpftrace \
#        dev-lang/ruby app-eselect/eselect-ruby app-text/qpdfview \
#        dev-lang/R \
#        dev-python/pyqt6 && USE=qt6 emerge -1q --newuse dev-python/matplotlib"
# (qemu-user chroot; the predicted cross-hostile-giant path.)
