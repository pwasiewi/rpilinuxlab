# xp profile: Raspberry Pi Zero 2 W (RP3A0/BCM2837, Cortex-A53) — full Gentoo
# stage3 on SD, with the Waveshare 2.13" V4 e-Paper HAT (SSD1680, 250x122).
#
# The rpi3 structure on the Zero's hardware: the arm64 (stage3-unpack) track,
# OpenRC, non-hardened. The tiny cross-emerged rootfs for the same board stays
# in zero2w.conf — two profiles, two build trees, one piece of hardware.
#
# Network: the Zero has no ethernet. Primary is USB gadget ethernet (g_ether
# over the data port, dtoverlay=dwc2 — the board shows up as a USB NIC on the
# machine at the other end of the cable). WiFi is PREPARED but not enabled:
# wpa_supplicant + brcmfmac43436 firmware are installed and /etc/conf.d/net
# carries a commented wlan0 stanza; credentials are typed on the running
# board, never baked into the image.
PROF_NAME=zero
PROF_KIND=board
PROF_TUPLE=aarch64-unknown-linux-gnu
PROF_PORTAGE_PROFILE=default/linux/arm64/23.0
PROF_CPU=cortex-a53
PROF_BOARD=zero
# Documentation only — the qemu gate hardcodes raspi3b + the Pi 3 DTB because
# qemu has no Zero 2 W model (same BCM2837 die family stands in).
PROF_QEMU_MACHINE=raspi3b
PROF_DTB=bcm2710-rpi-zero-2-w.dtb
# Address on the USB gadget link (usb0), same contract as the tiny image
PROF_IP=10.0.0.2/24
PROF_GW=10.0.0.1
PROF_DNS=8.8.8.8
PROF_XSTAGE_TARGET=arm64        # stage3-unpack installation method

# See LAB_STAGE3_FLAVOURS_ARM64 in global.conf for the valid values.
PROF_STAGE3_FLAVOR=openrc
PROF_XLAB_TARGET=aarch64
PROF_IMAGE_CMD=image
# own tree — never over the tiny track's tinyroot or the other SD trees
PROF_BUILD_SUBDIR=arm64sd-zero
# config.txt with SPI (e-Paper), dwc2 (gadget) and the serial console
PROF_BOOT_CONFIG=config-zero.txt
# overlay layer: wpa_supplicant template, g_ether module load, e-Paper banner
PROF_BOARD_OVERLAY_DIR="zero"

# Extra packages on top of the stage3's @system, cross-emerged by
# 'xp zero pkgs'. raspberrypi-wifi-ucode carries the Zero 2 W's brcmfmac43436
# firmware; wpa_supplicant/iw stay dormant until credentials are entered.
PROF_PKGS="net-misc/chrony app-admin/sudo net-wireless/wpa_supplicant net-wireless/iw sys-firmware/raspberrypi-wifi-ucode"
