# xp profile: amdkdehard retargeted at Intel Skylake-era laptops.
#
# A thin derivative, the same way nvidiahard derives from amdkdehard: source
# the parent, override only the deltas. The entire hardened package list, USE
# array, emerge options, no-getbinpkg policy, licence audit — and since
# 2026-08-10 the clang/BTF kernel toolchain — carry over; edits to
# amdkdehard.conf land here automatically. There is no NVIDIA anywhere in the
# parent, which is exactly right for these machines.
#
# ISA floor decision (the "v2 or v3" question, 2026-08-10): Skylake CORE
# (i3/i5/i7 6xxx and every later Core up to the AVX-512-less mainstream
# parts) is fully x86-64-v3 capable — AVX2, BMI1/2, FMA, F16C, MOVBE. The
# trap is the OTHER Skylake: Pentium/Celeron-branded dies (4405U class) ship
# with AVX fused off and top out at x86-64-v2. This profile floors at v3 ON
# PURPOSE — if a Pentium-class machine ever joins the fleet, flip to
# -march=x86-64-v2, RENAME the binpkg dir below (v3 objects are illegal on
# that CPU), and drop aes/avx/avx2/bmi*/f16c/fma3 from CPU_FLAGS_X86.
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/amdkdehard.conf"

PROF_NAME=intelhard
PROF_LIVE_HOSTNAME=inthard
PROF_LIVE_VOLID=INTELHARD
PROF_BUILD_SUBDIR=intelhard

# Written out rather than '-march=native' for the same reason the parent
# spells znver3: native on the build host would bake znver3 into an Intel
# image. -mtune=skylake is scheduling only, never ISA — Kaby/Coffee/Comet
# Lake are Skylake-derived cores, so the tune fits the whole plausible fleet;
# an Ice Lake or newer machine merely runs v3 code scheduled a bit
# conservatively.
PROF_LIVE_CFLAGS="-march=x86-64-v3 -mtune=skylake -O2 -fomit-frame-pointer -pipe"

# The parent's Zen set minus what Skylake does not have: sha (SHA-NI arrives
# with Ice Lake / Goldmont — a Zen binpkg built with it faults here, which is
# WHY the binpkg dir below is separate), sse4a (AMD-only), vpclmulqdq (Ice
# Lake+). aes and rdrand stay: every v3-capable Intel Core has both.
PROF_LIVE_CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul
    popcnt rdrand sse sse2 sse3 sse4_1 sse4_2 ssse3"

# Never share the parent's cache: those packages are -march=znver3 and can
# carry AMD-only instructions. A fresh dir also means the first build is a
# full compile — expected, priced in.
PROF_LIVE_BINPKGS_DIR="/var/cache/binpkgs-intelhard"

# The one package the parent deliberately comments out
# (#sys-firmware/intel-microcode — dead weight on an AMD laptop) becomes
# mandatory here: Skylake is ground zero for the speculative-execution
# families, and a HARDENED image whose mitigations run on launch-day
# microcode is theatre. Licence side is already covered by the parent's
# redistributable-binary ACCEPT_LICENSE block.
# First-build TODO: verify EARLY loading on hardware — dmesg should show
# 'microcode updated early'; late load alone leaves some mitigations
# (TAA/MDS class) incomplete. If genkernel's integrated-initramfs path turns
# out not to prepend the ucode cpio, that is a build-step fix, not a reason
# to drop the package.
PROF_LIVE_PKGS+=(
    sys-firmware/intel-microcode
)

# Inherited and left alone, recorded as decisions:
#  * PROF_LIVE_KFRAGS="" — no profile fragment; the shared live.fragment
#    already carries DRM_I915=m and DRM_XE=m, so Skylake graphics needs
#    nothing extra.
#  * PROF_LIVE_VIDEO_CARDS keeps the parent's full list (amdgpu … intel i915
#    iris): VIDEO_CARDS selects userspace drivers, and a portable rescue
#    image that also boots the AMD machines is worth the mesa bytes.
#  * PROF_LIVE_OVERLAY_DIR still ends with /home/pwas/Claude/secure/
#    live-overlay — the T14 kit payload ("inherits everything", operator
#    decision 2026-08-10). If an Intel machine must not carry that identity
#    payload, override the variable here with the list minus that path.
