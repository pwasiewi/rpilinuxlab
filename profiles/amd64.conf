# xp profile: native amd64 host — catalyst stages, KVM-fast xlab POCs, and the
# live half (squashfs + isolinux ISO, the technique bin/v uses for /etc/liveusb).
# This is the generic profile: a plain console system. Desktop variants live in
# their own files (amd64kde.conf, intelgnome.conf) and differ only in the tiers
# they select and the make.conf they deploy.
PROF_NAME=amd64
PROF_KIND=native
PROF_XSTAGE_TARGET=amd64
PROF_XLAB_TARGET=x86_64

# Which upstream stage3 to start from. See LAB_STAGE3_FLAVOURS in global.conf
# for the full list; the value also decides the init and how 'configure'
# enables services, so it is one setting, not two.
PROF_STAGE3_FLAVOR=openrc

# --- live image (xp amd64 build|pkgs|kernel|squash|iso|gate) ----------------
# Tier names come from profiles/amd64.pkgs; xstage unions them in this order
# and deduplicates. The host-* tiers are off-limits here on purpose.
PROF_LIVE_TIERS="base portage admin fs arch net sec crypt boot lang dev lint fun"
PROF_LIVE_EXTRA_PKGS=""         # extra atoms, appended after the tiers
PROF_LIVE_SETS=""               # portage sets, e.g. "@kde-baseapps-26.04"
PROF_LIVE_HOSTNAME=amd64live
PROF_LIVE_VOLID=AMD64LIVE       # ISO9660 volume id (uppercase, <= 32 chars)
# Own build tree, so several live profiles coexist under rpilinuxlab/build/.
PROF_BUILD_SUBDIR=amd64live
