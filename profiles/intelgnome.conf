# xp profile: Intel-graphics GNOME live image.
# Same native track as amd64kde.conf; the point of this profile is the
# contrast — one lab, two desktops, two driver sets. It also shows the other
# way to name packages: tiers out of profiles/amd64.pkgs instead of one long
# explicit array (amd64kde.conf spells every atom out).
PROF_NAME=intelgnome
PROF_KIND=native
PROF_XSTAGE_TARGET=amd64
PROF_XLAB_TARGET=x86_64

# GNOME upstream targets systemd, but this lab runs OpenRC everywhere, so the
# profile keeps OpenRC + elogind (see PROF_LIVE_USE below). Change this one
# line to 'systemd' and the init, cmdline and service enablement follow.
PROF_STAGE3_FLAVOR=openrc

PROF_LIVE_HOSTNAME=gnomelive
PROF_LIVE_VOLID=INTELGNOME
PROF_BUILD_SUBDIR=intelgnome

# i915 and i965 are both still live drivers; i810 is dead and deliberately absent.
PROF_LIVE_VIDEO_CARDS="intel i915 i965 iris"
PROF_LIVE_USE="wayland gnome gtk introspection -kde -qt6 elogind -systemd"
PROF_LIVE_XSESSION="gnome-session"

PROF_LIVE_SETS=""
PROF_LIVE_TIERS="base portage admin fs arch net sec crypt boot lang dev
                 x11 wayland term gnome media print browser fun"

# Appended after the tiers; the GNOME session is a meta-package, so the tier
# only carries the pieces around it.
PROF_LIVE_PKGS=(
    gnome-base/gnome-light
    x11-terms/gnome-terminal
)
