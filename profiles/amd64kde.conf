# xp profile: amd64 KDE Plasma live image (Wayland session, broad driver set).
# The desktop counterpart of amd64.conf — same native track (host CPU, no
# emulation; the ARM profiles are the qemu/crossdev half of the lab), ending in
# livecd.squashfs + an isolinux ISO instead of an SD card.
PROF_NAME=amd64kde
PROF_KIND=native
PROF_XSTAGE_TARGET=amd64
PROF_XLAB_TARGET=x86_64

# Plain glibc + OpenRC. Switch to 'desktop-openrc' for upstream's desktop USE
# preset, or to 'systemd' if you want a systemd session instead.
PROF_STAGE3_FLAVOR=openrc

PROF_LIVE_HOSTNAME=kdelive
PROF_LIVE_VOLID=AMD64KDE         # ISO9660 volume id (uppercase, <= 32 chars)
PROF_BUILD_SUBDIR=amd64kde       # own tree under rpilinuxlab/build/

# Deployed into the image's /etc/portage/make.conf before 'pkgs' runs. Driver
# flags stay broad on purpose (same reasoning as the host's make.conf): the ISO
# may boot on machines other than the one that built it.
PROF_LIVE_VIDEO_CARDS="amdgpu radeonsi nvidia intel i915 i965 iris"
PROF_LIVE_USE="wayland plasma kde qt6 -gnome -gtk elogind -systemd"
PROF_LIVE_XSESSION="startplasma-wayland"

# Two python slots, matching this host's make.conf. The ::gentoo profile
# default is python3_14 alone, and packages upstream has not ported yet carry
# a REQUIRED_USE naming only older slots — sys-process/criu-4.1 wants
# any-of ( python3_12 python3_13 ). An unsatisfiable REQUIRED_USE is a resolver
# error, so one such package aborts the entire 'pkgs' run.
# Cost: every python package is built twice. Trade it for a per-package
# 'python_targets_python3_13' in package.use if image size starts to matter,
# but then each lagging package has to be discovered by a failed run first.
PROF_LIVE_PYTHON_TARGETS="python3_13 python3_14"
PROF_LIVE_PYTHON_SINGLE_TARGET="python3_14"

# Portage sets — meta-packages, not atoms, so they stay out of the list below.
PROF_LIVE_SETS="@kde-baseapps-26.04 @kdegraphics-26.04 @kdeutils-26.04"

# Optional: pull whole tiers from profiles/amd64.pkgs in addition to the
# explicit list. Empty here — this profile spells everything out.
PROF_LIVE_TIERS=""

