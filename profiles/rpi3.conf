# xp profile: Raspberry Pi 3 (BCM2710/BCM2837, Cortex-A53) — Gentoo stage3 on SD
PROF_NAME=rpi3
PROF_KIND=board
PROF_TUPLE=aarch64-unknown-linux-gnu
PROF_PORTAGE_PROFILE=default/linux/arm64/23.0
PROF_CPU=cortex-a53
PROF_BOARD=rpi3
PROF_QEMU_MACHINE=raspi3b
PROF_DTB=bcm2710-rpi-3-b.dtb
PROF_IP=192.168.0.201/24
PROF_GW=192.168.0.1
PROF_DNS=192.168.0.1
PROF_XSTAGE_TARGET=arm64
PROF_XLAB_TARGET=aarch64
PROF_IMAGE_CMD=image
# keep rpi400's SD tree intact — the Pi 3 gets its own build dir by default
PROF_BUILD_SUBDIR=arm64sd-rpi3
