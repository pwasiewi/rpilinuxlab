# xp profile: amdkdehard + the NVIDIA proprietary stack + CUDA + unsloth.
#
# The experiment this profile exists for: does the compute stack — nvidia-
# drivers, nvidia-cuda-toolkit, and sci-ml/unsloth with everything it pulls —
# build and run on the HARDENED toolchain? amdkdehard deliberately refuses the
# blob ("an out-of-tree binary kernel module with no source is the one thing a
# hardened image has no way to vouch for"); this profile knowingly overrides
# that call to find out what the combination is worth.
#
# A thin derivative, the same way amdkdehard derives from amdkde: source the
# parent, override only the deltas. The entire hardened package list, USE
# array, emerge options, no-getbinpkg policy and licence audit carry over —
# edits to amdkdehard.conf land here automatically.
#
# Risk assessment, for the record:
#  * userspace: low. The 23.0 profiles already default to PIE/SSP everywhere;
#    hardened adds FORTIFY=3, full RELRO and stack-clash-protection, which
#    prebuilt binaries (nvcc, triton-bin, the driver libs) never see and
#    compiled CUDA code tolerates (shared objects are -fPIC anyway).
#  * gcc: nvcc 13.3 caps its host compiler at gcc-15 — the 'nvidia' overlay
#    layer below carries package.mask/cuda-gcc-cap.mask for exactly this.
#  * kernel: VERIFIED compatible (2026-08-07, amdkdehard's built .config —
#    same fragments this profile inherits): MODULE_SIG=y but not FORCE, and
#    lockdown compiled with FORCE_NONE — the unsigned out-of-tree module
#    loads. The hardened.fragment's "deliberately NOT set" section records
#    both choices with rationale.
#
# Gaming rides this profile too (Steam native + Proton, lutris, wine).
# Hardening blocks none of it — verified against the same built artifacts:
# CONFIG_IA32_EMULATION=y (32-bit client and games), USER_NS_UNPRIVILEGED=y
# (pressure-vessel containers), COMPAT_32BIT_TIME=y; the hardened sysctl
# layer sets only ptrace_scope=1 (Steam-compatible) and unprivileged_bpf
# (irrelevant). Steam, Proton and game binaries are prebuilt, so the
# hardened toolchain never touches them. What gaming actually needed was
# 32-bit ABI (below) and games-util/steam-launcher imported into ::pwr
# (commit 354f130 — ::steam-overlay stays outside the image's repo policy).
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/amdkdehard.conf"

PROF_NAME=nvidiahard
PROF_LIVE_HOSTNAME=nvhard
PROF_LIVE_VOLID=NVIDIAHARD

# Re-set after amdkdehard cleared it: same gen2db desktop target as amdkde,
# same baked CONFIG_CMDLINE (iommu=pt, nvidia_drm modeset/fbdev, …).
# camera.fragment kept from amdkdehard (a plain assignment here would drop
# it) — matches the running nvhard host kernel, rebuilt with it 2026-08-14.
PROF_LIVE_KFRAGS="nvidia-desktop.fragment camera.fragment"

# Re-set after amdkdehard cleared it: this profile carries the full CUDA
# torch payload, so the gloo<->caffe2 cycle is real again (rationale at the
# original definition in amdkde.conf). MUST be a plain assignment placed
# before the 'early:' += append further down, which extends whatever base
# is in effect — without this block that append would extend an empty array
# and the caffe2 bootstrap would silently vanish.
PROF_LIVE_CYCLE_BOOTSTRAP=(
    "sci-ml/caffe2 -gloo"
)

# THIS PROFILE ONLY: ::stuff joins the image repos (operator decision
# 2026-08-08). The parents' "::gentoo + ::pwr and nothing else" invariant
# holds for them, but nvidiahard's unsloth/vllm chain needs ~26 packages
# whose ebuilds live in ::stuff (xgrammar, flashinfer, compressed-tensors,
# mistral-common, numba, the opentelemetry set, …) plus their own closures —
# importing that wholesale into ::pwr would duplicate a living overlay.
# 'conf' resolves the path via portageq on the host, same as ::pwr.
PROF_LIVE_REPOS="pwr stuff"
PROF_BUILD_SUBDIR=nvidiahard

# APPENDED, not rewritten: in a make.conf USE string the LAST occurrence of a
# flag wins, so these two cleanly flip the parent's '-nvidia -cuda' without
# editing the inherited array. Everything else in the hardened USE list stays.
PROF_LIVE_USE="${PROF_LIVE_USE} nvidia cuda"

# amdkde's line, not the parent's: 'nvidia' back in (it is what actually pulls
# x11-drivers/nvidia-drivers, via xorg-drivers), nouveau kept beside it so the
# open driver remains available at boot ('nomodeset'-class fallbacks aside,
# blacklisting decides at runtime, not the package list).
PROF_LIVE_VIDEO_CARDS="amdgpu radeonsi radeon nvidia nouveau intel i915 i965 iris"

# Appended to the parent's array (LUA_SINGLE_TARGET stays). Which GPU the CUDA
# half is compiled for — plain variables read by the build systems, so only a
# make.conf line will do. sm_120 = RTX 5070 Ti, same as amdkde; without
# CUDAARCHS, cutlass-4.4.x dies in a Python traceback inside cmake
# ("invalid literal for int()"), and without TORCH_CUDA_ARCH_LIST caffe2
# either probes for a GPU the chroot does not have or builds every arch CUDA
# knows. LLVM_SLOT is deliberately NOT copied from amdkde: the parent builds
# without a pin and the unsloth stack adds no new LLVM consumer (triton ships
# its own).
PROF_LIVE_MAKECONF_EXTRA+=(
    'CUDAARCHS="120"'
    'TORCH_CUDA_ARCH_LIST="12.0"'
    # Host parity, and what makes Steam/Proton possible: every multilib
    # library builds both ABIs, including nvidia-drivers' 32-bit GL. A
    # USE_EXPAND variable, so it must be a make.conf line, not a USE token
    # (same rule as LLVM_SLOT above). Cost, measured on the host running
    # this exact setting: 408 of 2744 packages carry abi_x86_32 — the
    # compile-heavy majority (Qt/KDE, browsers, office) is not multilib and
    # keeps matching the shared amdkdehard binpkgs; the one expensive
    # dual-ABI rebuild is llvm, unavoidable anyway (mesa[abi_x86_32]
    # USE-depends on llvm[abi_x86_32]).
    'ABI_X86="64 32"'
    # This image is the lab's build host, so its qemu must carry the ARM
    # targets — two USE_EXPAND variables, hence make.conf lines and not USE
    # tokens (same rule as ABI_X86 above; app-emulation/qemu's plain USE,
    # including 'static-user', stays in common's package.use/host.use).
    #   user/aarch64   -> the static /usr/bin/qemu-aarch64 that 'xarm setup'
    #                     insists on: binfmt hands it every aarch64 binary a
    #                     cross build tries to run, and it is the interpreter
    #                     for the qemu-user chroot that 'xarm 1by1' falls back
    #                     to when a package refuses to cross-compile.
    #   softmmu/aarch64 -> 'xp <board> gate' / 'xstage arm64 run-rpi' boot the
    #                     built SD image under qemu-system-aarch64; without it
    #                     xstage dies with exactly this instruction. x86_64
    #                     stays for the live-image gate.
    # Every image so far shipped the profile default (x86_64 only), which is
    # why the ARM lab could never run on a freshly installed image.
    'QEMU_USER_TARGETS="aarch64"'
    'QEMU_SOFTMMU_TARGETS="x86_64 aarch64"'
    # Same "this image is the lab's build host" argument, one layer down:
    # dev-util/catalyst[iso] hard-depends on
    # sys-boot/grub[grub_platforms_efi-32,grub_platforms_efi-64], so without
    # efi-32 catalyst simply cannot be merged ("no ebuilds built with USE
    # flags to satisfy grub[...]" — hit on the freshly installed nvhard
    # 2026-08-11, blocking 'xp <board> setup'). amdkde carries this line for
    # the same reason; amdkdehard redefines MAKECONF_EXTRA and drops it, so it
    # has to be restated here. Costs one extra grub target directory
    # (/usr/lib/grub/i386-efi) and nothing at runtime — grub is not this
    # image's bootloader (signed EFI stub is), it is a tool it ships.
    'GRUB_PLATFORMS="pc efi-32 efi-64"'
)

# Parent's layers, no gcc cap: this image builds its desktop with the tree's
# gcc-16 and forces gcc-15 ONLY on the CUDA packages, through
# package.env/gcc15.conf in 'common' (the maintained gcc-15 set). That is why
# 'nvidia' — a mask-only layer that pinned the WHOLE toolchain to gcc-15 — is
# gone: it now lives as the amdkde-only 'amdkde' layer, so amdkde stays
# gcc-15 (host-pool coherence) while this image does not. NO personal install
# payload: the T14 kit rides amdkdehard (that laptop has no NVIDIA GPU) and
# the host kit rides amdkde. Add one back if this image ever gets an install
# target of its own.
#
# The ML package.env rides in 'common' and needs nothing extra here:
#   sci-ml/caffe2      lowmem-j4 (the -j32 cicc OOM lesson, 2026-08-07)
#                      + ndebug + ccache-cuda + torch-git-pin + gcc15
#   sci-ml/pytorch     torch-git-pin + gcc15 (one EGIT_COMMIT for both halves)
#   dev-python/vllm    ccache-cuda + gcc15
# Host entries minus their 'native' — this image is znver3 on purpose.
# 'nvidia' = the shared desktop-GPU layer (modprobe nvidia.conf — nouveau
# blacklist, suspend + device-file options), paired with the
# nvidia-desktop.fragment kernel cmdline. Not the old mask-only 'nvidia'
# layer this header's comment refers to — that one became 'amdkde'.
#
# secure-host/live-overlay joined 2026-08-08: the "add one back if this image
# ever gets an install target" clause above came due — secure-host/
# secure-backup targets THIS image now. First cargo: the pam_mount login
# mount of /home/pw (etc/security/pam_mount.conf.xml + the pam.d/system-login
# copy), paired with sys-auth/pam_mount below. Since 2026-08-09 it also
# carries /root/firstrun.txt (post-install runbook) + ramstart.service
# (machine-dependent, so payload not repo — user decision).
PROF_LIVE_OVERLAY_DIR="common hardened nvidia tools /home/pwas/Claude/secure-host/live-overlay"
# (sys-auth/pam_mount itself is already in the inherited package list —
# amdkde and amdkdehard both carry it; only USE=crypt was missing, supplied
# by common's package.use/pam-mount.use.)

# Own build tree, same reasoning as the parent (portage does not lock across
# chroots; the subdirectory keeps this profile, amdkde, amdkdehard and host
# emerges out of each other's <category>/<pf> dirs). Under /var/tmp/portage
# on purpose — that path is the bind mount to the big disk.
PROF_LIVE_BUILDDIR="/var/tmp/portage/nvidiahard"

# SHARED with amdkdehard, deliberately, and coherent because the DESKTOP half
# of both images is now the same class of object: same hardened profile, same
# CFLAGS, and — since neither takes the gcc cap — the same gcc-16 compiler.
# --usepkg (appended below) turns that into the build-time win: the entire
# hardened desktop amdkdehard already compiled is reused here, and only the
# NVIDIA/ML/gaming delta builds from source. That delta is either absent from
# amdkdehard (caffe2, unsloth, steam…) or differs in USE (the ABI_X86="64 32"
# multilib libraries), so --binpkg-respect-use=y (inherited) rebuilds exactly
# those and reuses the rest.
#
# The gcc-15 CUDA packages do NOT break the shared pool: they exist only in
# this image (amdkdehard has none of them — it ships llama-cpp-cpu, not the
# CUDA stack), so no atom is ever present in the pool under two different
# compilers. buildpkg writes them back beside amdkdehard's gcc-16 desktop
# entries; binpkg-multi-instance keeps every variant distinct.
# Still NO getbinpkg — the remote binhost is non-hardened, same as the parent.
PROF_LIVE_BINPKGS_DIR="/var/cache/binpkgs-amdkdehard"
# --usepkg used to be appended here, for this profile only. It moved into the
# parent's PROF_LIVE_EMERGE_OPTS on 2026-08-25: the pool is shared, so the
# asymmetry only meant amdkdehard rebuilt from source what nvidiahard had
# already built and written back.

# ---------------------------------------------------------------------------
# APPENDED to the parent's PROF_LIVE_PKGS — the two groups amdkdehard
# deliberately does not carry, transcribed from amdkde.conf. Listed explicitly
# rather than left to VIDEO_CARDS/unsloth to pull, for the same reason amdkde
# gives: an edit to the video card list or one USE change in one ebuild must
# not silently empty the stack this profile exists to test.
#
# Inherited and load-bearing here (both come from amdkde through amdkdehard,
# where they are inert):
#   PROF_LIVE_KMOD_PKGS=(x11-drivers/nvidia-drivers) — excluded from both
#     'pkgs' emerges, merged by the post-kernel pass once Module.symvers
#     exists (the run-6 lesson).
#   PROF_LIVE_CYCLE_BOOTSTRAP=("sci-ml/caffe2 -gloo") — opens the
#     gloo[cuda] <-> caffe2[cuda,gloo] cycle; skipped once caffe2 is in.
# ---------------------------------------------------------------------------
PROF_LIVE_PKGS+=(
    # --- remote reachability -------------------------------------------------
    # Tailnet access to this host's LAN services (the ntfy server on :8090
    # first of all) from outside the home network — no port forwarding, works
    # behind CGNAT. Ships logged-out: 'tailscale up' is an interactive,
    # per-install authentication and stays host state, like ntfy's config.
    net-vpn/tailscale

    # --- NVIDIA proprietary stack + CUDA -------------------------------------
    x11-drivers/nvidia-drivers
    dev-util/nvidia-cuda-toolkit
    app-containers/nvidia-container-toolkit
    virtual/opencl

    # --- ML / training stack -------------------------------------------------
    # sci-ml/unsloth (::pwr, appended to PROF_LIVE_OVERLAY_PKGS below) reaches
    # almost all of this on its own; named anyway, see the header.
    sci-ml/pytorch
    sci-ml/caffe2
    sci-ml/accelerate
    sci-ml/datasets
    sci-ml/transformers
    sci-ml/huggingface_hub
    sci-ml/gloo
    dev-python/scikit-learn
    dev-python/pyarrow
    dev-python/multiprocess

    # --- CPU power telemetry (SMU PM table) ----------------------------------
    # Userland reader for app-admin/ryzen_smu, which rides PROF_LIVE_KMOD_PKGS
    # below. Goes far beyond the RAPL counter the kernel fragment enables:
    # per-core watts, SoC power, and the live PPT/TDC/EDC limits straight from
    # the SMU. Hard-RDEPENDs on ryzen_smu, so it enters the graph exactly like
    # virtualbox does — see the exclusion note below before touching either.
    #
    # THIS PROFILE ONLY, on purpose. The parent amdkdehard is the T14 (Krackan,
    # fam 1Ah) and Zen 5 mobile has no working PM table: upstream ryzen_smu is
    # unmaintained, the Strix Halo issue reports the module loading but never
    # creating /sys/kernel/ryzen_smu_drv, and RyzenAdj hits the same wall on
    # Strix/Krackan. Putting it in the parent would also drag an AMD-only
    # module into intelhard and corehard, which source amdkdehard. Here it is
    # a 5950X (Vermeer, fam 19h) — the case ryzen_smu was actually written for.
    app-admin/ryzen_monitor

    # --- gaming: Steam native + Proton, and everything beside it -------------
    # steam-launcher itself is ::pwr, so it rides PROF_LIVE_OVERLAY_PKGS
    # below. Proton needs no package — Steam ships and updates it. Its other
    # host requirement, sys-libs/libudev-compat, is plain ::gentoo and comes
    # in as a dependency.
    games-util/gamemode
    games-util/lutris
    app-emulation/wine-staging
    # app-eselect/eselect-wine already rides the parent's list
    #
    # --- the steamctl helper stack (2026-09-04, skill steam-linux-gaming) ---
    # bin/steamctl ships via live/tools; these are what its verbs call.
    # ::gentoo half here, the ::pwr half in PROF_LIVE_OVERLAY_PKGS below.
    # protontricks + winetricks: 'steamctl tricks' (winetricks verbs in a
    # game's Proton prefix). vkBasalt: the 'vkbasalt' launch-option preset
    # (Vulkan post-processing layer). dev-python/vdf: every launch-option /
    # Proton-pin edit goes through it (localconfig.vdf, config.vdf). jq is
    # inherited from amdkdehard.
    app-emulation/protontricks
    app-emulation/winetricks
    media-gfx/vkBasalt
    dev-python/vdf
    # heroic-bin (::gentoo, ~amd64): GOG/Epic/Amazon client — installs and
    # runs store games outside Steam through the same GE-Proton builds
    # steamctl installs into compatibilitytools.d (Witcher 3 GOTY, 2026-09-04).
    # Pulls media-fonts/freefont. Login state stays host state, like tailscale.
    games-util/heroic-bin
    # steamctl mod (2026-09-05): Nexus archives come as zip/7z/rar (7zip is
    # inherited from amdkdehard), the nxm:// handler registers through
    # xdg-mime and reports through notify-send, mod_extract falls back to
    # bsdtar. All four are on the host as dependencies of something else —
    # named so a dependency shuffle cannot drop them from the image.
    app-arch/unrar
    app-arch/unzip
    app-arch/libarchive
    x11-misc/xdg-utils
    x11-libs/libnotify

    # --- virtualisation beyond the parent's qemu -----------------------------
    # This profile only (amdkdehard stays qemu-only, amdkde carries the full
    # trio). BOTH halves ride the inherited PROF_LIVE_KMOD_PKGS exclusion —
    # the modules because linux-mod-r1 needs the built kernel, the userland
    # because its hard ~virtualbox-modules-${PV} RDEPEND makes a graph with
    # only the modules excluded UNRESOLVABLE (pass 2 aborted on a misleading
    # 7.0.26 REQUIRED_USE error, 2026-08-08). The entry here keeps virtualbox
    # in the package list, which is exactly what the post-kernel 'module-pkgs'
    # replay re-emerges once Module.symvers exists.
    app-emulation/virtualbox
    # vagrant (::gentoo, ~amd64 — keyworded in common host.keywords): the
    # consumer of the Vagrantfiles `vboxctl vagrant` writes and of the boxes
    # `vboxctl packer --box` builds. Pure ruby33 package, no virtualbox
    # RDEPEND, so it is NOT part of the KMOD exclusion above (2026-09-05).
    app-emulation/vagrant

    # --- the lab's own build tooling -----------------------------------------
    # This image re-installs the machine that BUILDS the images, so it has to
    # be able to rebuild itself: catalyst drives every stage1/2/3 and the
    # arm64 board tracks ('xp <profile> build', xstage's catalyst half), and
    # a freshly installed nvhard without it stops at "❌ No catalyst"
    # (2026-08-11). amdkde lists it for the same reason; amdkdehard's
    # rewritten PROF_LIVE_PKGS drops it, hence the restatement. Needs the
    # GRUB_PLATFORMS efi-32 line above — that is catalyst[iso]'s dependency,
    # not a bootloader change.
    dev-util/catalyst

    # adb/fastboot: the xandroid Pixel work and shaderview -p push shaders to
    # phones over USB debugging. amdkde lists it; amdkdehard's rewrite drops
    # it like catalyst above. ~amd64 via the common overlay's host.keywords.
    dev-util/android-tools
)

# app-admin/ryzen_smu is linux-mod-r1, so it hits the same wall as
# nvidia-drivers and virtualbox-modules: pkg_setup wants Module.symvers, which
# does not exist until 'livekernel'. Excluding it from both 'pkgs' emerges and
# letting the post-kernel replay merge it is the established fix — and the
# exclusion is what keeps app-admin/ryzen_monitor's hard RDEPEND from dragging
# the module into the payload pass and aborting it.
#
# Version note: the stable 0.1.5 builds against this image's 7.1 kernel. The
# 7.2 cpuid-header fix only exists in 0.1.5-r1, which is ~amd64 — when the
# image kernel reaches 7.2 this needs an image.keywords entry, or the build
# breaks with a missing <asm/cpuid/api.h>.
PROF_LIVE_KMOD_PKGS+=(
    app-admin/ryzen_smu
    # ...and the userland half MUST be here too, exactly like virtualbox and
    # polychromatic above. Excluding only the module leaves ryzen_monitor in
    # the payload with a hard RDEPEND on an excluded package, and the graph
    # becomes unresolvable — verified the hard way on nvidiahard 2026-08-26:
    #
    #   !!! All ebuilds that could satisfy "app-admin/ryzen_smu" have been
    #       masked.  - 0.1.5 (masked by: exclude option)
    #                 - 0.1.5-r1 (masked by: ~amd64 keyword)
    #   (dependency required by "app-admin/ryzen_monitor" [ebuild])
    #
    # Note the second line of that error is a red herring: -r1 only surfaced
    # because the exclusion had removed the stable 0.1.5 from consideration.
    # No keyword entry is needed while the image kernel is 7.1 — see the
    # version note above.
    app-admin/ryzen_monitor
)

# The ::pwr half of the experiment. unsloth pulls unsloth-zoo, vllm,
# bitsandbytes, peft and triton-bin — the whole training stack; the nine
# runtime patches it needs on Gentoo live in ::pwr (unsloth-grpo-patching
# skill). Extend with liger-kernel / llama-cpp / lemonade once the base stack
# proves out.
PROF_LIVE_OVERLAY_PKGS+=(
    # LAN push-notification server (written for ::pwr 2026-08-30) — the host
    # this image installs runs it on :8090 for phone alerts (bitaxectl
    # notify_push publishes OK<->FAIL transitions). Prebuilt static Go
    # binary + acct-user/ntfy; unit ships disabled — the host's enablement
    # symlink and the live /etc/ntfy/server.yml ride the secure-host
    # backup tiers, not the package.
    net-misc/ntfy-bin
    sci-ml/unsloth
    # imported from ::steam-overlay (pwr commit 354f130); the bootstrap that
    # installs and updates the real client under ~/.local/share/Steam
    games-util/steam-launcher
    # --- steamctl helper stack, ::pwr half (2026-09-04) --------------------
    # mangohud 0.8.4: the overlay + frame-time logging 'steamctl bench' reads
    # (::gentoo has no mangohud; imgui/implot bundled via packagecache).
    # umu-launcher 1.4.4: 'steamctl umu' — non-Steam exes under GE-Proton.
    # protonup-rs 0.15.0: the maintained GE-Proton fetcher, alternative to
    # 'steamctl proton install'. gamescope 3.16.28: the 'gamescope' preset
    # (wlroots:0.20, libdisplay-info bundled — upstream pins <0.4). Keywords:
    # the "Steam helper stack" block in common/…/host.keywords.
    games-util/mangohud
    games-util/umu-launcher
    games-util/protonup-rs
    gui-wm/gamescope
    # The CUDA-capable llama-cpp, which the parent swapped out for the CPU
    # package (this is a GPU image). Both end up installed — the inherited
    # llama-cpp-cpu gives a zero-VRAM CPU fallback binary beside it, matching
    # amdkde. Built with gcc-15 via cuda_gccdir (self-handled) + the shared
    # gcc15.conf host override.
    sci-misc/llama-cpp

    # The terminal agent — the SOURCE package, and specifically the -9999 the
    # hardened layer's qwen-code.keywords makes visible: that ebuild builds
    # ::pwr's fork branch fix/peg-native-stream-retry, and the retry it adds
    # (InvalidStreamError CHAT_FORMAT_PARSE, 10 attempts) is what keeps a turn
    # alive when llama-server's chat parser rejects sampled output with "does
    # not match the expected peg-native format". Neither the 0.19.9 release
    # (what a bare atom resolves to, and what amdkde takes) nor the
    # app-misc/qwen-code-bin package carries it — verified on the host
    # 2026-08-19, where the -bin build had no CHAT_FORMAT_PARSE in
    # /opt/qwen-code and the local-LLM harness had silently lost the fix.
    # This image serves models locally, so it takes the fork.
    #
    # Cost: 'pkgs' runs 'npm ci' for ~1900 packages (RESTRICT=network-sandbox,
    # so the build needs the network) and clones a branch HEAD. The branch is
    # one commit on a frozen base, so "live" here barely moves — but pin
    # EGIT_COMMIT in ::pwr if the image ever has to be reproducible.
    app-misc/qwen-code

    # Hardware wallet: the Electron desktop app, the trezorctl CLI (dev-python/
    # trezor ships both the library and the command), and the udev rules both
    # of them need to see the device at all. The rules grant the plugdev group
    # — which is exactly why PROF_LIVE_EXTRA_USERS puts 'pw' in it below.
    #
    # T-RSL forbids redistribution and the ebuild carries RESTRICT="bindist
    # mirror" — worth stating, and worth NOT overstating: 18 of this profile's
    # 427 listed atoms already do (google-chrome, discord, slack, opera,
    # vscode, rar, codeql-bin, nvidia-cuda-toolkit, linux-firmware …). This
    # squashfs has never been a redistributable artifact; it is the operator's
    # own install medium, and trezor-suite-bin changes nothing about that.
    # Dropping it would buy a licence property the image does not have.
    app-crypt/trezor-suite-bin
    app-crypt/trezor-udev-rules
    dev-python/trezor

    # kde-misc/plasma-wallpaper-shader moved to amdkdehard.conf on
    # 2026-08-20 (all hard flavours get it, corehard filters it out), so
    # it arrives here by inheritance - do not list it twice.
)

# ---------------------------------------------------------------------------
# Multilib-transition cycle cuts (2026-08-08, first nvidiahard 'pkgs' run).
#
# ABI_X86="64 32" over a 64-bit-only stage3 forces source rebuilds of core
# libraries, and those rebuilds land in the same graph as the app-arch/
# xz-utils-9999 upgrade (host.keywords '**'), whose live ebuild needs git at
# BUILDTIME while git's own chain needs xz — every resolver cycle the run hit
# was that one loop seen from a different package:
#   gpm <-> ncurses[gpm]
#   doxygen[dot] -> graphviz -> librsvg -> libxml2[python] -> doxygen
#   elfutils[lzma] -> xz-9999 -> git -> glib -> virtual/libelf -> elfutils
#   git -> glib -> docutils -> pillow -> tiff[lzma] -> xz-9999 -> git
#
# 'early:' because the cycles already bite in the kconfig kernel-sources
# emerge and the pass-1 @world update, before the default bootstrap slot.
# '@unless-use=abi_x86_32' because three of the four ship IN the stage3 — a
# plain entry would be skipped as "already installed" and never fire; the
# guard instead closes after the bootstrap merge itself builds the 32-bit
# variant. Once every entry's package sits in the shared binpkg cache with
# abi_x86_32, the whole set degrades to four skip lines.
#
# += keeps the parent's caffe2 entry (late slot, final compiler).
# ---------------------------------------------------------------------------
PROF_LIVE_CYCLE_BOOTSTRAP+=(
    "early:sys-libs/ncurses -gpm @unless-use=abi_x86_32"
    "early:dev-libs/libxml2 -python @unless-use=abi_x86_32"
    "early:dev-libs/elfutils -lzma @unless-use=abi_x86_32"
    "early:media-libs/tiff -lzma @unless-use=abi_x86_32"
    # The nvidia-drivers USERLAND, without the kernel module (USE=-modules
    # skips linux-mod-r1 entirely — the same trick container images use).
    # Excluding the driver from 'pkgs' turned out to punish every package
    # that hard-RDEPENDs the driver LIBRARIES: first virtualbox, then
    # libnvidia-container, then sys-apps/hwloc[video_cards_nvidia] — with
    # the driver excluded the resolver version-walks into the p.masked
    # 390.157 and aborts (pass-2 failures, 2026-08-08). With the userland
    # installed up front the whole class resolves; the post-kernel
    # 'module-pkgs' replay runs with --newuse and no exclusions, so it
    # rebuilds the driver WITH modules once the kernel tree exists. Plain
    # skip-once-installed semantics: later 'pkgs' re-runs never touch it,
    # whichever USE state it is in by then.
    "early:x11-drivers/nvidia-drivers -modules"
)

# ---------------------------------------------------------------------------
# No fetch-restricted payload — yet. The parent's list (sqldeveloper, the
# Cisco client and its retro stack) is NOT wanted here, and nothing in the
# NVIDIA/ML delta is RESTRICT=fetch. The variable is emptied rather than
# deleted so 'xp nvidiahard restrict-run' stays a defined, cheap no-op — the
# day something needs a hand-downloaded archive, drop it in
# dl/distfiles-restricted and list it here, deps first.
# ---------------------------------------------------------------------------
PROF_LIVE_RESTRICT_PKGS=()

# Appended to the parent's audited list: the NVIDIA set (swept from
# metadata/md5-cache in amdkde's audit) plus Apple-Sample-Code, which
# sci-ml/cut-cross-entropy carries into the unsloth step, plus
# ValveSteamLicense for steam-launcher (the licence file itself was imported
# into ::pwr alongside the ebuild — ::gentoo carries no Valve token).
# JetBrains, MPEG-4 and Intel-ISSL are amdkde-only (pycharm, faac,
# plink2-bin — none listed here). The first 'pkgs' run is still the real
# audit; expect it to name anything this delta reaches that the parent's
# closure did not.
#
# T-RSL = the Trezor Reference Source License (licence file imported into ::pwr
# beside the ebuild; ::gentoo carries no such token), for app-crypt/
# trezor-suite-bin above. Global here, matching how every other token on this
# list is handled — the host pins it per package in /etc/portage/package.license
# instead, which the image has no equivalent of in the overlay layers.
PROF_LIVE_ACCEPT_LICENSE="${PROF_LIVE_ACCEPT_LICENSE}
                          NVIDIA-CUDA NVIDIA-cuDNN NVIDIA-2025
                          NVIDIA-SDK-v2020.10.12 NVIDIA-cuSPARSELt-v2020.10.12
                          Apple-Sample-Code ValveSteamLicense T-RSL"

# Host account for the pam_mount-encrypted home (volume stanza + fstab noauto
# entry ship in the secure-host live-overlay layer). uid/gid pinned to what
# the files inside the encpw LUKS volume already use (1007/users); -M because
# the real home lives in that volume — configure only creates the /home/pw
# mountpoint (700, owned by the account). wheel = su/sudo, plugdev = uaccess
# device rules (Trezor/U2F). Ships LOCKED: set the password post-install with
# 'passwd pw' — it must equal the LUKS passphrase or pam_mount cannot open
# the volume at login.
PROF_LIVE_EXTRA_USERS=( "-M -u 1007 -g users -G wheel,plugdev -s /bin/bash -d /home/pw pw" )
