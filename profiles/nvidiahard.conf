# xp profile: amdkdehard + the NVIDIA proprietary stack + CUDA + unsloth.
#
# The experiment this profile exists for: does the compute stack — nvidia-
# drivers, nvidia-cuda-toolkit, and sci-ml/unsloth with everything it pulls —
# build and run on the HARDENED toolchain? amdkdehard deliberately refuses the
# blob ("an out-of-tree binary kernel module with no source is the one thing a
# hardened image has no way to vouch for"); this profile knowingly overrides
# that call to find out what the combination is worth.
#
# A thin derivative, the same way amdkdehard derives from amdkde: source the
# parent, override only the deltas. The entire hardened package list, USE
# array, emerge options, no-getbinpkg policy and licence audit carry over —
# edits to amdkdehard.conf land here automatically.
#
# Risk assessment, for the record:
#  * userspace: low. The 23.0 profiles already default to PIE/SSP everywhere;
#    hardened adds FORTIFY=3, full RELRO and stack-clash-protection, which
#    prebuilt binaries (nvcc, triton-bin, the driver libs) never see and
#    compiled CUDA code tolerates (shared objects are -fPIC anyway).
#  * gcc: nvcc 13.3 caps its host compiler at gcc-15 — the 'nvidia' overlay
#    layer below carries package.mask/cuda-gcc-cap.mask for exactly this.
#  * kernel: VERIFIED compatible (2026-08-07, amdkdehard's built .config —
#    same fragments this profile inherits): MODULE_SIG=y but not FORCE, and
#    lockdown compiled with FORCE_NONE — the unsigned out-of-tree module
#    loads. The hardened.fragment's "deliberately NOT set" section records
#    both choices with rationale.
#
# Gaming rides this profile too (Steam native + Proton, lutris, wine).
# Hardening blocks none of it — verified against the same built artifacts:
# CONFIG_IA32_EMULATION=y (32-bit client and games), USER_NS_UNPRIVILEGED=y
# (pressure-vessel containers), COMPAT_32BIT_TIME=y; the hardened sysctl
# layer sets only ptrace_scope=1 (Steam-compatible) and unprivileged_bpf
# (irrelevant). Steam, Proton and game binaries are prebuilt, so the
# hardened toolchain never touches them. What gaming actually needed was
# 32-bit ABI (below) and games-util/steam-launcher imported into ::pwr
# (commit 354f130 — ::steam-overlay stays outside the image's repo policy).
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/amdkdehard.conf"

PROF_NAME=nvidiahard
PROF_LIVE_HOSTNAME=nvhard
PROF_LIVE_VOLID=NVIDIAHARD
PROF_BUILD_SUBDIR=nvidiahard

# APPENDED, not rewritten: in a make.conf USE string the LAST occurrence of a
# flag wins, so these two cleanly flip the parent's '-nvidia -cuda' without
# editing the inherited array. Everything else in the hardened USE list stays.
PROF_LIVE_USE="${PROF_LIVE_USE} nvidia cuda"

# amdkde's line, not the parent's: 'nvidia' back in (it is what actually pulls
# x11-drivers/nvidia-drivers, via xorg-drivers), nouveau kept beside it so the
# open driver remains available at boot ('nomodeset'-class fallbacks aside,
# blacklisting decides at runtime, not the package list).
PROF_LIVE_VIDEO_CARDS="amdgpu radeonsi radeon nvidia nouveau intel i915 i965 iris"

# Appended to the parent's array (LUA_SINGLE_TARGET stays). Which GPU the CUDA
# half is compiled for — plain variables read by the build systems, so only a
# make.conf line will do. sm_120 = RTX 5070 Ti, same as amdkde; without
# CUDAARCHS, cutlass-4.4.x dies in a Python traceback inside cmake
# ("invalid literal for int()"), and without TORCH_CUDA_ARCH_LIST caffe2
# either probes for a GPU the chroot does not have or builds every arch CUDA
# knows. LLVM_SLOT is deliberately NOT copied from amdkde: the parent builds
# without a pin and the unsloth stack adds no new LLVM consumer (triton ships
# its own).
PROF_LIVE_MAKECONF_EXTRA+=(
    'CUDAARCHS="120"'
    'TORCH_CUDA_ARCH_LIST="12.0"'
    # Host parity, and what makes Steam/Proton possible: every multilib
    # library builds both ABIs, including nvidia-drivers' 32-bit GL. A
    # USE_EXPAND variable, so it must be a make.conf line, not a USE token
    # (same rule as LLVM_SLOT above). Cost, measured on the host running
    # this exact setting: 408 of 2744 packages carry abi_x86_32 — the
    # compile-heavy majority (Qt/KDE, browsers, office) is not multilib and
    # keeps matching the shared amdkdehard binpkgs; the one expensive
    # dual-ABI rebuild is llvm, unavoidable anyway (mesa[abi_x86_32]
    # USE-depends on llvm[abi_x86_32]).
    'ABI_X86="64 32"'
)

# Parent's layers, no gcc cap: this image builds its desktop with the tree's
# gcc-16 and forces gcc-15 ONLY on the CUDA packages, through
# package.env/gcc15.conf in 'common' (the maintained gcc-15 set). That is why
# 'nvidia' — a mask-only layer that pinned the WHOLE toolchain to gcc-15 — is
# gone: it now lives as the amdkde-only 'amdkde' layer, so amdkde stays
# gcc-15 (host-pool coherence) while this image does not. NO personal install
# payload: the T14 kit rides amdkdehard (that laptop has no NVIDIA GPU) and
# the host kit rides amdkde. Add one back if this image ever gets an install
# target of its own.
#
# The ML package.env rides in 'common' and needs nothing extra here:
#   sci-ml/caffe2      lowmem-j4 (the -j32 cicc OOM lesson, 2026-08-07)
#                      + ndebug + ccache-cuda + torch-git-pin + gcc15
#   sci-ml/pytorch     torch-git-pin + gcc15 (one EGIT_COMMIT for both halves)
#   dev-python/vllm    ccache-cuda + gcc15
# Host entries minus their 'native' — this image is znver3 on purpose.
PROF_LIVE_OVERLAY_DIR="common hardened tools"

# Own build tree, same reasoning as the parent (portage does not lock across
# chroots; the subdirectory keeps this profile, amdkde, amdkdehard and host
# emerges out of each other's <category>/<pf> dirs). Under /var/tmp/portage
# on purpose — that path is the bind mount to the big disk.
PROF_LIVE_BUILDDIR="/var/tmp/portage/nvidiahard"

# SHARED with amdkdehard, deliberately, and coherent because the DESKTOP half
# of both images is now the same class of object: same hardened profile, same
# CFLAGS, and — since neither takes the gcc cap — the same gcc-16 compiler.
# --usepkg (appended below) turns that into the build-time win: the entire
# hardened desktop amdkdehard already compiled is reused here, and only the
# NVIDIA/ML/gaming delta builds from source. That delta is either absent from
# amdkdehard (caffe2, unsloth, steam…) or differs in USE (the ABI_X86="64 32"
# multilib libraries), so --binpkg-respect-use=y (inherited) rebuilds exactly
# those and reuses the rest.
#
# The gcc-15 CUDA packages do NOT break the shared pool: they exist only in
# this image (amdkdehard has none of them — it ships llama-cpp-cpu, not the
# CUDA stack), so no atom is ever present in the pool under two different
# compilers. buildpkg writes them back beside amdkdehard's gcc-16 desktop
# entries; binpkg-multi-instance keeps every variant distinct.
# Still NO getbinpkg — the remote binhost is non-hardened, same as the parent.
PROF_LIVE_BINPKGS_DIR="/var/cache/binpkgs-amdkdehard"
PROF_LIVE_EMERGE_OPTS="${PROF_LIVE_EMERGE_OPTS} --usepkg"

# ---------------------------------------------------------------------------
# APPENDED to the parent's PROF_LIVE_PKGS — the two groups amdkdehard
# deliberately does not carry, transcribed from amdkde.conf. Listed explicitly
# rather than left to VIDEO_CARDS/unsloth to pull, for the same reason amdkde
# gives: an edit to the video card list or one USE change in one ebuild must
# not silently empty the stack this profile exists to test.
#
# Inherited and load-bearing here (both come from amdkde through amdkdehard,
# where they are inert):
#   PROF_LIVE_KMOD_PKGS=(x11-drivers/nvidia-drivers) — excluded from both
#     'pkgs' emerges, merged by the post-kernel pass once Module.symvers
#     exists (the run-6 lesson).
#   PROF_LIVE_CYCLE_BOOTSTRAP=("sci-ml/caffe2 -gloo") — opens the
#     gloo[cuda] <-> caffe2[cuda,gloo] cycle; skipped once caffe2 is in.
# ---------------------------------------------------------------------------
PROF_LIVE_PKGS+=(
    # --- NVIDIA proprietary stack + CUDA -------------------------------------
    x11-drivers/nvidia-drivers
    dev-util/nvidia-cuda-toolkit
    app-containers/nvidia-container-toolkit
    virtual/opencl

    # --- ML / training stack -------------------------------------------------
    # sci-ml/unsloth (::pwr, appended to PROF_LIVE_OVERLAY_PKGS below) reaches
    # almost all of this on its own; named anyway, see the header.
    sci-ml/pytorch
    sci-ml/caffe2
    sci-ml/accelerate
    sci-ml/datasets
    sci-ml/transformers
    sci-ml/huggingface_hub
    sci-ml/gloo
    dev-python/scikit-learn
    dev-python/pyarrow
    dev-python/multiprocess

    # --- gaming: Steam native + Proton, and everything beside it -------------
    # steam-launcher itself is ::pwr, so it rides PROF_LIVE_OVERLAY_PKGS
    # below. Proton needs no package — Steam ships and updates it. Its other
    # host requirement, sys-libs/libudev-compat, is plain ::gentoo and comes
    # in as a dependency.
    games-util/gamemode
    games-util/lutris
    app-emulation/wine-staging
    # app-eselect/eselect-wine already rides the parent's list

    # --- virtualisation beyond the parent's qemu -----------------------------
    # This profile only (amdkdehard stays qemu-only, amdkde carries the full
    # trio). Pulls app-emulation/virtualbox-modules — out-of-tree kernel
    # modules; already in the INHERITED PROF_LIVE_KMOD_PKGS (amdkde lists it
    # beside nvidia-drivers), so it is excluded from 'pkgs' and merged by the
    # post-kernel 'module-pkgs' pass once Module.symvers exists.
    app-emulation/virtualbox
)

# The ::pwr half of the experiment. unsloth pulls unsloth-zoo, vllm,
# bitsandbytes, peft and triton-bin — the whole training stack; the nine
# runtime patches it needs on Gentoo live in ::pwr (unsloth-grpo-patching
# skill). Extend with liger-kernel / llama-cpp / lemonade once the base stack
# proves out.
PROF_LIVE_OVERLAY_PKGS+=(
    sci-ml/unsloth
    # imported from ::steam-overlay (pwr commit 354f130); the bootstrap that
    # installs and updates the real client under ~/.local/share/Steam
    games-util/steam-launcher
    # The CUDA-capable llama-cpp, which the parent swapped out for the CPU
    # package (this is a GPU image). Both end up installed — the inherited
    # llama-cpp-cpu gives a zero-VRAM CPU fallback binary beside it, matching
    # amdkde. Built with gcc-15 via cuda_gccdir (self-handled) + the shared
    # gcc15.conf host override.
    sci-misc/llama-cpp
)

# ---------------------------------------------------------------------------
# No fetch-restricted payload — yet. The parent's list (sqldeveloper, the
# Cisco client and its retro stack) is NOT wanted here, and nothing in the
# NVIDIA/ML delta is RESTRICT=fetch. The variable is emptied rather than
# deleted so 'xp nvidiahard restrict-run' stays a defined, cheap no-op — the
# day something needs a hand-downloaded archive, drop it in
# dl/distfiles-restricted and list it here, deps first.
# ---------------------------------------------------------------------------
PROF_LIVE_RESTRICT_PKGS=()

# Appended to the parent's audited list: the NVIDIA set (swept from
# metadata/md5-cache in amdkde's audit) plus Apple-Sample-Code, which
# sci-ml/cut-cross-entropy carries into the unsloth step, plus
# ValveSteamLicense for steam-launcher (the licence file itself was imported
# into ::pwr alongside the ebuild — ::gentoo carries no Valve token).
# JetBrains, MPEG-4 and Intel-ISSL are amdkde-only (pycharm, faac,
# plink2-bin — none listed here). The first 'pkgs' run is still the real
# audit; expect it to name anything this delta reaches that the parent's
# closure did not.
PROF_LIVE_ACCEPT_LICENSE="${PROF_LIVE_ACCEPT_LICENSE}
                          NVIDIA-CUDA NVIDIA-cuDNN NVIDIA-2025
                          NVIDIA-SDK-v2020.10.12 NVIDIA-cuSPARSELt-v2020.10.12
                          Apple-Sample-Code ValveSteamLicense"
