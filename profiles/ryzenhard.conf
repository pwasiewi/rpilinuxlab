# xp profile: amdkdehard + gaming (Steam, Modrinth, Prism Launcher) — the
# AMD-only gaming image. No NVIDIA anywhere (that is nvidiahard's job): the
# graphics path is amdgpu + mesa (radeonsi / RADV), 64- and 32-bit.
#
# Target today: Ryzen AI laptops with integrated Radeon graphics (T14, ASUS
# Vivobook 18 M1807GA). Target later: desktops with a discrete Radeon (RDNA 4,
# e.g. RX 9070 XT) — nothing here is iGPU-specific: the inherited kernel
# (amdgpu, 7.x), linux-firmware and VIDEO_CARDS="amdgpu radeonsi" already cover
# a dGPU, and usb4.fragment covers a Radeon in a USB4/Thunderbolt enclosure on
# machines that have the port. A desktop target would only add its own CFLAGS
# review (znver3 floor) and, if wanted, ROCm — not part of this profile.
#
# A thin derivative, the same way nvidiahard/intelhard derive from amdkdehard:
# source the parent, override only the deltas. The hardened package list, USE
# array, kernel fragments (IA32_EMULATION, unprivileged user namespaces and
# COMPAT_32BIT_TIME are already on — nvidiahard verified Steam/Proton against
# the same built kernel), emerge options and licence audit carry over. What
# gaming adds is exactly what nvidiahard needed on top of the same parent,
# minus everything NVIDIA/CUDA/ML: the 32-bit ABI, steam-launcher from ::pwr,
# and the Valve licence token.
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/amdkdehard.conf"

PROF_NAME=ryzenhard
PROF_LIVE_HOSTNAME=ryzhard
PROF_LIVE_VOLID=RYZENHARD
PROF_BUILD_SUBDIR=ryzenhard

# Own build tree (portage does not lock across chroots), under the
# /var/tmp/portage bind mount like every sibling.
PROF_LIVE_BUILDDIR="/var/tmp/portage/ryzenhard"

# The binpkg pool and ccache stay SHARED with amdkdehard (inherited, not
# restated): same hardened profile, same znver3 CFLAGS, same gcc-16. The only
# USE difference is the multilib half below, and --binpkg-respect-use=y
# (inherited) rebuilds exactly those packages and reuses the rest — the same
# arrangement nvidiahard has used since 2026-08-08.

# Steam's client and most games are 32-bit, so every multilib library builds
# both ABIs (mesa's 32-bit radeonsi/RADV above all). A USE_EXPAND variable,
# hence a make.conf line, not a USE token. Cost measured on the host with the
# same setting: 408 of 2744 packages carry abi_x86_32; the one heavy dual-ABI
# rebuild is llvm (mesa[abi_x86_32] USE-depends on llvm[abi_x86_32]).
PROF_LIVE_MAKECONF_EXTRA+=(
    'ABI_X86="64 32"'
)

# The multilib transition's resolver cycles — the same four nvidiahard met on
# its first run (see the rationale block there, 2026-08-08); ryzenhard hit the
# first one, gpm <-> ncurses[gpm], in pass 1 (update-seed) on 2026-09-27. The
# rootfs is a copy of the 64-bit-only amdkdehard tree, so the shared binpkg
# pool offers ncurses[abi_x86_32] as a binary while gpm[abi_x86_32] still has
# to build — and gpm's build needs ncurses. 'early:' so they fire before pass
# 1; '@unless-use=abi_x86_32' so an already-installed 64-bit-only package
# still gets its bootstrap re-merge. The parent's array is empty, so += is
# exactly this list.
#
# NOT nvidiahard's libxml2 entry: that cut assumes a stage3. This rootfs
# already has dev-libs/libxslt[python], which requires libxml2[python], so
# re-merging libxml2 with -python is a slot conflict, not a cycle cut
# (cycle-libxml2 failed, 2026-09-27). Here libxml2 simply rebuilds with
# abi_x86_32 inside pass 1.
PROF_LIVE_CYCLE_BOOTSTRAP+=(
    "early:sys-libs/ncurses -gpm @unless-use=abi_x86_32"
    "early:dev-libs/elfutils -lzma @unless-use=abi_x86_32"
    "early:media-libs/tiff -lzma @unless-use=abi_x86_32"
)

# gamemode: CPU governor/priority switch on game start (Steam launch option
# 'gamemoderun %command%'), cheap and useful on a laptop. Proton needs no
# package — Steam ships and updates it. sys-libs/libudev-compat comes in as a
# steam-launcher dependency.
PROF_LIVE_PKGS+=(
    games-util/gamemode
)

# All three are ::pwr. Keywords: steam-launcher in common host.keywords,
# modrinth-app-bin and prismlauncher in common image.keywords.
#   steam-launcher   imported from ::steam-overlay (pwr commit 354f130); the
#                    bootstrap that installs and updates the real client
#                    under ~/.local/share/Steam
#   modrinth-app-bin prebuilt Tauri Minecraft launcher, manages its own JREs
#   prismlauncher    11.1.0 from source; build needs virtual/jdk <26, which
#                    the inherited JDK set satisfies (the ebuild's openjdk21
#                    patch covers >=20)
PROF_LIVE_OVERLAY_PKGS+=(
    games-util/steam-launcher
    games-util/modrinth-app-bin
    games-action/prismlauncher
)

# ::gentoo carries no Valve token; the licence file was imported into ::pwr
# beside the ebuild. Appended to the parent's audited list, as nvidiahard does.
PROF_LIVE_ACCEPT_LICENSE="${PROF_LIVE_ACCEPT_LICENSE} ValveSteamLicense"
