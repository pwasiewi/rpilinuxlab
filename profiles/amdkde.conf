# ---------------------------------------------------------------------------
# PROF_LIVE_CYCLE_BOOTSTRAP — one merge, with a flag off, to open a cycle.
#
# sci-ml/gloo[cuda] BDEPENDs sci-ml/caffe2[cuda]; sci-ml/caffe2[cuda,gloo]
# RDEPENDs sci-ml/gloo[cuda?]. Each wants the other built first, and neither
# flag can simply stay off: dev-python/vllm requires caffe2[distributed,gloo]
# and pytorch refuses a system gloo without GLOO_USE_CUDA. The full reasoning,
# including the two dead ends (gloo -cuda, and nccl instead of gloo), is in
# genstage/live/common/etc/portage/package.use/zz-image.use.
#
# This host never hit it because gloo has been installed here since 2023, long
# before caffe2 — the cycle only exists when both are new, which is every
# image build.
#
# Cost: caffe2 is built twice. It is the most expensive package in the image,
# so this is the single biggest item in a from-scratch run; ccache takes some
# of it back on the second pass. Skipped entirely once caffe2 is installed, so
# only a first build pays.
# ---------------------------------------------------------------------------
PROF_LIVE_CYCLE_BOOTSTRAP=(
    "sci-ml/caffe2 -gloo"
)

# ---------------------------------------------------------------------------
# PROF_LIVE_KMOD_PKGS — out-of-tree kernel modules, skipped during 'pkgs'.
#
# linux-mod-r1 refuses to build against a kernel tree that has only been
# configured: pkg_setup checks /usr/src/linux/Module.symvers and dies with
# "built kernel sources are required to build kernel modules". In this
# pipeline the tree is compiled by genkernel in 'kernel', which is AFTER
# 'pkgs' — so these can only ever fail there, and 'kernel' already ends with a
# post-kernel pass that merges them once Module.symvers exists.
#
# Listing them here excludes them from BOTH emerges 'pkgs' runs — the
# @world/@installed seed update as well as the payload pass. Without that, the
# guaranteed failure makes the step exit 1 even under --keep-going, and the
# abort skips PROF_LIVE_OVERLAY_PKGS entirely. Run 6 (2026-08-07) proved the
# seed pass matters on its own: excluded only from the payload pass, it merged
# 148 of 148 packages and still aborted on nvidia-drivers in 'update-seed'.
#
# nvidia-drivers is not in PROF_LIVE_PKGS and cannot be removed from it. Two
# independent paths reach it: VIDEO_CARDS=nvidia through
# x11-drivers/xorg-drivers, and dev-util/nvidia-cuda-toolkit, which IS in the
# image's @world. Dropping either would not help.
PROF_LIVE_KMOD_PKGS=(
    x11-drivers/nvidia-drivers
    # Same trap, different package: app-emulation/virtualbox (in the list
    # above) RDEPENDs on virtualbox-modules, which is linux-mod-r1 and dies
    # in pkg_setup against the not-yet-built kernel tree — spotted 2026-08-08
    # while wiring virtualbox into nvidiahard, latent here since the world
    # transplant. Without this line run7 would exit 1 on it under
    # --keep-going and skip the overlay step again, exactly like run6 did on
    # the blob.
    app-emulation/virtualbox-modules
    # ...and excluding ONLY the modules is not enough (nvidiahard pass 2,
    # 2026-08-08): virtualbox's RDEPEND is a hard ~virtualbox-modules-${PV},
    # so with the modules excluded and the userland still in the list the
    # graph is UNRESOLVABLE — the resolver backtracks through every vbox
    # version and dies with a misleading REQUIRED_USE error on the oldest
    # (python_single_target_python3_12 on 7.0.26-r1), aborting the whole
    # pass before a single merge. Unlike nvidia-drivers, which only ever
    # arrives via optional dep paths that --exclude prunes cleanly, the
    # userland half must be excluded WITH its modules; the post-kernel
    # 'module-pkgs' replay (no exclusions) then merges the pair together
    # against the built tree. virtualbox stays in PROF_LIVE_PKGS on purpose —
    # that list is what the replay re-emerges.
    app-emulation/virtualbox
    # NOT here: nvidia-container-toolkit / libnvidia-container / hwloc /
    # virtual/opencl and the rest of the userland that hard-RDEPENDs the
    # driver LIBRARIES. Excluding the driver made each of them abort pass 2
    # in turn (resolver version-walks to the p.masked 390.157), and excluding
    # them one by one just moved the failure (docker[cuda] needs the toolkit
    # — 2026-08-08, three failures in a row). The fix is on the other side:
    # nvidiahard's PROF_LIVE_CYCLE_BOOTSTRAP merges the driver userland with
    # USE=-modules up front, so the whole class resolves against an installed
    # driver; the post-kernel replay's --newuse then rebuilds it WITH modules.
)

