# NOT carried over from world, and why.
#
# Each of these resolves in neither ::gentoo nor ::pwr, so listing it would be
# a resolver error that aborts the whole run. Importing the ebuild into ::pwr
# is the way to get any of them back — the security policy is about review, not
# about which overlay the ebuild came from.
#
#   games-misc/asciiquarium          ::guru           toy
#   games-misc/cbonsai               ::guru           toy
#   games-util/mangohud              ::guru           Vulkan/OpenGL overlay
#   gui-apps/rofi-wayland            ::guru           launcher (wofi is listed)
#   gui-apps/wlogout                 ::guru           logout menu
#   gui-apps/hyprpicker              ::hyproverlay    colour picker
#   games-util/steam-launcher        ::steam-overlay
#   dev-python/nltk                  ::stuff          NLP corpora
#   dev-python/nvidia-cudnn-frontend ::stuff
#   app-misc/nanoeuler               local            pinned fork, no ebuild
#
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Licences beyond the profile default.
#
# A licence mask is a resolver error, so one unaccepted token aborts the whole
# 'pkgs' run rather than skipping the package — --keep-going cannot route
# around it. ACCEPT_LICENSE is incremental: xstage appends this to the
# profile's own value.
#
# @BINARY-REDISTRIBUTABLE is the baseline rather than a list of atoms, which is
# what sys-kernel/linux-firmware taught: its LICENSE hides the token inside a
# USE-conditional, 'redistributable? ( linux-fw-redistributable ... )', so an
# atom-by-atom audit walks straight past it. The group is @FREE plus exactly
# the redistributable-binary class — firmware, microcode, unRAR, Broadcom,
# NVIDIA-r*, no-source-code — which is also what covers x11-drivers/nvidia-drivers.
#
# The first group is amdkdehard's audited list; the rest were found by
# probing this profile on 2026-08-05. NOTE: this is a plain double-quoted
# string, so a '#' inside it is a literal token, not a comment — every
# annotation stays out here, above the assignment.
#
#   NVIDIA-CUDA           dev-util/nvidia-cuda-toolkit, and sys-apps/hwloc[cuda]
#                         reaches it even without the toolkit listed
#   NVIDIA-cuDNN          dev-libs/cudnn        <- the ML stack
#   NVIDIA-SDK-v2020.10.12
#   NVIDIA-cuSPARSELt-v2020.10.12
#                         dev-libs/cusparselt   <- sci-ml/pytorch
#   NVIDIA-2025           x11-drivers/nvidia-drivers (the rest of its LICENSE is
#                         covered by @BINARY-REDISTRIBUTABLE, this token is not)
#   JetBrains-*           dev-util/pycharm-community
#   MPEG-4                media-libs/faac       <- global USE 'faac'
#   Intel-ISSL            sci-biology/plink2-bin (::pwr, PROF_LIVE_OVERLAY_PKGS)
#                         Not in @BINARY-REDISTRIBUTABLE only because that group
#                         is built from the licences in ::gentoo, and this one is
#                         shipped by ::pwr. On its terms it belongs there: the
#                         Intel Simplified Software License (Oct 2022) opens with
#                         "You may use and redistribute the software, which is
#                         provided in binary form only, ... without modification",
#                         conditioned on reproducing the notice and terms with the
#                         distribution. The image satisfies that by construction —
#                         'conf' rsyncs ::pwr into /var/db/repos/pwr, licences and
#                         all, so the text travels inside the squashfs. Note the
#                         other clause it carries: no reverse engineering and no
#                         modification, including at run time.
#   Apple-Sample-Code     sci-ml/cut-cross-entropy <- sci-ml/unsloth, i.e. the
#                         PROF_LIVE_OVERLAY_PKGS step, not 'pkgs'. Redistributable
#                         on the same shape of condition as Intel-ISSL: it grants
#                         the right to "use, reproduce, modify and redistribute",
#                         provided a full redistribution keeps the notice, terms
#                         and disclaimers. Source, not a binary blob.
#
# The NVIDIA set was swept out of metadata/md5-cache across dev-libs, sci-libs,
# sci-ml, dev-util in one pass, rather than collected one failed run at a time.
# ---------------------------------------------------------------------------
PROF_LIVE_ACCEPT_LICENSE="@BINARY-REDISTRIBUTABLE
                          RAR Microsoft-vscode OTN BUSL-1.1 Spotify VOSTROM
                          all-rights-reserved android google-chrome OPERA-2018
                          FastFlowLM-Binary AMD-Binary-Only HIDAPI free-noncomm
                          MSttfEULA OSGi-Specification-2.0 Watcom-1.0
                          JetBrains-business JetBrains-classroom
                          JetBrains-educational JetBrains-individual
                          MPEG-4 Intel-ISSL Apple-Sample-Code
                          NVIDIA-CUDA NVIDIA-cuDNN NVIDIA-2025
                          NVIDIA-SDK-v2020.10.12 NVIDIA-cuSPARSELt-v2020.10.12"
