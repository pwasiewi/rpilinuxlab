# xp profile: amd64 KDE Plasma live image — systemd desktop, NOT hardened.
#
# This is the "copy of gen2db" image: same portage profile as the host
# (default/linux/amd64/23.0/desktop/plasma/systemd), same USE, same CPU
# targeting, and a package list derived mechanically from the host's world
# file. Where amdkdehard is a deliberately reduced audit appliance, this
# one is the full workstation — NVIDIA proprietary stack, CUDA, and the whole
# unsloth/vLLM training stack from ::pwr included.
#
# Relationship to amdkdehard.conf: that profile SOURCES this one and then
# replaces PROF_LIVE_PKGS, PROF_LIVE_USE, PROF_LIVE_VIDEO_CARDS and the repo
# list wholesale. Everything it does not override, it inherits from here.
PROF_NAME=amdkde
PROF_KIND=native
PROF_XSTAGE_TARGET=amd64
PROF_XLAB_TARGET=x86_64

# systemd, matching the host. The seed has to match too: unpacking an OpenRC
# stage3 and only switching the portage profile afterwards leaves the entire
# userland built without systemd in it, which an 'emerge -e @world' then has to
# undo — hours this avoids.
PROF_STAGE3_FLAVOR=desktop-systemd
PROF_LIVE_PORTAGE_PROFILE="default/linux/amd64/23.0/desktop/plasma/systemd"

PROF_LIVE_HOSTNAME=kdelive
PROF_LIVE_VOLID=AMD64KDE          # ISO9660 volume id (uppercase, <= 32 chars)
PROF_BUILD_SUBDIR=amdkde        # own tree under rpilinuxlab/build/
PROF_LIVE_XSESSION="startplasma-wayland"

# The sources /usr/src/linux/.config is built against (pkgs pre-merge checks
# and the genkernel build both read it). zen-sources, to match the tree the
# package list below already ships — the xstage default (gentoo-sources)
# would put a second, unused source tree in the image. The hardened variant
# inherits this: kernel-side hardening comes from the KSPP fragment merged
# onto the config, not from the source tree.
PROF_LIVE_KERNEL_PKG="sys-kernel/zen-sources"


# Baked boot cmdline for the gen2db desktop (RTX 5070 Ti): CONFIG_CMDLINE via
# a profile-scoped kernel fragment (bare name resolves against
# genstage/live/kernel/). amdkdehard — the T14 image that sources this file —
# clears it again; nvidiahard re-sets it.
PROF_LIVE_KFRAGS="nvidia-desktop.fragment"

# ---------------------------------------------------------------------------
# USE
#
# An array, not a string: '#' inside a double-quoted string is a LITERAL, so a
# "commented" USE list silently turns every comment word into a flag. Flattened
# into PROF_LIVE_USE at the end.
#
# Transcribed from this host's make.conf, with four classes of change:
#
#  1. Dead flags dropped — '-libav -infinality -pax_kernel -qt4 -mediacenter
#     -cleartype -consolekit -hal' appear in the IUSE of ZERO ebuilds in
#     ::gentoo + ::pwr. (Several are still live in other overlays the host has
#     configured, which is why they survived on the host itself; this image
#     configures two repos, so here they are genuinely dead.)
#  2. Rare flags moved to package.use — 32 positive flags had six or fewer
#     consumers each. See live/common/etc/portage/package.use/rare-flags.use.
#     NEGATIVE flags stay global even when rare: as blanket policy they cost
#     nothing and need no consumer list.
#  3. Cycle-forming flags scoped down rather than dropped — see zz-image.use.
#  4. Image-only size trims added to the 'off' group at the bottom.
#
# Unlike the hardened profile, this one does NOT have to re-supply the 75 USE
# defaults the desktop/plasma target ships: it IS that target. Only what the
# host adds on top of the profile belongs here.
# ---------------------------------------------------------------------------
_use=(
    # desktop session
    wayland plasma kde qt6 -qt5 -gnome systemd -elogind
    # boot and firmware
    uefi grub experimental aio bpf rtlsdr keyring policykit suid mount
    # toolchain, libraries, frameworks
    jit graphite gold openmp smp
    fortran glib boost icu introspection gstreamer dbus libnotify
    gd xml -gnome-keyring -nautilus gpm libproxy
    # graphics and display. 'nvidia' and 'cuda' are the headline difference
    # from amdkdehard, which sets both negative.
    X opengl egl vulkan vdpau vaapi gbm osmesa cairo sdl gtk gtk3 -gtk2
    nvidia cuda gpu xrandr xcb drm kms dmx xv xinerama
    shaders layers
    jpeg jpeg2k png tiff gif svg pdf exif lcms
    imagemagick qrcode qml gles2 harfbuzz
    # languages, development, editors
    python java lua perl vala tcl tk debugger profiler
    vim-syntax text
    # security and network
    ssl sslv3 cryptsetup gpg pkcs11 ipv6 wifi network ldap vnc
    -automount -nss gnutls savedconfig acl gcrypt
    # audio, video, codecs, compression
    alsa pulseaudio jack oss openal a52 aac faad flac mp3 ogg vorbis
    dts ffmpeg mpg123 x264 xvid theora bluray v4l v4l2 wmf mng 3dnow
    lzma lz4 lzo zstd zip dvd cdr ieee1394 musicbrainz fdk vlc video
    # fonts and typography.
    # 'fontforge' deliberately absent, though the host carries it: on
    # media-fonts/* it means "rebuild the fonts from source with fontforge",
    # which is not what anyone wants from a prebuilt TTF and which builds a
    # cycle out of it — virtual/ttf-fonts -> liberation-fonts -> fontforge
    # -> gtk+:3 -> pango -> libXft -> virtual/ttf-fonts. The host carries the
    # flag harmlessly because its fonts were installed years ago; a
    # from-scratch image has to build the loop. Worth about 50 packages.
    truetype freetype xetex latex
    # filesystems, hardware, system services, databases
    fat btrfs xfs hfs f2fs aufs overlay xattr lvm
    udev usb bluetooth fuse threads device-mapper pcap sqlite
    postgres -mysql json
    # math, science, misc
    lapack flexiblas -mpi -mpi-threads R extras tools utils contrib extra dot
    postproc unicode cups djvu bash-completion gnuplot
    # ------------------------------------------------------------------
    # off
    #
    # The first two lines are the host's own list. The rest are image-only
    # trims: a live image is built once from nothing, so documentation targets
    # that cost a host nothing cost this image real hours. Consumer counts from
    # an IUSE census of ::gentoo (32804 ebuilds), 2026-08-05:
    #
    #   -doc         5862  already global on the host
    #   -debug       3949  keeps an accidental debug build out of the ISO
    #   -examples    1466  sample code and data, never the library itself
    #   -gtk-doc      282  each consumer drags in gtk-doc + the docbook stack
    #   -handbook     212  KDE's DocBook manuals; meinproc runs per package
    #   -emacs        203  pulls a whole editor in as a build dependency
    #
    # NOT trimmed, on purpose: '-nls' (L10N=pl is the point), '-introspection'
    # (pango depends on harfbuzz[introspection?], so turning it off takes the
    # whole GTK/PyGObject binding layer with it) and '-test' (already off via
    # FEATURES, and the flag is USE-masked in most ebuilds anyway).
    # ------------------------------------------------------------------
    -bindist -systemtap -eselect-ldso -webkit -opencl -objc -objc++ -objc-gc
    -static-libs -pic -valgrind -apache -apache2 -hardened
    -doc -debug -examples -gtk-doc -handbook -emacs
)
PROF_LIVE_USE="${_use[*]}"
unset _use

# Driver set stays broad (same reasoning as the host's make.conf): the ISO may
# boot on a machine other than the one that built it. 'nvidia' here is not just
# a hint — x11-base/xorg-drivers carries
#     video_cards_nvidia? ( x11-drivers/nvidia-drivers )
# so this line is what actually pulls the proprietary driver in. 'radeon'
# accompanies 'radeonsi' because the xf86-video-ati DDX wants
# x11-libs/libdrm[video_cards_radeon]; radeonsi alone is an unsatisfiable USE
# dependency, i.e. a resolver error rather than a missing driver.
PROF_LIVE_VIDEO_CARDS="amdgpu radeonsi radeon nvidia nouveau intel i915 i965 iris"

# CPU targeting. Same reasoning as amdkdehard: the image is for a
# ThinkPad T14 Gen 6 (Ryzen AI, Zen 5) but is built on gen2db, a Ryzen 9 5950X
# (Zen 3), so the baseline is the BUILD host's ISA. znver3's feature set is a
# strict subset of znver5's, so one build boots on both and the ISO can be
# smoke-tested here first.
#
# Spelled out rather than left as '-march=native', which resolves to exactly
# this today. The difference shows up the day the profile is built elsewhere:
# 'native' would silently retarget and the ISO would stop booting on the T14
# with nothing in any log to say why.
PROF_LIVE_CFLAGS="-march=znver3 -mtune=znver5 -O2 -fomit-frame-pointer -pipe"

# cpuid2cpuflags on gen2db, verbatim. 'sse4a' belongs here — AMD-only, and both
# machines are AMD. No avx512*: the 5950X has none, and a flag the build host
# cannot execute breaks test phases long before the laptop ever sees it.
PROF_LIVE_CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul
    popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

# Two python slots, matching the host. The ::gentoo profile default is
# python3_14 alone, and packages upstream has not ported yet carry a
# REQUIRED_USE naming only older slots — an unsatisfiable REQUIRED_USE is a
# resolver error, so one such package aborts the entire 'pkgs' run. (The
# original example, sys-process/criu-4.1 wanting any-of ( python3_12
# python3_13 ), was dropped from the lists 2026-08-06 — kernel-7.x rseq.h
# header conflict — but the two-slot safety net stays.)
PROF_LIVE_PYTHON_TARGETS="python3_13 python3_14"
PROF_LIVE_PYTHON_SINGLE_TARGET="python3_14"

# Raw make.conf lines, appended last. USE_EXPAND variables have to be set here
# and NOT as USE tokens: USE adds a flag, the variable replaces the profile's
# whole set. 'llvm_slot_21' in USE left mesa's own '+llvm_slot_22' IUSE default
# enabled beside it, and mesa's REQUIRED_USE is '^^ ( llvm_slot_18 …
# llvm_slot_22 )' — a resolver error, which aborts the whole run. One slot, the
# same one the host pins.
#
# 21 and NOT 22, though llvm-22.1.8 is stable and several ebuilds now default to
# '+llvm_slot_22'. The ceiling is dev-qt/qttools, a hard dep of the Plasma
# stack: the only released version, 6.11.1, is '^^ ( llvm_slot_17 …
# llvm_slot_21 )'. Slot 22 appears only in its 9999 ebuilds. Under
# LLVM_SLOT="22" qttools would have no llvm_slot flag enabled at all —
# unsatisfiable '^^', run aborted. app-text/doxygen-1.15.0-r2 caps at 21 too
# (1.16.1 would be fine). Revisit when qttools 6.12 is released; check with:
#   grep -m1 ^REQUIRED_USE= "$(portageq get_repo_path / gentoo)"/metadata/md5-cache/dev-qt/qttools-*
PROF_LIVE_MAKECONF_EXTRA=(
    'LLVM_SLOT="21"'
    # The host builds grub for "pc efi-64". The image also ships
    # dev-util/catalyst, whose [iso] USE requires grub[grub_platforms_efi-32,
    # grub_platforms_efi-64] so it can author 32-bit-EFI-bootable ISOs — a
    # resolver error, not a build failure, so it aborts the whole run. efi-32
    # costs one extra grub target and nothing else.
    'GRUB_PLATFORMS="pc efi-32 efi-64"'
    # Which GPU the CUDA half is compiled for. Neither is a USE_EXPAND — both
    # are plain variables read by the build systems, so package.use cannot
    # carry them and only a make.conf line will do. Both are transplanted from
    # this host's make.conf, where they name the RTX 5070 Ti: compute
    # capability 12.0, i.e. sm_120.
    #
    # Not optional, and the failure is not obvious. dev-libs/cutlass defaults
    # to -DCUTLASS_NVCC_ARCHS="${CUDAARCHS:-all-major}", and with 'all-major'
    # against CUDA 13 its generator ends up with an empty entry in the arch
    # list and dies in a Python traceback inside a cmake message:
    #   ValueError: invalid literal for int() with base 10: ''
    # reported only as "Error generating library instances" (cutlass-4.4.2,
    # 2026-08-07). The host never saw it because it still has cutlass-4.2.1
    # installed and this image resolves to the newest.
    #
    # TORCH_CUDA_ARCH_LIST is the same decision for caffe2/pytorch; left unset
    # it makes torch either probe for a GPU that a chroot does not have, or
    # build every architecture CUDA knows.
    'CUDAARCHS="120"'
    'TORCH_CUDA_ARCH_LIST="12.0"'
)

# ---------------------------------------------------------------------------
# Build knobs
# ---------------------------------------------------------------------------
# Shared with the host, bind-mounted by xstage during 'pkgs'/'emerge'/'enter'
# and excluded from the squashfs, so none of it can end up in the ISO.
#
# ccache is safe to share even across differently-configured trees: ccache keys
# an object on the compiler binary and the whole command line, so two toolchains
# never hand each other an object. DISTDIR is the big win — a fresh resolution
# wants ~12 GB of tarballs and this host already holds most of them; the
# hardened image's first run came down to 1.75 GB of actual downloads.
#
# PORTAGE_TMPDIR gets a subdirectory of its own rather than the host's
# /var/tmp/portage itself. Portage does not lock across chroots, so sharing it
# meant a host emerge and an image 'pkgs' could land in the same
# <category>/<pf> build tree and quietly corrupt each other — and the same went
# for two image profiles running at once. A per-profile directory removes the
# hazard instead of documenting it.
#
# It stays UNDER /var/tmp/portage on purpose: that path is a bind mount to
# /home/tmp/portage (sda5, ~250 GB free). A sibling like /var/tmp/portage-amdkde
# would sit on / instead, which has under 10 GB and would die on the first big
# package. Inside the chroot it is still bound at /var/tmp/portage, so
# PORTAGE_TMPDIR does not change and 'squash' excludes it exactly as before.
#
# Side effect worth knowing: the directory shares a namespace with portage's
# own <category> directories, so a blanket 'rm -rf /var/tmp/portage/*' takes
# image build trees with it. That costs nothing. Portage wipes <category>/<pf>
# at the start of every package build (no keepwork, no noclean anywhere here),
# so a build tree never carries work forward — what does is on separate bind
# mounts: ccache, PKGDIR (FEATURES=buildpkg), DISTDIR, and the merged packages
# in the rootfs.
PROF_LIVE_CCACHE_DIR="/var/cache/ccache"
PROF_LIVE_DISTFILES_DIR="/var/tmp/distfiles"
PROF_LIVE_BUILDDIR="/var/tmp/portage/amdkde"

# getbinpkg IS enabled here, and is the single biggest difference in build time
# from amdkdehard, which must refuse it.
#
# Why it is safe here and not there: Gentoo's binhost builds against the plain
# amd64 profiles with a non-hardened toolchain. --binpkg-respect-use compares
# USE flags and NOTHING ELSE — not toolchain defaults, not CFLAGS. In a
# hardened image that means a package whose USE happens to match is accepted
# even though it has no default PIE, no SSP and no FORTIFY, which is the exact
# failure mode that profile exists to prevent. This image makes no such
# promise: it is the host's profile, built by the host's class of toolchain, so
# a binhost package is the same kind of object the host itself installs.
#
# The honest cost: a binhost package is built for generic x86-64, so accepting
# one throws away -march=znver3 for that package. --binpkg-respect-use=y and
# --binpkg-changed-deps=y at least guarantee the USE and dependency graph
# match; anything whose USE differs from the binhost's is still built here, and
# with this profile's large custom USE that will be most of the desktop. Expect
# the win on leaf packages and the toolchain, not on the KDE stack.
#
# Unsigned binhost packages are refused per-repository, via 'verify-signature =
# true' in the image's binrepos.conf — that is what makes getbinpkg defensible
# at all. It is NOT done with FEATURES=binpkg-request-signature; see the
# PROF_LIVE_FEATURES block below for why that one cannot be used here.
#
# FEATURES=buildpkg makes this chroot its own binhost as a side effect, so a
# rebuild of the image reuses what the first run compiled.
#
# --usepkg-exclude is the other honest cost of getbinpkg, and it is not about
# CFLAGS. Gentoo's binhost is a snapshot; the tree it is built from keeps
# moving, so a binhost package can carry a subslot dependency on a language
# runtime older than the one this image ends up with. Portage records the
# RESOLVED subslot at build time, so the stale pin travels inside the binary
# and no amount of --binpkg-changed-deps catches it — that option compares
# EBUILD dependency strings, which did not change.
#
# Measured here 2026-08-07, in pass 2 of a 1549-package plan:
#   dev-lang/perl:0 — ~100 dev-perl/* and virtual/perl-* binaries pin
#   'dev-lang/perl:0/5.42=' while the image installed 5.44, so portage tried
#   to merge perl-5.42.2 alongside it and gave up on the slot conflict.
# perl-module.eclass puts 'dev-lang/perl:=' in RDEPEND, which is why only
# refusing the binaries fixes it: built here, the modules link against
# whatever perl is actually installed. ~100 tiny modules, seconds each.
#
# This list is deliberately whole-family rather than a list of the offending
# versions: it stays correct across every future perl bump, where a version
# list would have to be re-tuned each time the binhost falls behind.
#
# The go half of the same failure (binaries pinning 'dev-lang/go:0/1.26.3='
# against an installed 1.26.5) is NOT solved here — go is a BDEPEND, so it is
# fixed with --with-bdeps=n on pass 2 instead. See genstage/xstage.
#
# Deliberately absent: --autounmask-write. 'pkgs' is non-interactive, and
# portage answers autounmask-write by writing into the image's /etc/portage and
# then aborting for a dispatch-conf review — it converts a clear resolver error
# into a stalled run, and mutates the image's config behind the profile's back.
#
# --update --newuse --deep is not optional. The stage3 arrives with its own USE;
# this profile then asks for a large custom USE and its own CFLAGS. Without
# --newuse portage refuses to rebuild an installed package just because a flag
# changed, and reports it as "no ebuilds built with USE flags to satisfy",
# which reads like a missing package.use entry and is not one.
PROF_LIVE_EMERGE_OPTS="--jobs=16 --load-average=32 --quiet-build=y
                       --update --newuse --deep
                       --getbinpkg --binpkg-respect-use=y --binpkg-changed-deps=y
                       --keep-going --verbose-conflicts
                       --usepkg-exclude 'dev-lang/perl dev-perl/* virtual/perl-*'
                       --autounmask-backtrack=y --backtrack=30"

# 'sandbox' and 'parallel-fetch' are already profile defaults. 'fail-clean' is
# left out on purpose: it deletes the build directory on failure, and in an
# image this size the build directory is the only evidence of what broke.
# 'strict' makes Manifest enforcement a hard error.
#
# binpkg-request-signature is deliberately NOT here, and the reason is that it
# cannot coexist with buildpkg in this chroot (measured 2026-08-07, the
# zen-sources build in the 'kconfig' step). That FEATURE is global: it applies
# to every binary package portage touches, including the one it has just built
# itself. The host signs what it builds (FEATURES=binpkg-signing, "gen2db
# binpkg signing" key 0BF743AF...AF303ACE), but the image must not — a private
# signing key inside a rootfs that ships as livecd.squashfs is a key given
# away, and 'conf' therefore seeds /etc/portage/gnupg with public material
# only. So the first package built from source ends like this:
#
#   >>> Done.
#   * Binary package is not usable (verification failed):
#   *   binpkg appears unsigned (missing any signature)
#   !!! Invalid binary package: '/var/cache/binpkgs/.../zen-sources-...gpkg.tar'
#
# and the merge never happens — the build itself was fine. Self-defeating in
# both directions, too: a package the image builds this run is refused by the
# image on the next one, which is exactly the reuse buildpkg exists for.
#
# The security intent survives without it. The remote Gentoo binhost is the
# thing that must not be trusted unsigned, and binrepos.conf carries a
# per-repository 'verify-signature = true' for it (portage >= 3.0.74; the
# FEATURE only ever OVERRODE that setting, see the make.conf(5) wording "takes
# precedence over binrepos.conf"). Locally built packages in PKGDIR stay
# unverified, which is the same trust as the chroot's own filesystem.
#
# One thing genuinely lost: getuto (PORTAGE_GPG_KEY_SERVER helper) runs only
# when binpkg-request-signature is in FEATURES, so the image's keyring is no
# longer refreshed automatically — it is whatever 'conf' copied from the host.
# Refresh the host's, and the image inherits it on the next 'conf'.
PROF_LIVE_FEATURES="buildpkg getbinpkg strict"

# The host's own PKGDIR, shared: Gentoo-official signed gpkg the host already
# downloaded plus everything it builds and signs from now on. Same machine,
# same znver3 toolchain class.
PROF_LIVE_BINPKGS_DIR="/var/cache/binpkgs"

# Config fragments deployed into the image before 'pkgs' runs. 'common' is the
# host transplant shared with amdkdehard:
#
#   package.accept_keywords/host.keywords  the host's testing-only atoms; without
#                                          it 'pkgs' aborts on the first of 45
#   package.accept_keywords/image.keywords live ebuilds (KEYWORDS="" needs '**',
#                                          not '~amd64') and deps pulled by
#                                          versions the host does not resolve to
#   package.use/host.use                   the host's per-package USE
#   package.use/rare-flags.use             the flags moved out of global USE
#   package.use/zz-image.use               the build-time cycle cuts
#
# This profile needs no 'desktop-profile.use' layer — that file exists to give
# the hardened profile the package.use entries the desktop target ships, and
# this profile IS the desktop target.
#
# 'amdkde' is a one-file layer: package.mask/cuda-gcc-cap.mask (>=gcc-16),
# which pins THIS image's whole toolchain to gcc-15. Its own layer, not the
# shared one, because amdkde must stay gcc-15 (it reuses the gcc-15 host's
# binpkg pool) while the hardened images move to gcc-16 — full rationale in
# the mask file. amdkdehard takes no such layer and builds gcc-16; nvidiahard
# builds gcc-16 and forces gcc-15 only on the CUDA packages via
# package.env/gcc15.conf in 'common'.
#
# The absolute entry is the personal install payload (NOT in this repo;
# refresh with ~/Claude/secure-host/live-overlay-sync.sh before building).
# This image re-installs the BUILD HOST itself, so it carries the host's own
# /etc snapshot; the T14 kit (~/Claude/secure/) rides the hardened image.
#   /usr/local/bin           e, chroot-mount, efi-keys, efi-boot,
#                            build-initrd-uuid-next
#   /root/host               host /etc snapshot (secret-free), gentools
#                            walkthrough, SECRET-MANIFEST of what to restore
#                            from the encrypted partition (SB keys land in
#                            /root/secureboot at install time, not here)
# 'tools' = the public install toolchain (live/tools-sync.sh mirrors it from
# ~/Claude/bin): build-usb/nvme, montuj, luks, chroot-mount, efi-keys/boot,
# e + ve family, build-initrd-uuid-next. Applied before the personal payload.
# 'nvidia' = the shared desktop-GPU layer (modprobe nvidia.conf), same pair
# as the nvidia-desktop.fragment kernel cmdline; also used by nvidiahard.
PROF_LIVE_OVERLAY_DIR="common amdkde nvidia tools /home/pwas/Claude/secure-host/live-overlay"

# ---------------------------------------------------------------------------
# Repositories
#
# Security policy: only first-party overlays — repos whose every ebuild was
# written or reviewed here (::pwr, ::stuff). An image that synced ::guru at
# build time would execute whatever ::guru happened to contain that day.
#
# ::stuff added 2026-08-16 (operator decision): amdkde is nvidiahard's
# machine class without the hardened layer, and its CUDA/ML chain (cudnn,
# unsloth deps, ...) is canonical in ::stuff — the pwr↔stuff duplicate audit
# stopped importing those wholesale into ::pwr. NOTE: this file is the ROOT
# of the profile chain; amdkdehard explicitly resets the list back to "pwr"
# so the hardened family keeps its narrower invariant (nvidiahard then
# re-adds stuff on its own).
# ---------------------------------------------------------------------------
PROF_LIVE_REPOS="pwr stuff"

# The @kde-* sets are defined by ::kde, a repo this image will not configure,
# so emerge inside the chroot would fail with "There are no sets to satisfy".
# The three lists were copied into ::pwr under prefixed names — every atom in
# them resolves in ::gentoo, only the grouping was ::kde's. The prefix keeps
# them from shadowing ::kde's originals on hosts that have both repos.
PROF_LIVE_SETS="@pwr-kde-baseapps-26.04 @pwr-kdegraphics-26.04 @pwr-kdeutils-26.04"

# Optional: pull whole tiers from profiles/amd64.pkgs in addition to the list
# below. Empty — this profile spells everything out.
PROF_LIVE_TIERS=""

# ---------------------------------------------------------------------------
# PROF_LIVE_PKGS — the ::gentoo half of the package list.
#
# Derived mechanically from this host's world(5) (664 entries, 2026-08-05):
#
#   -12  crossdev-generated atoms (cross-*/gcc, glibc, binutils,
#        linux-headers). These are not ebuilds in any repo — crossdev generates
#        them into a local overlay. sys-devel/crossdev is listed below instead,
#        so the image can regenerate whichever toolchain it needs; see the
#        gentoo-crosscompile skill and bin/xarm.
#   -12  atoms that exist in no repo this image configures (listed near the
#        end of this file with what each would cost to keep).
#  -269  atoms that another listed atom already pulls in transitively.
#
# That last reduction is the one worth explaining. It is computed over the
# RDEPEND+PDEPEND graph of the installed system, resolved with each package's
# actual USE, condensed to its strongly-connected components, and reduced to
# the roots — so 'sci-ml/pytorch' drops out because 'sci-ml/unsloth' reaches
# it, and the firefox <-> firefox-l10n cycle keeps one representative.
#
# Two groups are exempt from that reduction and listed explicitly anyway:
#
#   * the desktop/boot/base core (first group). A world file is not an image
#     package list — on a running host those arrive as dependencies of things
#     installed years ago, so world never names them. Copying world verbatim
#     builds a "KDE image" with no Plasma, no Xorg and no bootloader.
