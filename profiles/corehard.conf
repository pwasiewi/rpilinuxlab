# xp profile: intelhard retargeted at pre-Haswell Intel Core laptops (x86-64-v2).
#
# Born from a real boot, not a hypothetical: the intelhard stick panicked on a
# Lenovo Z500 (i7-3612QM, Ivy Bridge, 2026-08-15) — "trap invalid opcode in
# busybox" straight after "Run /init as init process". Ivy Bridge has AVX but
# no AVX2/BMI1/2/FMA, so it tops out at x86-64-v2; intelhard floors at v3 ON
# PURPOSE (Skylake-Core fleet) and its entire userland is illegal on this
# class of machine. Same derivation pattern as intelhard-from-amdkdehard:
# source the parent, override only the ISA floor and the caches. Everything
# else — hardened package list, kernel fragments (camera), printer/firewall
# payloads, intel-microcode (this die is in the old_microcode bug list, so
# early ucode load matters even more here), the Ryzen-AI overlay filter —
# carries over.
_here="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
source "${_here}/intelhard.conf"

PROF_NAME=corehard
PROF_LIVE_HOSTNAME=corehard
PROF_LIVE_VOLID=COREHARD
PROF_BUILD_SUBDIR=corehard

# v2 floor. -mtune=generic rather than ivybridge: scheduling for the whole
# old-Core spread (SnB/IvB and any v2-capable stray), not one die.
PROF_LIVE_CFLAGS="-march=x86-64-v2 -mtune=generic -O2 -fomit-frame-pointer -pipe"

# The Z500's own flag set (cpuinfo read off the machine, 2026-08-15): the v2
# baseline plus the AVX1-era extras every SnB/IvB Core has. Dropped from the
# parent: avx2 bmi1 bmi2 fma3 (all Haswell+). rdrand stays — introduced with
# Ivy Bridge. If an even older machine joins the fleet (Nehalem/Westmere:
# no avx/f16c/aes/rdrand), trim those four and re-floor; -march=x86-64-v2
# itself already runs there.
PROF_LIVE_CPU_FLAGS_X86="aes avx f16c mmx mmxext pclmul popcnt rdrand sse
    sse2 sse3 sse4_1 sse4_2 ssse3"

# Own caches for the same reason intelhard has its own: v3 objects are
# illegal here, so neither the binpkg pool nor the ccache may be shared with
# ANY sibling profile. Backing store: ramstart1 binds /home/tmp/binpkgs-corehard
# and /home/tmp/ccache-corehard onto these paths — run it before the first
# pkgs; xstage only warns-and-skips ccache when the dir is missing.
PROF_LIVE_BINPKGS_DIR="/var/cache/binpkgs-corehard"
PROF_LIVE_CCACHE_DIR="/var/cache/ccache-corehard"

# ---------------------------------------------------------------------------
# Operator trims (2026-08-16): no Oracle / Java payload on this fleet.
# ---------------------------------------------------------------------------
# The whole restrict-run stack goes. dev-db/sqldeveloper (RESTRICT=fetch,
# drags the obsolete openjdk:11[javafx] -> openjfx:11 -> openjdk-bin:11
# bootstrap) was the named target; dev-libs/libxml2-compat +
# net-libs/webkit-gtk:4 + net-libs/libsoup:2.4 are the retro soname stack
# that exists solely for cisco-secure-client's 2024 binaries — with the trio
# removed the client would ship dead (vpnagentd links libxml2.so.2,
# acwebhelper libwebkit2gtk-4.0.so.37), so it leaves with them. Re-adding
# cisco later means re-adding the trio BEFORE it, in the parent's order.
PROF_LIVE_RESTRICT_PKGS=()

# The modern LTS JDK stays (operator 2026-08-16: "openjdk-bin 22 zostaje" —
# no such slot exists in the tree, 21 is the LTS the parent actually ships,
# kept as the intended target). Cut: the archaic openjdk-bin:8 and any
# openjfx (its only consumer was the sqldeveloper chain above).
_pkgs_nojava=()
for _p in "${PROF_LIVE_PKGS[@]}"; do
    case ${_p} in
        dev-java/openjdk-bin:8|dev-java/openjfx*) ;;
        *) _pkgs_nojava+=("${_p}") ;;
    esac
done
PROF_LIVE_PKGS=("${_pkgs_nojava[@]}")
unset _pkgs_nojava _p

# KMOD hygiene: virtualbox never ships here — amdkdehard's package-list
# rewrite already dropped it (verified: absent from the intelhard rootfs
# too) — and nvidia-drivers goes with it (operator 2026-08-16): the GPUs of
# this laptop era are pre-Maxwell, unsupported by the current blob, and the
# inherited VIDEO_CARDS already says nouveau with no nvidia token, so the
# xorg-drivers edge that could resurrect the blob does not exist in this
# profile. All three inherited entries were inert exclusion guards.
_kmod_trim=()
for _p in "${PROF_LIVE_KMOD_PKGS[@]}"; do
    case ${_p} in
        app-emulation/virtualbox|app-emulation/virtualbox-modules|x11-drivers/nvidia-drivers) ;;
        *) _kmod_trim+=("${_p}") ;;
    esac
done
PROF_LIVE_KMOD_PKGS=("${_kmod_trim[@]}")
unset _kmod_trim _p

# Own overlay layer appended before the personal payload: carries the
# JDK-slot mask (package.mask/corehard.mask) — without it virtual/jdk
# resolves to the newest slot and a second JDK rides in beside :21.
PROF_LIVE_OVERLAY_DIR="common hardened tools corehard /home/pwas/Claude/secure/live-overlay"

# Minecraft on this fleet is a real use (operator 2026-08-16: runs smoothly
# even on this hardware class) — the Modrinth launcher manages its own JRE
# per game version, so it rides beside the single system JDK without
# touching the slot mask above.
PROF_LIVE_OVERLAY_PKGS+=(
    games-util/modrinth-app-bin
)
